  /api/v1/backup-targets:
    get:
      operationId: listBackupTargets
      tags: [backups]
      summary: List S3-compatible backup targets
      responses:
        "200": { description: Targets (credentials never included)., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BackupTarget" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createBackupTarget
      tags: [backups]
      summary: Create a backup target (panel admin+)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateBackupTargetRequest" } } }
      responses:
        "201": { description: Target created., content: { application/json: { schema: { $ref: "#/components/schemas/BackupTarget" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/backup-targets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Backup target ID (bt_… prefix). }
    get:
      operationId: getBackupTarget
      tags: [backups]
      summary: Get a backup target
      responses:
        "200": { description: The target., content: { application/json: { schema: { $ref: "#/components/schemas/BackupTarget" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchBackupTarget
      tags: [backups]
      summary: Edit a backup target (panel admin)
      description: >
        A partial edit: an omitted field is left alone, which is what lets one
        credential rotate without re-sending the other. The merged result is
        validated as a whole, so a PATCH cannot leave a target in a state create
        would have refused. Keys are write-only in both directions and are
        resealed only when sent.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchBackupTargetRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/BackupTarget" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBackupTarget
      tags: [backups]
      summary: Delete a backup target (panel admin+; refused while in use)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: In use by one or more backup schedules., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/databases/{id}/backups:
    parameters:
