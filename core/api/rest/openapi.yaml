        "202": { description: Delivery attempted (a channel failure is logged, not surfaced). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Outbound webhooks (outbound-webhooks.md §7) ──────────────────────────
  #
  # Notifiers talk to people; these talk to machines. Every delivery is POSTed
  # as JSON signed with the endpoint's own secret. Verify it BEFORE parsing —
  # a signature over reserialised JSON signs the wrong bytes:
  #
  #   mac := hmac.New(sha256.New, []byte(endpointSecret))
  #   mac.Write([]byte(ts + "." + string(rawBody)))   // ts = X-CypherPanel-Timestamp
  #   got, ok := strings.CutPrefix(sig, "sha256=")    // sig = X-CypherPanel-Signature
  #   want := hex.EncodeToString(mac.Sum(nil))
  #   if !ok || !hmac.Equal([]byte(want), []byte(got)) { reject() }   // constant time
  #   if abs(now-atoi(ts)) > 300 { reject() }                         // 5-minute replay window
  #
  # Delivery is at-least-once and unordered: dedupe on X-CypherPanel-Delivery.
  /api/v1/projects/{id}/webhook-endpoints:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    get:
      operationId: listWebhookEndpoints
      tags: [webhooks]
      summary: List a project's outbound webhook endpoints
      responses:
        "200": { description: "Endpoints (the signing secret is never included).", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createWebhookEndpoint
      tags: [webhooks]
      summary: Create an outbound webhook endpoint (the signing secret is shown exactly once)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" } } }
      responses:
        "201": { description: "Endpoint created. `secret` is the raw HMAC signing secret and is returned here and never again.", content: { application/json: { schema: { $ref: "#/components/schemas/CreateWebhookEndpointResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: An endpoint with that URL already exists in the project. }
  /api/v1/webhook-endpoints/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook endpoint ID (whe_… prefix). }
    get:
      operationId: getWebhookEndpoint
      tags: [webhooks]
      summary: Get an outbound webhook endpoint
      responses:
        "200": { description: The endpoint., content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWebhookEndpoint
      tags: [webhooks]
      summary: Update an endpoint's url, events or enabled flag
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchWebhookEndpointRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: An endpoint with that URL already exists in the project. }
    delete:
      operationId: deleteWebhookEndpoint
      tags: [webhooks]
      summary: Delete an endpoint (its deliveries and attempts go with it)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/webhook-endpoints/{id}/rotate-secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook endpoint ID. }
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Replace the signing secret (returned once; no overlap window)
      responses:
        "200": { description: "The new signing secret. The previous one stops verifying immediately — send a ping to confirm the new one.", content: { application/json: { schema: { $ref: "#/components/schemas/WebhookSecret" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/webhook-endpoints/{id}/ping:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook endpoint ID. }
    post:
      operationId: pingWebhookEndpoint
      tags: [webhooks]
      summary: Send a synthetic webhook.ping delivery to prove the wiring
      responses:
        "202": { description: "Delivery recorded and attempted (detached). webhook.ping is delivery-only — it is never subscribed to, so an endpoint always receives its own pings.", content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The endpoint is disabled. }
  /api/v1/webhook-endpoints/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook endpoint ID. }
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Page an endpoint's delivery log, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Page size; caps at 100.
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: "Seek cursor: return deliveries strictly older than this delivery id."
      responses:
        "200": { description: "A page of deliveries plus the cursor for the next one (empty when this is the last page).", content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDeliveryPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/webhook-deliveries/{id}/redeliver:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook delivery ID (whd_… prefix). }
    post:
      operationId: redeliverWebhookDelivery
      tags: [webhooks]
      summary: Replay a delivery as a new one
      responses:
        "202": { description: "A new delivery with a fresh id, a fresh attempt schedule and redelivery_of set. The original row is never mutated — the log is evidence.", content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The endpoint is disabled. }

  # ─── Project shared variables (shared-variables.md §7) ────────────────
  #
  # One sealed value defined once for a whole project — or narrowed to a single
  # environment of it — referenced from any application's env vars as
  # {{shared.KEY}}. An environment-scoped variable shadows a project-scoped one
  # of the same key, so scope is a property of the VARIABLE, not of the
  # reference: promoting a value needs no edit in any referencing application.
  #
  # Values are write-only and carry no masked hint: a shared variable is already
  # identified by its key, so a hint would be gratuitous partial disclosure.
  # `key` and `environment_id` are immutable after create, and DELETE is guarded
  # with no force override — changing or removing either silently re-points or
  # orphans every referencing application.
  #
  # Changing a value does NOT redeploy anything. Every referencing application
  # reports `redeploy_pending: true` until it is deployed again; one edit
  # silently redeploying production is not a thing this API does.
  /api/v1/projects/{id}/shared-variables:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    get:
      operationId: listSharedVariables
      tags: [shared-variables]
      summary: List a project's shared variables (both scopes)
      responses:
        "200": { description: "Shared variables, each with its scope-accurate used-by count. Values are never included.", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SharedVariable" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createSharedVariable
      tags: [shared-variables]
      summary: Create a shared variable (project scope, or scoped to one environment)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSharedVariableRequest" } } }
      responses:
        "201": { description: "Created. The value is sealed at rest and never returned.", content: { application/json: { schema: { $ref: "#/components/schemas/SharedVariable" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A shared variable with that key already exists in this scope. }
  /api/v1/shared-variables/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Shared variable ID (sv_… prefix). }
    get:
      operationId: getSharedVariable
      tags: [shared-variables]
      summary: Get a shared variable
      responses:
        "200": { description: The shared variable., content: { application/json: { schema: { $ref: "#/components/schemas/SharedVariable" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSharedVariable
      tags: [shared-variables]
      summary: Replace the value (key and scope are immutable)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchSharedVariableRequest" } } }
      responses:
        "200": { description: "Updated. Every referencing application now reports redeploy_pending until it is deployed again.", content: { application/json: { schema: { $ref: "#/components/schemas/SharedVariable" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSharedVariable
      tags: [shared-variables]
      summary: Delete a shared variable (refused while anything references it)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Still referenced. The message names the applications; remove the references first — there is no force override." }
  /api/v1/shared-variables/{id}/used-by:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Shared variable ID. }
    get:
      operationId: listSharedVariableUsage
      tags: [shared-variables]
      summary: List the applications that reference this variable
      responses:
        "200": { description: "Scope-accurate usage: an application whose own environment shadows the key is absent, because it does not use this variable.", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SharedVariableUsage" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Notification inbox (notification-inbox.md §6) ────────────────────────
  #
  # The panel's own record of what happened to what you own: the same observed
  # outcomes the notifier channels receive, persisted per user. There is no
  # owner segment in these paths on purpose — the inbox is ALWAYS the caller's,
  # and every route filters on the authenticated user's id. No route accepts
  # another user's id, so tenancy here is a column rather than a resolver.
  #
  # An API token acts as its owner: it reads and clears its owner's inbox and
  # nobody else's.
  /api/v1/inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      summary: Page the caller's own notification inbox, newest first
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean }
          description: "Pass true to return only unread items. Filtered-to-zero is a distinct state from an empty inbox."
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Page size; caps at 100.
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: "Seek cursor: return items strictly older than this item id. Keyset, not offset — a feed gains rows at the head while you page it."
      responses:
        "200": { description: "A page of items plus the cursor for the next one (empty when this is the last page).", content: { application/json: { schema: { $ref: "#/components/schemas/InboxPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/inbox/unread-count:
    get:
      operationId: getInboxUnreadCount
      tags: [inbox]
      summary: The caller's unread count — the bell's number
      responses:
        "200": { description: Unread item count., content: { application/json: { schema: { $ref: "#/components/schemas/InboxUnreadCount" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/inbox/read-all:
    post:
      operationId: markAllInboxRead
      tags: [inbox]
      summary: Mark every unread item read
      responses:
        "200": { description: "How many items this call actually changed. The items stay listed — reading is not deleting.", content: { application/json: { schema: { $ref: "#/components/schemas/InboxMarked" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/inbox/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Inbox item ID (inb_… prefix). }
    post:
      operationId: markInboxItemRead
      tags: [inbox]
      summary: Mark one item read (idempotent)
      responses:
        "204": { description: "Marked. Marking an already-read item returns 204 and changes nothing." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { description: "No such item in the caller's inbox — the same answer an item belonging to someone else gets." }
  /api/v1/inbox/preferences:
    get:
      operationId: getInboxPreferences
      tags: [inbox]
      summary: The caller's muted kinds, and every kind this plane can emit
      responses:
        "200": { description: Preferences., content: { application/json: { schema: { $ref: "#/components/schemas/InboxPreferences" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setInboxPreferences
      tags: [inbox]
      summary: Replace the caller's muted kinds wholesale
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetInboxPreferencesRequest" } } }
      responses:
        "200": { description: Updated preferences., content: { application/json: { schema: { $ref: "#/components/schemas/InboxPreferences" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─── Scheduled tasks (scheduled-tasks.md §7) ──────────────────────────────
  /api/v1/applications/{id}/scheduled-tasks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    get:
      operationId: listScheduledTasks
      tags: [scheduled-tasks]
      summary: List an application's scheduled tasks
      responses:
        "200": { description: Tasks., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduledTask" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createScheduledTask
      tags: [scheduled-tasks]
      summary: Create a scheduled task (cron; command is argv, not a shell string)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateScheduledTaskRequest" } } }
      responses:
        "201": { description: Task created., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/scheduled-tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Scheduled task ID (sch_… prefix). }
    get:
      operationId: getScheduledTask
      tags: [scheduled-tasks]
      summary: Get a scheduled task
      responses:
        "200": { description: The task., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateScheduledTask
      tags: [scheduled-tasks]
      summary: Update a scheduled task
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateScheduledTaskRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteScheduledTask
      tags: [scheduled-tasks]
      summary: Delete a scheduled task
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/scheduled-tasks/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Scheduled task ID. }
    get:
      operationId: listScheduledTaskRuns
      tags: [scheduled-tasks]
      summary: List a task's recent run history
      responses:
        "200": { description: Runs, newest first., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduledTaskRun" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }


components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Session token from /api/v1/auth/login.

  responses:
    BadRequest:
      description: Malformed or invalid request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A backing dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but the caller's role is insufficient for this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        No such resource — also returned when the caller is not a member of the
        owning team, so resource existence never leaks across tenants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message; never contains secrets.

    SetupStatus:
      type: object
      required: [needs_setup]
      properties:
        needs_setup:
          type: boolean
          description: True when the panel has no account yet.

    SetupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        totp_code:
          type: string
          description: >
            Second factor, required only for 2FA-enabled accounts: a 6-digit
            authenticator code or a recovery code. If omitted for such an
            account, login returns 401 with "totp_required": true.

    TOTPStatus:
      type: object
      required: [enabled, recovery_codes_left]
      properties:
        enabled:
          type: boolean
        recovery_codes_left:
          type: integer
          description: Unused single-use recovery codes remaining.

    TOTPEnrollResponse:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry into an authenticator app.
        otpauth_uri:
          type: string
          description: otpauth:// URI the client renders as a QR code.

    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: An authenticator code or a recovery code.

    TOTPVerifyResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: >
            Single-use recovery codes, shown exactly once. Store them now —
            they are the only way in if the authenticator is lost.

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          description: usr_… prefixed ID.
        email:
          type: string
        role:
          type: string
        display_name:
          type: string
          description: What teammates see. Empty means the panel falls back to the address.
        timezone:
          type: string
          description: IANA name the UI reads timestamps in. Empty means UTC.

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 64
          description: Empty clears it, and the address is shown instead.
        timezone:
          type: string
          maxLength: 64
          description: An IANA name such as Europe/Berlin. Empty means UTC.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        revoke_other_sessions:
          type: boolean
          default: false
          description: Sign every other device out. The session making the request survives.

    AvatarResponse:
      type: object
      required: [etag]
      properties:
        etag:
          type: string
          description: Changes when the image does; use it to bust a cached <img>.

    RequestEmailChangeRequest:
      type: object
      required: [new_email, current_password]
      properties:
        new_email: { type: string }
        current_password: { type: string }

    ConfirmEmailChangeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The `id.secret` value from the confirmation link.

    ConfirmEmailChangeResponse:
      type: object
      required: [email, revoked]
      properties:
        email: { type: string }
        revoked:
          type: integer
          format: int64
          description: Other sessions signed out, because the recovery address moved.

    DNSSettings:
      type: object
      required: [configured, kind, config_hint, zone_count]
      properties:
        configured: { type: boolean }
        account_id:
          type: string
          description: The Cloudflare account the zone list is scoped to. Empty for a user-owned token.
        account_name:
          type: string
          description: Display only; the id is what is authoritative.
        kind: { type: string, enum: [cloudflare], description: The provider kind. Only Cloudflare at v1. }
        config_hint:
          type: string
          description: >-
            Names the zones the token can reach — the thing an operator actually wants
            confirmed. Never the token itself.
        zone_count: { type: integer }
        updated_at: { type: string, format: date-time }

    SetPanelDNSRequest:
      type: object
      required: [api_token]
      properties:
        api_token:
          type: string
          description: >-
            A Cloudflare API token with Zone:Read and DNS:Edit on the zones CypherPanel
            should manage. Write-only: it is sealed at rest and never returned.
            Cloudflare recommends an *account-owned* token for durable integrations, because
            it survives the person who created it leaving:
            https://developers.cloudflare.com/fundamentals/api/get-started/account-owned-tokens/
        account_id:
          type: string
          description: >-
            Optional. The Cloudflare account an account-owned token belongs to. Leave it
            empty and the panel resolves it — a token that sees exactly one account adopts
            it. A token that sees several returns 400 with the choices, and you send one back
            here. A classic user-owned token needs no account at all.

    ChooseAccountError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        accounts:
          type: array
          description: Present only when the token reaches several accounts; the choices to pick from.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }

    DNSZone:
      type: object
      required: [id, name, refreshed_at]
      properties:
        id: { type: string }
        name: { type: string, description: "The zone apex, e.g. example.com." }
        refreshed_at: { type: string, format: date-time }

    ApplicationDNS:
      type: object
      required: [enforced, verified, available_zones, domain, record_created]
      properties:
        enforced:
          type: boolean
          description: >-
            False when no DNS provider is connected. Everything downstream keys off this:
            an install that never connects one behaves exactly as it did before.
        verified: { type: boolean, description: Whether the domain falls inside a zone this panel can manage. }
        zone: { type: string, description: The zone the domain matched, when verified. }
        available_zones:
          type: array
          items: { type: string }
          description: The connected zones, so a refusal can say what you do have.
        domain: { type: string }
        reason: { type: string, description: Why no record exists although the domain verified. }
        record_name: { type: string }
        record_content: { type: string }
        record_created: { type: boolean, description: Whether the record has been observed to exist at the provider. }
        last_error: { type: string, description: The provider's own words on the last failed attempt. }
        next_attempt_at: { type: string, format: date-time }

    PatchServerRequest:
      type: object
      required: [public_address]
      properties:
        public_address:
          type: string
          description: >-
            An IP address — what an A record points at. Empty string clears it, which stops
            new DNS records being written for this server's applications.

    PanelMailSettings:
      type: object
      required: [configured, config_hint]
      properties:
        configured: { type: boolean }
        config_hint:
          type: string
          description: Non-secret summary, e.g. "smtp.acme.com → ops@acme.com". Never the password.
        updated_at: { type: string, format: date-time }

    SetPanelMailRequest:
      type: object
      required: [smtp_host, smtp_port, from]
      properties:
        smtp_host: { type: string }
        smtp_port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        password:
          type: string
          description: Write-only. Never returned by any route.
        from: { type: string }

    ChangePasswordResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          format: int64
          description: Other sessions signed out; 0 unless asked.

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer session token; shown once, store client-side.
        user:
          $ref: "#/components/schemas/User"

    Session:
      type: object
      required: [id, current, created_at, expires_at]
      properties:
        id:
          type: string
          description: sess_… prefixed ID.
        current:
          type: boolean
          description: True for the session making this request.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    Ability:
      type: string
      enum: [read, write, deploy]
      description: >
        What a personal access token may do. `read` permits safe methods,
        `write` permits creating and changing resources, `deploy` permits
        triggering deploys and rollbacks. A token's authority is the
        intersection of its owner's role and its abilities.

    ApiToken:
      type: object
      required: [id, name, abilities, created_at]
      properties:
        id:
          type: string
          description: tok_… prefixed ID.
        name:
          type: string
          description: Human-readable label.
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/Ability"
        last_used_at:
          type: string
          format: date-time
          description: When the token last authenticated a request; absent if never used.
        expires_at:
          type: string
          format: date-time
          description: When the token expires; absent if it never expires.
        created_at:
          type: string
          format: date-time

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable label (1–100 characters).
        expires_in_days:
          type: integer
          description: Lifetime in days; 0 or omitted means the token never expires.
          minimum: 0
          maximum: 3650
        abilities:
          type: array
          description: >
            What this token may do. Omitted means full access (read, write,
            deploy); an explicit empty list is rejected.
          items:
            $ref: "#/components/schemas/Ability"

    CreateTokenResponse:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >
                The raw bearer token (cyp_… prefixed). Shown exactly once —
                store it now; it cannot be retrieved again.

    Server:
      type: object
      required:
        [id, name, status, driver, agent_version, hostname, enrolled, created_at]
      properties:
        id:
          type: string
          description: srv_… prefixed ID; also the CN of the agent's certificate.
        name:
          type: string
        status:
          type: string
          description: Single status vocabulary (ui-principles §5).
          enum: [running, deploying, stopped, error, degraded, unknown]
        driver:
          type: string
          description: Orchestrator driver the agent reports (e.g. docker).
        role:
          type: string
          description: >-
            Agent-asserted role (builder-role-and-relay.md §1). "all" builds
            and runs; "builder" only builds; "worker" only runs. Read-only —
            set via the agent's --role flag, recorded from heartbeats.
          enum: [all, builder, worker]
        agent_version:
          type: string
        hostname:
          type: string
        public_address:
          type: string
          description: >-
            Where DNS records for this server's applications point
            (dns-automation.md §3.4). Empty until an operator sets it; the plane
            cannot learn it, because the agent dials out and the heartbeat
            carries no address.
        enrolled:
          type: boolean
          description: Whether an agent has completed enrollment.
        enrolled_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: Time of the most recent heartbeat; null if never seen.
        created_at:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    JoinInstructions:
      type: object
      required:
        [token, enroll_addr, nats_url, ca_cert_pem, ca_fingerprint, command, install_command]
      properties:
        token:
          type: string
          description: Single-use join token; never shown again.
        enroll_addr:
          type: string
          description: host:port of the gRPC enrollment endpoint.
        nats_url:
          type: string
          description: tls:// URL of the data-plane bus.
        ca_cert_pem:
          type: string
          description: PEM CA certificate to pin during enrollment.
        ca_fingerprint:
          type: string
          description: >-
            SHA-256 hex of ca_cert_pem. Travels in the install command so the
            installer can verify the CA it fetches from the plane.
        command:
          type: string
          description: Manual cypher-agent enroll command (binary preinstalled).
        install_command:
          type: string
          description: Ready-to-paste curl|sh join line (the acceptance path).

    CreateServerResponse:
      type: object
      required: [server, join]
      properties:
        server:
          $ref: "#/components/schemas/Server"
        join:
          $ref: "#/components/schemas/JoinInstructions"

    Project:
      type: object
      required: [id, name, team_id, created_at]
      properties:
        id:
          type: string
          description: prj_… prefixed ID.
        name:
          type: string
        team_id:
          type: string
          description: tm_… prefixed ID of the owning team.
        created_at:
          type: string
          format: date-time

    Environment:
      type: object
      required: [id, project_id, name, created_at]
      properties:
        id:
          type: string
          description: env_… prefixed ID.
        project_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        team_id:
          type: string
          description: >-
            Owning team. Optional when the caller belongs to exactly one team
            (defaulted); required (400) when the caller belongs to several.

    CreateProjectResponse:
      type: object
      required: [project, default_environment]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        default_environment:
          $ref: "#/components/schemas/Environment"

    ProjectDetail:
      type: object
      required: [project, environments]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"

    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    AppSource:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [github, git_url, image]
        repo:
          type: string
          description: Git remote; required for `github` and `git_url`, empty for `image`.
        branch:
          type: string
          description: Branch to build; defaults to `main` for git kinds, empty for `image`.
        deploy_key_id:
          type: [string, "null"]
        image:
          type: string
          maxLength: 512
          description: >-
            OCI image reference (registry/repository[:tag][@digest]); required
            for kind `image`, empty otherwise. The target agent pulls it — no
            build stage runs, and deploys go straight to rollout. A digest is
            immutable and fetched once; a tag is re-fetched on every deploy, so
            redeploying a moved tag runs the new image rather than a cached one.

    DomainCheck:
      type: object
      required: [domain, verdict, summary, resolved_ips]
      properties:
        domain: { type: string }
        verdict:
          type: string
          enum: [ok, no_domain, no_dns, unreachable, served_by_other]
        summary:
          type: string
          description: One plain-language sentence describing what was found.
        remedy:
          type: string
          description: What to do about it; absent when the verdict is ok.
        resolved_ips:
          type: array
          items: { type: string }
        http_status: { type: integer }
        served_by:
          type: string
          description: The Server header of whatever answered, when it was not CypherPanel.

    AppBuild:
      type: object
      required: [kind, dockerfile_path, context]
      properties:
        kind:
          type: string
          enum: [auto, dockerfile, static]
          default: auto
          description: >-
            How the checkout becomes an image. `dockerfile` builds the file at
            `dockerfile_path`. `static` serves the build context as a website
            behind nginx, listening on `runtime.port`. `auto` decides by looking
            at the repository: a Dockerfile if there is one, otherwise a static
            site if there is an index.html, and a clear failure naming both if
            neither. Detection runs on the builder agent, where the source
            actually is — the control plane never fetches a repository.
        dockerfile_path:
          type: string
          description: Ignored for a `static` build.
        context:
          type: string

    AppVolume:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: Operator label (lowercase alphanumeric + dashes); the Docker volume name is derived from it.
        path:
          type: string
          description: Absolute mount path inside the container.

    AppRuntime:
      type: object
      required: [server_id, port, replicas]
      properties:
        server_id:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        replicas:
          type: integer
          description: Fixed at 1 for v1 (multiple replicas are post-v1).
        cpu_limit:
          type: [number, "null"]
          description: Fractional cores; null/omitted/0 = no limit (noisy-neighbor control).
        memory_limit_mb:
          type: [integer, "null"]
          description: MiB; null/omitted/0 = no limit.

    AppPort:
      type: object
      required: [host_port, container_port, protocol]
      properties:
        host_port:
          type: integer
          minimum: 1
          maximum: 65535
        container_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
          description: Empty on input defaults to tcp.

    AppRoute:
      type: object
      required: [https, path_prefix]
      properties:
        domain:
          type: string
          description: >
            Public HTTP hostname. OPTIONAL — an empty domain makes the app a raw
            (non-HTTP) service with no proxy route; expose it via `ports` instead.
        https:
          type: boolean
        path_prefix:
          type: string

    AppHealth:
      type: object
      required: [path, interval_seconds, timeout_seconds, retries]
      properties:
        kind:
          type: string
          enum: [http, tcp, none]
          description: >
            Rollout gate. "http" (default) probes path; "tcp" dials the container
            port; "none" is liveness-only for raw UDP services. Probe is internal.
        path:
          type: string
        interval_seconds:
          type: integer
        timeout_seconds:
          type: integer
        retries:
          type: integer

    Application:
      type: object
      required:
        [id, environment_id, name, source, build, runtime, route, health, webhook_id, created_at]
      properties:
        id:
          type: string
          description: app_… prefixed ID.
        environment_id:
          type: string
        name:
          type: string
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
          description: Persistent volume mounts (survive redeploys).
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Raw host-port publishes (tcp/udp), independent of the HTTP route.
        webhook_id:
          type: string
          description: Public webhook identifier used in the webhook URL.
        desired_revision_id:
          type: [string, "null"]
          description: Set on first deploy; rollback re-points it.
        status:
          type: string
          enum: [running, deploying, stopped, error, degraded, unknown]
          description: Observed state — what the agent last reported (ADR-005).
        status_detail:
          type: string
        observed_revision_id:
          type: string
          description: The revision actually serving per the last report.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.
        redeploy_pending:
          type: boolean
          description: >-
            Derived, never stored (shared-variables.md §5): a shared variable
            this application references changed after the environment it is
            running was frozen onto the wire. It is NOT a status word — the
            status vocabulary is closed — so render it as a badge beside the
            status, never in place of one.
        created_at:
          type: string
          format: date-time

    CreateApplicationRequest:
      type: object
      required: [name, source, runtime, route]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Raw host-port publishes (tcp/udp); route.domain may be empty for a raw service.
        env_vars:
          type: object
          additionalProperties:
            type: string
          description: Plaintext values; sealed before storage, never returned.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.

    WebhookInfo:
      type: object
      required: [url, secret]
      properties:
        url:
          type: string
        secret:
          type: string
          description: HMAC secret shown once; store it in your git provider now.

    CreateApplicationResponse:
      type: object
      required: [application, webhook]
      properties:
        application:
          $ref: "#/components/schemas/Application"
        webhook:
          $ref: "#/components/schemas/WebhookInfo"

    EnvVarKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string
        shared_refs:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            Per env-var key, the shared variables its value references as
            {{shared.KEY}} (shared-variables.md §7). Key names only — values
            stay write-only, so the Env vars tab can show the wiring without a
            reveal.

    SetEnvVarRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    PatchApplicationRequest:
      type: object
      description: Absent sections stay unchanged; a present section replaces that section wholesale. The runtime server and replicas are not patchable.
      properties:
        name:
          type: string
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          type: object
          properties:
            port:
              type: integer
            cpu_limit:
              type: [number, "null"]
              description: Fractional cores; a non-positive value clears the limit.
            memory_limit_mb:
              type: [integer, "null"]
              description: MiB; a non-positive value clears the limit.
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
          description: Present = replace the volume set wholesale.
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Present = replace the port set wholesale.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.

    DeployRequest:
      type: object
      properties:
        ref:
          type: string
          description: Exact commit SHA to build; empty builds the configured branch's head.

    Deployment:
      type: object
      required: [id, application_id, revision_id, status, trigger, created_at]
      properties:
        id:
          type: string
        application_id:
          type: string
        revision_id:
          type: string
        status:
          type: string
          enum: [queued, building, distributing, rolling_out, succeeded, failed]
        trigger:
          type: string
          enum: [manual, webhook, rollback]
        detail:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    DeployKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        public_key:
          type: string
        fingerprint:
          type: string
        created_at:
          type: string
          format: date-time

    CreateDeployKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    CreateDeployKeyResponse:
      type: object
      required: [deploy_key]
      properties:
        deploy_key:
          $ref: "#/components/schemas/DeployKey"

    DeployKeysList:
      type: array
      items:
        $ref: "#/components/schemas/DeployKey"
    # ─── Teams & users ────────────────────────────────────────────────────────
    Me:
      type: object
      required: [id, email, role, teams]
      properties:
        id: { type: string }
        email: { type: string }
        role:
          type: string
          description: Panel role.
          enum: [member, admin, owner]
        display_name:
          type: string
          description: What teammates see. Empty means the panel falls back to the address.
        timezone:
          type: string
          description: IANA name the UI reads timestamps in. Empty means UTC.
        teams:
          type: array
          items: { $ref: "#/components/schemas/Team" }
    Team:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, description: tm_… prefixed ID. }
        name: { type: string }
        role:
          type: string
          description: The requesting user's role in this team (present on listings and /auth/me).
          enum: [member, admin, owner]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamMember:
      type: object
      required: [user_id, email, role, created_at]
      properties:
        user_id: { type: string }
        email: { type: string }
        role: { type: string, enum: [member, admin, owner] }
        created_at: { type: string, format: date-time }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    RenameTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    AddMemberRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [member, admin, owner], default: member }
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [member, admin, owner] }
    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        role: { type: string, enum: [member, admin, owner], default: member }
    SetUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [member, admin, owner] }

    # ─── Databases ────────────────────────────────────────────────────────────
    Database:
      type: object
      required: [id, environment_id, name, engine, version, server_id, volume_name, network, root_user, require_password, status, desired_state, created_at, updated_at]
      properties:
        id: { type: string, description: db_… prefixed ID. }
        environment_id: { type: string }
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string }
        server_id: { type: string }
        cpu_limit: { type: [number, "null"], description: Fractional cores; null/0 = no limit. }
        memory_limit_mb: { type: [integer, "null"] }
        volume_name: { type: string, description: "Deterministic: cypher-db-<id>." }
        expose_port: { type: [integer, "null"], description: Host port; null = private only. }
        network: { type: string }
        root_user: { type: string }
        root_password: { type: string, description: Present only on create / reset; shown once. }
        require_password: { type: boolean }
        initial_database:
          type: string
          description: >-
            The application database the engine created on first boot. Empty
            means the engine's own default — the `postgres` maintenance
            database for PostgreSQL, and nothing at all for MySQL, MariaDB and
            MongoDB.
        status: { type: string, enum: [running, provisioning, stopped, error, unknown] }
        status_detail: { type: string }
        desired_state:
          type: string
          enum: [running, stopped]
          description: >-
            What the operator asked for, as distinct from `status` (what the
            agent last observed). Start/stop are guarded on this, so a client
            must gate those actions on `desired_state` rather than `status` —
            otherwise it offers Start whenever reality is still catching up
            with intent, and the call is rejected.
        desired_revision_id: { type: [string, "null"] }
        observed_revision_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDatabaseRequest:
      type: object
      required: [name, engine, server_id]
      properties:
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string, description: Defaulted from the engine matrix when omitted. }
        server_id: { type: string }
        cpu_limit: { type: number, description: Fractional cores; 0 = no limit. }
        memory_limit_mb: { type: integer }
        expose_port: { type: integer, description: 0 or omitted = private only. }
        require_password: { type: boolean }
        initial_database:
          type: string
          description: >-
            An application database for the engine to create on first boot; a
            plain SQL identifier, at most 63 characters. Creation-only: the
            engine images read it while initializing an empty data directory
            and ignore it on every later start, so PATCH has no counterpart.
            Rejected for Redis and Valkey, whose databases are numbered.
    CreateDatabaseResponse:
      type: object
      required: [database, root_password]
      properties:
        database: { $ref: "#/components/schemas/Database" }
        root_password: { type: string, description: Shown exactly once. }
    PatchDatabaseRequest:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        cpu_limit: { type: number }
        memory_limit_mb: { type: integer }
        expose_port: { type: integer }
    ResetPasswordResponse:
      type: object
      required: [root_password]
      properties:
        root_password: { type: string, description: Shown exactly once. }
    ConnectionInfo:
      type: object
      required: [host, port, password_hint, internal_host]
      properties:
        host: { type: string }
        port: { type: integer }
        user: { type: string }
        password_hint: { type: string, description: Never the password itself. }
        internal_host: { type: string, description: Address on the environment's private network. }

    # ─── Templates ────────────────────────────────────────────────────────────
    Template:
      type: object
      required: [schema, slug, name, description, category, version, resources]
      properties:
        schema: { type: string, enum: [v1] }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [ai, analytics, automation, cms, communication, dev-tools, finance, media, monitoring, productivity, security, storage, other] }
        version: { type: string }
        resources:
          $ref: "#/components/schemas/TemplateResources"
    TemplateResources:
      type: object
      required: [databases, applications]
      properties:
        databases:
          type: array
          items: { $ref: "#/components/schemas/TemplateDatabase" }
        applications:
          type: array
          items: { $ref: "#/components/schemas/TemplateApplication" }
    TemplateDatabase:
      type: object
      required: [name, engine, version]
      properties:
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string }
    TemplateApplication:
      type: object
      required: [name, image, port, route, health, volumes, ports, env]
      properties:
        name: { type: string }
        image: { type: string }
        port: { type: integer }
        route: { type: boolean }
        health:
          type: object
          required: [kind, path]
          properties:
            kind: { type: string, enum: [http, tcp, none, ""] }
            path: { type: string }
        volumes:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
        ports:
          type: array
          items:
            type: object
            required: [host, container, protocol]
            properties:
              host: { type: integer }
              container: { type: integer }
              protocol: { type: string, enum: [tcp, udp, ""] }
        env:
          type: object
          additionalProperties: { type: string }
    InstallTemplateRequest:
      type: object
      required: [environment_id, server_id]
      properties:
        environment_id: { type: string }
        server_id: { type: string }
        domain: { type: string }
        name: { type: string }
    InstallTemplateResponse:
      type: object
      required: [applications, databases]
      properties:
        applications:
          type: array
          items: { type: string }
        databases:
          type: array
          items: { type: string }

    # ─── Backups ──────────────────────────────────────────────────────────────
    BackupTarget:
      type: object
      required: [id, name, endpoint, bucket, region, path_prefix, created_at, updated_at]
      properties:
        id: { type: string, description: bt_… prefixed ID. }
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        path_prefix: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateBackupTargetRequest:
      type: object
      required: [name, endpoint, bucket, access_key, secret_key]
      properties:
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        access_key: { type: string, description: Sealed at rest; never returned. }
        secret_key: { type: string, description: Sealed at rest; never returned. }
        path_prefix: { type: string }
    DatabaseBackup:
      type: object
      required: [id, database_id, target_id, schedule, retention_count, enabled, created_at, updated_at]
      properties:
        id: { type: string, description: bak_… prefixed ID. }
        database_id: { type: string }
        target_id: { type: string }
        schedule: { type: string, description: 5-field cron. }
        retention_count: { type: integer }
        enabled: { type: boolean }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDatabaseBackupRequest:
      type: object
      required: [target_id, schedule]
      properties:
        target_id: { type: string }
        schedule: { type: string, description: 5-field cron. }
        retention_count: { type: integer }
        enabled: { type: boolean, default: true }
    BackupRecord:
      type: object
      required: [id, database_backup_id, size_bytes, status, started_at, created_at]
      properties:
        id: { type: string, description: br_… prefixed ID. }
        database_backup_id: { type: string }
        object_key: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [running, succeeded, failed] }
        detail: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    RunBackupResponse:
      type: object
      required: [record]
      properties:
        record: { $ref: "#/components/schemas/BackupRecord" }
    RestoreRequest:
      type: object
      required: [backup_record_id, confirm]
      properties:
        backup_record_id: { type: string }
        confirm: { type: boolean, description: Must be true — restore overwrites the database. }

    # ─── Previews ───────────────────────────────────────────────────────────────
    Preview:
      type: object
      required: [id, source_app_id, environment_id, pr_number, pr_branch, domain, status, created_at]
      properties:
        id: { type: string, description: prv_… prefixed ID. }
        source_app_id: { type: string }
        environment_id: { type: string, description: The child environment created for this preview. }
        preview_app_id: { type: [string, "null"], description: The cloned application. }
        pr_number: { type: integer }
        pr_branch: { type: string }
        domain: { type: string, description: "pr-<n>.<base>." }
        status: { type: string, enum: [creating, running, error, destroying] }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # ─── Notifiers ──────────────────────────────────────────────────────────────
    Notifier:
      type: object
      required: [id, project_id, name, channel, events, enabled, config_hint, created_at, updated_at]
      properties:
        id: { type: string, description: ntf_… prefixed ID. }
        project_id: { type: string }
        name: { type: string }
        channel: { type: string, enum: [email, discord, slack, telegram] }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
        config_hint: { type: string, description: Masked summary of the sealed channel config; never the secret. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateNotifierRequest:
      type: object
      required: [name, channel, config, events]
      properties:
        name: { type: string }
        channel: { type: string, enum: [email, discord, slack, telegram] }
        config:
          type: object
          description: >-
            Channel-specific config, sealed at rest and never returned. email:
            {smtp_host, smtp_port, username, password, from, to}; discord/slack:
            {webhook_url}; telegram: {bot_token, chat_id}.
          additionalProperties: true
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean, default: true }
    PatchNotifierRequest:
      type: object
      properties:
        name: { type: string }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
        config:
          type: object
          description: Supply to reseal the channel config wholesale; omit to keep the existing sealed value.
          additionalProperties: true

    # ─── Outbound webhooks ────────────────────────────────────────────────────
    WebhookEndpoint:
      type: object
      required: [id, project_id, url, events, enabled, health, created_at, updated_at]
      properties:
        id: { type: string, description: whe_… prefixed ID. }
        project_id: { type: string }
        url: { type: string, description: "The http(s) receiver. It is the endpoint's identity — there is no name." }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
        health:
          type: string
          enum: [healthy, degraded, failing, unknown]
          description: >-
            Derived from the ten most recent terminal deliveries, never stored.
            unknown = disabled or nothing delivered yet; healthy = all ten
            succeeded; degraded = the most recent succeeded but at least one
            failed; failing = the most recent exhausted its attempts.
        last_delivery_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateWebhookEndpointRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, description: http(s) receiver. }
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
          description: "webhook.ping is not subscribable — an endpoint always receives its own pings."
        enabled: { type: boolean, default: true }
    PatchWebhookEndpointRequest:
      type: object
      properties:
        url: { type: string }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
    CreateWebhookEndpointResponse:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        secret:
          type: string
          description: >-
            The raw HMAC signing secret, shown here exactly once and never
            retrievable again. Store it in the receiver now.
    WebhookSecret:
      type: object
      required: [secret]
      properties:
        secret: { type: string, description: The raw HMAC signing secret, shown exactly once. }
    WebhookDelivery:
      type: object
      required: [id, endpoint_id, event_type, resource_kind, resource_id, resource_name, status, attempt, created_at, updated_at]
      properties:
        id: { type: string, description: "whd_… prefixed ID — this is the X-CypherPanel-Delivery header value." }
        endpoint_id: { type: string }
        event_type: { type: string, description: "deploy.succeeded | deploy.failed | backup.succeeded | backup.failed | webhook.ping" }
        resource_kind: { type: string, enum: [application, database] }
        resource_id: { type: string, description: "The resource this event describes. Deliberately not a foreign key — the log outlives what it describes." }
        resource_name: { type: string, description: Denormalised so the feed still reads correctly after a deletion. }
        status: { type: string, enum: [pending, succeeded, failed] }
        attempt: { type: integer, description: "Attempts made so far (max 4)." }
        response_status: { type: [integer, "null"], description: "The most recent attempt's HTTP status; null before the first attempt and on a transport error." }
        duration_ms: { type: [integer, "null"], description: "How long the most recent attempt took; null before the first attempt." }
        next_attempt_at: { type: [string, "null"], format: date-time, description: When the next retry is due; null once terminal. }
        redelivery_of: { type: [string, "null"], description: The original delivery id when this row is a replay. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookDeliveryPage:
      type: object
      required: [deliveries, next_before]
      properties:
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        next_before:
          type: string
          description: Cursor to pass as ?before= for the next page; empty when this is the last page.

    # ─── Notification inbox ───────────────────────────────────────────────────
    InboxItem:
      type: object
      required: [id, project_id, kind, severity, digest, title, body, link, link_label, created_at, updated_at]
      properties:
        id: { type: string, description: inb_… prefixed ID. }
        project_id: { type: string, description: The project the event happened in. }
        kind:
          type: string
          enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed]
          description: An event key from the notification taxonomy — the same closed set notifiers and webhook endpoints subscribe to.
        severity:
          type: string
          enum: [info, error]
          description: >-
            The event's level, not a resource status. `error` is immediate and
            individual; `info` is rolled into the day's digest.
        digest:
          type: boolean
          description: >-
            True when this row is a daily rollup — one per (project, kind, UTC
            day), one unread however many events it holds. A digest carries no
            link: a rollup of three backups has no single thing to open.
        title:
          type: string
          description: >-
            The line to render, composed server-side — "Deploy failed: web", or
            "Backups: 3/3 succeeded" for a digest. The counters behind that
            sentence are deliberately not in this contract, so a CLI and the
            panel print the same words.
        body: { type: string, description: "Event detail, capped at 2 KB. Renders as text, never as markup." }
        link: { type: string, description: "An in-panel path such as /projects/prj_…/applications/app_…/deployments?dep=dep_… — validated at write time; empty when there is nothing to open." }
        link_label: { type: string, description: 'What to call the link — "View deployment", "View backups". Empty when link is.' }
        read_at: { type: [string, "null"], format: date-time, description: Null while unread; that is what the bell counts. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InboxPage:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
        next_before:
          type: string
          description: Cursor to pass as ?before= for the next page; empty when this is the last page.
    InboxUnreadCount:
      type: object
      required: [unread]
      properties:
        unread: { type: integer, description: How many of the caller's items are unread. }
    InboxMarked:
      type: object
      required: [marked]
      properties:
        marked: { type: integer, description: How many items the call changed from unread to read. }
    InboxPreferences:
      type: object
      required: [muted_kinds, available_kinds]
      properties:
        muted_kinds:
          type: array
          items: { type: string }
          description: >-
            Kinds this account does NOT want. Stored as mutes rather than
            subscriptions, so an empty array means "everything on" and a kind
            added later is on by default for everyone.
        available_kinds:
          type: array
          items: { type: string }
          description: Every kind this plane can emit — served rather than hardcoded, so a new taxonomy entry needs no client change.
    SetInboxPreferencesRequest:
      type: object
      required: [muted_kinds]
      properties:
        muted_kinds:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
          description: The complete muted set; this replaces the previous one. A kind outside available_kinds is a 400.

    # ─── Project shared variables (shared-variables.md §7) ────────────────
    SharedVariable:
      type: object
      required: [id, project_id, environment_id, environment_name, key, used_by_count, created_at, updated_at]
      properties:
        id: { type: string, description: sv_… prefixed ID. }
        project_id: { type: string }
        environment_id:
          type: [string, "null"]
          description: null at project scope; otherwise the environment this variable is narrowed to.
        environment_name:
          type: string
          description: Empty at project scope. Present so a list needs no second lookup to render the scope.
        key: { type: string, description: "Matches [A-Za-z_][A-Za-z0-9_]* — the same charset as an application's own env keys." }
        used_by_count:
          type: integer
          description: >-
            How many applications reference this variable. Scope-accurate: an
            application whose own environment defines a shadowing row of the
            same key is not counted, because it does not use this one.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SharedVariableUsage:
      type: object
      required: [application_id, application_name, environment_name, redeploy_pending]
      properties:
        application_id: { type: string }
        application_name: { type: string }
        environment_name: { type: string }
        redeploy_pending:
          type: boolean
          description: This variable changed after the environment the application is running was frozen onto the wire.
    CreateSharedVariableRequest:
      type: object
      required: [key, value]
      properties:
        key: { type: string, description: "[A-Za-z_][A-Za-z0-9_]*" }
        environment_id:
          type: [string, "null"]
          description: >-
            Omit or send null for project scope. An environment of another
            project is a 400 — the foreign key alone cannot express that.
        value:
          type: string
          maxLength: 32768
          description: >-
            The value, sealed at rest and never returned. It is stored verbatim:
            a nested shared reference inside it is rejected — there is no nesting.
    PatchSharedVariableRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          maxLength: 32768
          description: >-
            Replaces the sealed value. Always bumps updated_at, even when the
            plaintext is unchanged, which marks every referencing application
            "redeploy to apply".

    # ─── Scheduled tasks ──────────────────────────────────────────────────────
    ScheduledTask:
      type: object
      required: [id, application_id, name, schedule, command, enabled, created_at, updated_at]
      properties:
        id: { type: string, description: sch_… prefixed ID. }
        application_id: { type: string }
        name: { type: string }
        schedule: { type: string, description: 5-field cron. }
        command:
          type: array
          items: { type: string }
          description: argv, passed straight to exec (never a shell string; use ["sh","-c","…"] for a shell).
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateScheduledTaskRequest:
      type: object
      required: [name, schedule, command]
      properties:
        name: { type: string }
        schedule: { type: string, description: 5-field cron. }
        command:
          type: array
          minItems: 1
          items: { type: string }
        enabled: { type: boolean, default: true }
    ScheduledTaskRun:
      type: object
      required: [id, task_id, started_at, status]
      properties:
        id: { type: string, description: str_… prefixed ID. }
        task_id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        exit_code: { type: [integer, "null"] }
        status: { type: string, enum: [running, succeeded, failed] }
        output_tail: { type: string, description: Capped stdout+stderr tail. }
security:
  - bearer: []
