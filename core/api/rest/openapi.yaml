# CypherPanel control-plane REST API — the source of truth for the HTTP
# surface (ENGINEERING rule 19). Handlers implement this spec; the web UI's
# client is generated from it (arrives with web/ in Phase 4). Served live at
# GET /api/v1/openapi.yaml. Vocabulary is docs/glossary.md.
openapi: 3.1.0
info:
  title: CypherPanel API
  description: >-
    Operator-facing control-plane API covering Phases 1–3: authentication and
    teams/roles, the server lifecycle, projects/environments, applications and
    the deploy pipeline, managed databases with S3 backups/restore, preview
    environments, notifications, and scheduled tasks. Authentication is a bearer
    session token from /api/v1/auth/login; the GitHub webhook authenticates by
    per-application HMAC instead. Every project-scoped route is authorized by
    team membership (a non-member sees 404, insufficient rank 403).


    Every response — success, error and SSE stream alike — carries an
    `X-Request-Id` header (`components/headers/RequestId`), and every JSON
    error body repeats it as `trace_id`. It is the value to quote in a bug
    report and the key to search for in `GET /api/v1/panel/logs`. Individual
    responses reference the header only where a generated client benefits;
    it is present on all of them.
  version: 0.3.0
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: teams
  - name: invites
  - name: access-requests
  - name: servers
  - name: projects
  - name: applications
  - name: deployments
  - name: deploy-keys
  - name: registries
  - name: compose-stacks
  - name: databases
  - name: backups
  - name: previews
  - name: notifiers
  - name: webhooks
  - name: inbox
  - name: audit
  - name: shared-variables
  - name: scheduled-tasks
  - name: protection

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: readyz
      tags: [health]
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/setup:
    get:
      operationId: getSetupStatus
      tags: [auth]
      summary: Whether the panel needs first-run setup
      description: >-
        Public. Returns whether the panel has no account yet, so the UI can show
        the first-run setup screen instead of login. Reveals no secret.
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: setup
      tags: [auth]
      summary: Create the first owner account (one-time)
      description: >-
        Public and one-time. Creates the panel's first owner and signs it in.
        Once any account exists this returns 409, so it can never mint a second
        account on an open panel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Owner created and signed in. The token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The panel is already set up; sign in instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >-
            Session created. The token is returned exactly once and never
            retrievable again (only its hash is stored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: >-
            Invalid email or password (deliberately indistinguishable), OR the
            account has two-factor enabled and a valid `totp_code` was not
            supplied. In the latter case the body carries `"totp_required": true`
            and the client should re-submit with a code (the password check
            already passed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the current session
      responses:
        "204":
          description: Session deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The authenticated account and its teams
      responses:
        "200":
          description: The current user, with the teams they belong to and their role in each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Set your own display name and timezone (session only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateProfileRequest" } } }
      responses:
        "200": { description: The updated account., content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change your own password, proving the current one (session only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } }
      responses:
        "200": { description: Changed; reports how many other sessions were revoked., content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: The current password is wrong — the same answer a failed sign-in gets., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/me/avatar:
    put:
      operationId: setAvatar
      tags: [auth]
      summary: Replace your own profile photo (session only)
      description: >
        The image is the raw request body. The stored content type is the one
        sniffed from the bytes, never the declared one; PNG, JPEG and WebP are
        accepted and SVG deliberately is not.
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Stored., content: { application/json: { schema: { $ref: "#/components/schemas/AvatarResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: Larger than the 2 MB limit., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteAvatar
      tags: [auth]
      summary: Remove your own profile photo (session only)
      responses:
        "204": { description: Removed; initials are shown instead. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/users/{id}/avatar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: User ID. }
    get:
      operationId: getAvatar
      tags: [auth]
      summary: A user's profile photo, for any signed-in caller
      responses:
        "200":
          description: The image bytes, served with the type they were recognised as.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Unchanged since the ETag the caller holds. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: That user has no photo., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/auth/email/change:
    get:
      operationId: getPendingEmailChange
      tags: [auth]
      summary: The address move already in flight, if any (session only)
      description: >
        Lets the confirm step show "old → new" rather than asking someone to
        trust a link. Never returns the token: holding a session is enough to
        start or abandon a change, never to complete one. 404 is the ordinary
        answer — most visits have nothing pending.
      responses:
        "200": { description: A change is pending., content: { application/json: { schema: { $ref: "#/components/schemas/PendingEmailChange" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Nothing is pending., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: cancelEmailChange
      tags: [auth]
      summary: Abandon a pending address move — "this wasn't me" (session only)
      description: >
        Spends every outstanding change for the account without applying one, so
        a second link requested in the same breath cannot survive the cancel of
        the first. Deliberately does not require the password: the person who can
        undo a move they did not ask for is the person holding the session, and
        making them find a password first only keeps a hijacked request alive
        longer.
      responses:
        "200": { description: Cancelled., content: { application/json: { schema: { $ref: "#/components/schemas/EmailChangeCancelled" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: requestEmailChange
      tags: [auth]
      summary: Ask to move your account to a new sign-in address (session only)
      description: >
        Mails a single-use confirmation link to the new address, and a notice to
        the old one. Requires the current password: possession of a session never
        weakens a credential on its own (threat-model §5.10).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestEmailChangeRequest" } } }
      responses:
        "202": { description: Confirmation sent to the new address. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: The current password is wrong., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: That address is already in use., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: The panel could not send the mail., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/auth/email/confirm:
    post:
      operationId: confirmEmailChange
      tags: [auth]
      summary: Finish moving your account, using the emailed token (session only)
      description: >
        Needs the token and a live session — a mailbox alone must not be able to
        move an account. Revokes every other session on success.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmEmailChangeRequest" } } }
      responses:
        "200": { description: The address moved., content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmEmailChangeResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: That address was taken while confirming., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/panel/tls:
    get:
      operationId: getPanelTLS
      tags: [panel]
      summary: The panel's ACME account for routed applications (panel owner)
      description: >-
        The one setting that decides whether the managed Proxy on every server can obtain
        certificates. Nothing here is a secret — an ACME account email is published back by
        the CA in the registration, and the ACME account key never leaves the serving node —
        so the values are returned as stored rather than hinted at.
      responses:
        "200":
          description: >-
            The account, or `configured: false` on a panel that has never set one. An
            unconfigured panel is a normal state, not an error: routed applications are
            served over plain HTTP and say so through `Application.tls_state`.
          content: { application/json: { schema: { $ref: "#/components/schemas/PanelTLSSettings" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setPanelTLS
      tags: [panel]
      summary: Set (or clear) the panel's ACME account (panel owner)
      description: >-
        Wholesale replacement: the email and the directory URL are one account, and
        half-changing them would point an existing account at a different CA. An empty
        `acme_email` CLEARS the account — "no email" and "no ACME" are the same statement,
        so there is no separate delete.


        The change is desired state: it is carried to every enrolled server inside its
        desired set, and the fleet is asked to re-read that set immediately, so nodes pick
        up a new account within a reconcile rather than on their next reconnect. Servers
        that are offline pick it up when they return. Certificates already issued are held
        on the serving nodes and keep working regardless.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetPanelTLSRequest" } } }
      responses:
        "200":
          description: Stored (or cleared, when `acme_email` was empty).
          content: { application/json: { schema: { $ref: "#/components/schemas/PanelTLSSettings" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/dns:
    get:
      operationId: getPanelDNS
      tags: [panel]
      summary: The panel's DNS provider, as a hint (panel admin)
      responses:
        "200": { description: "Whether a DNS provider is connected, and a hint naming the zones it can see. Never the token.", content: { application/json: { schema: { $ref: "#/components/schemas/DNSSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setPanelDNS
      tags: [panel]
      summary: Connect a DNS provider (panel admin)
      description: >-
        Wholesale replacement — there is no partial update of a credential. The token is
        validated against the provider before anything is stored, so a token that cannot
        list zones is refused with the provider's own message and persists nothing.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetPanelDNSRequest" } } }
      responses:
        "200": { description: Connected., content: { application/json: { schema: { $ref: "#/components/schemas/DNSSettings" } } } }
        "400":
          description: >-
            Refused. When the token can see more than one Cloudflare account the body also
            carries `accounts`, and the request should be repeated with one of their ids in
            `account_id`.
          content: { application/json: { schema: { $ref: "#/components/schemas/ChooseAccountError" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deletePanelDNS
      tags: [panel]
      summary: Disconnect the DNS provider (panel admin)
      description: >-
        Deletes nothing at the provider: removing the token removes the panel's ability to
        act, not its obligation to be careful. Every domain becomes unverified, which stops
        routing at those hostnames.
      responses:
        "204": { description: Disconnected; existing records are left untouched at the provider. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/dns/test:
    post:
      operationId: testPanelDNS
      tags: [panel]
      summary: Check the DNS credential still works (panel admin)
      description: Writes nothing — a test that wrote state would be a second way to configure the panel.
      responses:
        "202": { description: The credential works. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/dns/disconnect-preview:
    get:
      operationId: getDNSDisconnectPreview
      tags: [panel]
      summary: What stops being verified if the DNS provider is disconnected (panel admin)
      description: >
        Lists the application domains verified through the connected provider, so
        the confirmation can state its blast radius with a count instead of
        generic destructive copy — only the panel knows which domains these are.
        Reads desired state and changes nothing, so it is safe to call every time
        the dialog opens.
      responses:
        "200": { description: The blast radius., content: { application/json: { schema: { $ref: "#/components/schemas/DNSDisconnectPreview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/dns/zones:
    get:
      operationId: listDNSZones
      tags: [panel]
      summary: The zones this panel can manage (panel admin)
      responses:
        "200": { description: The cached zone list., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DNSZone" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/dns/zones/refresh:
    post:
      operationId: refreshDNSZones
      tags: [panel]
      summary: Re-read the zone list from the provider (panel admin)
      responses:
        "200": { description: The refreshed zone list., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DNSZone" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/applications/{id}/dns:
    get:
      operationId: getApplicationDNS
      tags: [applications]
      summary: Whether this application's domain is verified, and what its record is doing
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The DNS state for this application., content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationDNS" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/panel/version:
    get:
      operationId: getPanelVersion
      tags: [panel]
      summary: The running build, and any newer release
      description: >
        What build of cypherd is serving this request, and — when the update
        check is on and has found one — the newest release beyond it. Readable
        by any authenticated principal: the version appears in every startup log
        line and the report-issue dialog needs it for every user.


        `latest` is `null` whenever there is nothing to say: the panel is up to
        date, the check is off (`CYPHERD_UPDATE_CHECK=off`), it has not
        completed yet, or this is not a release build. CypherPanel never updates
        itself (ADR-010); this only tells the operator.
      responses:
        "200":
          description: The running build, and the newer release if there is one.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelVersion"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/panel/logs:
    get:
      operationId: getPanelLogs
      tags: [panel]
      summary: A bounded tail of the panel's own log (panel owner, session only)
      description: >
        The most recent lines of cypherd's structured log, oldest first, from an
        in-memory ring — no shell, no file, no log shipper. Meant to be attached
        to a bug report alongside a trace id.


        Panel **owner** only, and only from an interactive session: the log
        names hosts, resources and users, so an API token — which may live in a
        CI runner — must never be able to lift it. Secrets never reach any log
        line (ENGINEERING rule 20), which the API's tests assert rather than
        assume.
      parameters:
        - name: tail
          in: query
          required: false
          description: How many lines to return, newest last. 1–500; default 50.
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: The tail, oldest line first.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelLogs"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            The caller is not a panel owner, or authenticated with an API token
            rather than an interactive session.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/panel/mail:
    get:
      operationId: getPanelMail
      tags: [panel]
      summary: The panel's mail settings, as a hint (panel admin)
      responses:
        "200": { description: "Whether mail is configured, and a hint naming it. Never the credentials.", content: { application/json: { schema: { $ref: "#/components/schemas/PanelMailSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setPanelMail
      tags: [panel]
      summary: Replace the panel's mail settings (panel admin)
      description: Wholesale replacement — there is no partial update of a credential.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetPanelMailRequest" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/PanelMailSettings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deletePanelMail
      tags: [panel]
      summary: Forget the panel's mail settings (panel admin)
      responses:
        "204": { description: Removed; the panel can no longer send. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/mail/test:
    post:
      operationId: testPanelMail
      tags: [panel]
      summary: Send a test message to the configured from address (panel admin)
      responses:
        "202": { description: Sent. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: The mail server refused it; the message is its own., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the caller's live sessions
      description: >
        Every device currently signed in to this account. Requires an
        interactive session — a personal access token may not manage sessions.
      responses:
        "200":
          description: Live sessions, newest first. No token material is included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Sign one session out
      description: >
        Revokes a single session belonging to the caller. A session id that is
        not the caller's is reported as not found.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [auth]
      summary: Sign out everywhere except this device
      description: >
        Revokes every session of the caller except the one making the request,
        identified by the presented bearer token.
      responses:
        "200":
          description: How many sessions were revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                    format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tokens:
    get:
      operationId: listTokens
      tags: [auth]
      summary: List the caller's personal access tokens (metadata only)
      description: >
        Requires an interactive session. Credential management is unreachable
        from a personal access token, whatever its abilities, so that a leaked
        token cannot mint itself a wider one.
      responses:
        "200":
          description: The caller's tokens, newest first. The secret is never returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createToken
      tags: [auth]
      summary: Create a personal access token
      description: >
        Issues a scoped API token that authenticates as the calling user,
        inheriting that user's role and team memberships. The raw token is
        returned exactly once in this response and never again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The created token, including the raw secret (shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tokens/{id}:
    delete:
      operationId: deleteToken
      tags: [auth]
      summary: Revoke a personal access token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/totp:
    get:
      operationId: getTotpStatus
      tags: [auth]
      summary: Two-factor authentication status for the current account
      responses:
        "200":
          description: Whether 2FA is enabled and how many recovery codes remain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [auth]
      summary: Begin two-factor enrollment
      description: >
        Generates a fresh TOTP secret and returns it (raw, for manual entry, and
        as an otpauth URI for QR rendering). Enrollment is NOT active until a
        code is confirmed via /auth/totp/verify. Fails with 409 if 2FA is
        already enabled — disable it first to re-enroll.
      responses:
        "200":
          description: A pending enrollment secret (activate it with verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Two-factor is already enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/totp/verify:
    post:
      operationId: verifyTotp
      tags: [auth]
      summary: Confirm a code and activate two-factor
      description: >
        Validates a code against the pending secret, activates 2FA, and returns a
        fresh set of single-use recovery codes — shown exactly once. Store them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Two-factor enabled; recovery codes returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPVerifyResponse"
        "400":
          description: >-
            Invalid two-factor code, or enrollment was never started. Not 401:
            the session is valid — only the submitted factor is wrong — so a
            client must not treat this as an expired session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/totp/disable:
    post:
      operationId: disableTotp
      tags: [auth]
      summary: Disable two-factor
      description: >
        Turns off 2FA and clears recovery codes. Requires a valid authenticator
        or recovery code — a session alone cannot strip an account's second
        factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "204":
          description: Two-factor disabled.
        "400":
          description: >-
            Invalid two-factor code, or enrollment was never started. Not 401:
            the session is valid — only the submitted factor is wrong — so a
            client must not treat this as an expired session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/ca.pem:
    get:
      operationId: getCaCert
      tags: [servers]
      summary: The control plane's CA certificate (public, for agent pinning)
      security: []
      responses:
        "200":
          description: PEM-encoded CA certificate.
          content:
            application/x-pem-file:
              schema:
                type: string

  /api/v1/events:
    get:
      operationId: streamEvents
      tags: [health]
      summary: Live resource-change stream (Server-Sent Events)
      description: >-
        An SSE stream of "invalidate" events — the caller fetches current state
        via the API on connect, then refetches a resource when this stream names
        it as changed (ui-principles §10). Scoped to the caller's visible
        resources (a panel owner sees all). Two event types: `connected` (once,
        carrying `{"trace_id": "..."}` — the same correlation id the response
        headers give, so a misbehaving stream is diagnosable) and `invalidate`
        (data: {resource, id}). The response media type is text/event-stream.
      responses:
        "200":
          description: The event stream (never closes until the client disconnects).
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags: [health]
      summary: This specification
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /install/agent.sh:
    get:
      operationId: getAgentInstaller
      tags: [servers]
      summary: The agent join installer
      description: >-
        POSIX shell script a joining server pipes to sh. Public and secret-free:
        the join token and CA fingerprint arrive via the install command from
        the operator's session, never in this script.
      security: []
      responses:
        "200":
          description: The installer script.
          content:
            text/x-shellscript:
              schema:
                type: string

  /api/v1/servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List all servers, newest first
      responses:
        "200":
          description: All registered servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createServer
      tags: [servers]
      summary: Register a server and issue its single-use join token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: >-
            Server registered. The join token appears exactly once in this
            response and is never retrievable again (threat-model §5.3).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/servers/{id}:
    patch:
      operationId: updateServer
      tags: [servers]
      summary: Set where this server's applications' DNS records point (panel admin)
      description: >-
        The control plane cannot learn a server's public address: the agent dials out, the
        heartbeat carries no address, and a source address seen through NAT is not
        necessarily the one the internet reaches. So the operator supplies it. Must be an IP
        address — that is what an A record points at. An empty string clears it.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchServerRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Server ID (srv_… prefix).
    get:
      operationId: getServer
      tags: [servers]
      summary: One server
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete a server, revoking its agent
      description: >-
        Removes the server and its join tokens, severs the agent's live bus
        connection, and refuses the identity on any reconnect (threat-model §8
        requirement 6). Idempotent: deleting an absent server also returns 204.
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects, newest first
      responses:
        "200":
          description: All projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project and its default production environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created, with its default environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List the bundled template catalog
      responses:
        "200":
          description: Templates bundled with this release.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/templates/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get one bundled template
      responses:
        "200":
          description: Full declarative template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/templates/{slug}/install:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: installTemplate
      tags: [templates]
      summary: Resolve a template into ordinary resources and deploy it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallTemplateRequest" }
      responses:
        "202":
          description: Resources created and deployments scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallTemplateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The environment is inside a freeze window; nothing was written. An
            install deploys, so it passes the same gate a deploy does — and the
            resources it had begun to create are rolled back, so the refusal
            leaves no partial install behind. The error names the window and
            when it lifts, e.g. "production is frozen until Mon 08:00
            Europe/Berlin", so the request can simply be retried after it. A
            team owner may open a break-glass grant first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID (prj_… prefix).
    get:
      operationId: getProject
      tags: [projects]
      summary: One project with its environments
      responses:
        "200":
          description: The project and its environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: patchProject
      tags: [projects]
      summary: Rename a project, set its default environment, or transfer it
      description: >
        Rename and default-environment need team admin. A transfer is different
        in kind — it changes who can see everything inside — so it needs
        ownership of both the source and the destination team, and an
        interactive session: an API token that leaked must not be able to hand a
        project to a team the attacker controls. The slug is not editable; it is
        chosen once so URLs and scripts keep working. On transfer the slug is
        kept when free in the destination and otherwise reassigned, because a
        clash between two teams is not the operator's mistake to fix.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchProjectRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The name is taken in the team., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and everything in it
      description: Cascades to environments and their resources.
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/projects/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    get:
      operationId: exportProject
      tags: [projects]
      summary: Download the project as a portable archive (team admin)
      description: >-
        A gzipped tar containing a compose-style definition of every application,
        managed database and Compose Stack, one directory per standing
        environment, plus a generated README and a machine-readable manifest.
        It runs anywhere Docker runs — leaving is deliberately easy.


        **Secret values are never included**, in any form, including a masked
        hint: each resource gets an `env/<name>.env.example` carrying the KEYS
        only. That is structural rather than a promise — `core/export` is given
        an interface with no method that returns a ciphertext and no dependency
        on the unsealer, so it could not export a value if it tried.


        Also absent, and stated in the archive's own README: volume and database
        DATA, TLS certificates, and images. Preview environments are excluded
        because a preview belongs to its pull request and is destroyed with it.


        The response is streamed rather than buffered, so it carries no
        `Content-Length`. Everything that can fail is checked before the first
        byte; a write that fails afterwards truncates the archive, and a
        truncated gzip fails its own CRC rather than opening as a smaller,
        plausible-looking, wrong one.
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              description: 'attachment, named `<project-slug>-<YYYY-MM-DD>.tar.gz` — the slug is immutable, so a rename does not change it.'
              schema: { type: string }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { description: Export is not enabled on this panel., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/projects/{id}/environments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID (prj_… prefix).
    get:
      operationId: listEnvironments
      tags: [projects]
      summary: List a project's environments
      responses:
        "200":
          description: The project's environments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEnvironment
      tags: [projects]
      summary: Add an environment to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/environments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Environment ID. }
    patch:
      operationId: patchEnvironment
      tags: [projects]
      summary: Rename a standing environment (team admin)
      description: >
        A preview environment belongs to its pull request and is refused —
        renaming one by hand desynchronises it from the PR that made it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchEnvironmentRequest" } } }
      responses:
        "200": { description: Renamed., content: { application/json: { schema: { $ref: "#/components/schemas/Environment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A preview, or the name is taken in the project.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteEnvironment
      tags: [projects]
      summary: Remove a standing environment (team admin)
      description: >
        Refused for a preview (its pull request owns it), for the last standing
        environment a project has, and while resources remain inside — the same
        protection deleting a project gets.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A preview, the last environment, or resources remain.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/environments/{id}/applications:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Environment ID (env_… prefix).
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications in an environment
      responses:
        "200":
          description: The environment's applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: >-
            Application created. The webhook secret appears exactly once in this
            response and is never retrievable again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID (app_… prefix).
    get:
      operationId: getApplication
      tags: [applications]
      summary: One application (secrets masked)
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update configuration (shapes the next revision; running revision unchanged until deploy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchApplicationRequest"
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: The merged configuration is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new name is already taken in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application and its env vars
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/applications/{id}/domain-check:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: checkApplicationDomain
      summary: Check whether this app's domain actually reaches it
      description: >-
        Resolves the domain and fetches it from the control plane, the way the
        public internet would, then reports who answered. A domain can resolve
        correctly and still be served by another program listening on port 80,
        which is invisible from inside the panel otherwise.
      tags: [applications]
      responses:
        "200":
          description: The check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/applications/{id}/logs:
    get:
      operationId: streamApplicationLogs
      tags: [applications]
      summary: Stream runtime logs (Server-Sent Events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: >-
            Where the replay starts. Either a Go duration meaning "that long
            ago" (`15m`, `2h`, at most `720h`) or an RFC 3339 instant
            (`2026-09-06T09:00:00Z`). Omitted replays everything the stream
            still retains, then tails. A `since` older than the retention
            window yields whatever is retained; one in the future yields an
            empty replay that then tails. Anything unparseable is a `400`
            rather than a silent fall back to the whole window.
          example: 15m
      responses:
        "200":
          description: SSE stream of application logs.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/access:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    get:
      operationId: getApplicationAccess
      tags: [applications]
      summary: Who may reach this application through the Proxy (member+)
      responses:
        "200": { description: The policy., content: { application/json: { schema: { $ref: "#/components/schemas/AppAccess" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setApplicationAccess
      tags: [applications]
      summary: Replace the IP allowlist (member+)
      description: >-
        Wholesale, because the list IS the policy: adding and removing one CIDR
        at a time through two routes would make "what does this allow right now"
        a question with two answers mid-edit.


        Entries are normalized — a bare address becomes a single-host prefix, and
        a prefix is masked — so what is stored is the network the operator
        described rather than a host address that looks like one. An enabled
        allowlist with no entries is refused: empty meaning "allow nothing" is a
        lockout nobody typed, and empty meaning "allow everything" is a control
        that silently does not apply.


        This is CURRENT application state, not part of a revision snapshot. A
        rollback must never lift a lockout or restore a deleted entry.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetAppAccessRequest" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/AppAccess" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/applications/{id}/access/preview-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    post:
      operationId: setPreviewPassword
      tags: [applications]
      summary: Set, rotate or clear the preview passphrase (member+)
      description: >-
        Gates PREVIEW environments only — every `pr-*` environment asks for it
        before serving, so clients see staging and the internet does not. It is
        deliberately not applied to standing environments: a flag left on must
        not lock production behind a passphrase nobody remembers setting.


        The passphrase is bcrypt-hashed and only the hash is stored; the
        plaintext is returned in THIS response and never again, which is the
        contract `reset-password` already has. An empty passphrase turns the
        gate off and forgets the hash — turning it off while keeping the hash
        would leave a credential nobody can see and nobody can rotate.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetPreviewPasswordRequest" } } }
      responses:
        "200":
          description: Set. `passphrase` appears here and nowhere else, ever.
          content: { application/json: { schema: { $ref: "#/components/schemas/PreviewPasswordResult" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/applications/{id}/maintenance:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    put:
      operationId: startMaintenance
      tags: [applications]
      summary: Serve the maintenance page instead of the app (member+)
      description: >-
        A SERVICE SWAP, not a middleware. Traefik cannot return a body of ours,
        so the node runs a small responder container and the route's rule, TLS,
        allowlist and basic auth all stay exactly as they were while the load
        balancer's server moves. The application keeps running, keeps passing
        its health gate and can still be deployed underneath — a deploy simply
        flips a route that currently points elsewhere.


        While maintenance is on, NOBODY reaches the app through the front door,
        including an allowlisted operator. An allowlist bypass was considered
        and rejected: it would make maintenance mean different things depending
        on a second toggle's contents, and an operator who allowlisted the
        office would never see the page they are showing the world.


        Idempotent, and its own sub-resource rather than a field on
        `PUT /access` — the caller that most wants it is a migration script, and
        a script that had to read-modify-write the allowlist to raise a page
        would be one lost race away from deleting it. There is no auto-expiry: a
        window that lifts itself while the migration is still running publishes
        a half-migrated application to the internet.
      responses:
        "200":
          description: The page is up. `maintenance_since` is when it went up.
          content: { application/json: { schema: { $ref: "#/components/schemas/AppAccess" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: endMaintenance
      tags: [applications]
      summary: Take the maintenance page down (member+)
      description: >-
        Points the route back at whatever revision is current by then, and the
        responder is removed from the node once no resource there is still in
        maintenance. Idempotent.
      responses:
        "200":
          description: The page is down.
          content: { application/json: { schema: { $ref: "#/components/schemas/AppAccess" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/panel/agent-updates:
    get:
      operationId: getAgentUpdates
      tags: [panel]
      summary: Release channels and the fleet's agent versions (member+)
      description: >-
        Two channels and a selector per server, rather than a desired version
        per host: a forty-host fleet would otherwise be forty decisions that
        must agree, and "promote" would be a bulk edit.


        Both channels ship EMPTY, and empty means no instruction — upgrading a
        panel must not start replacing binaries across a fleet nobody asked it
        to touch. The cost is a fleet whose operator never opens this screen
        stays stale, which is paid for by making the empty state the action.
      responses:
        "200": { description: The channels and the fleet., content: { application/json: { schema: { $ref: "#/components/schemas/AgentUpdates" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Agent updates are not enabled on this panel. }

  /api/v1/panel/agent-updates/{channel}:
    parameters:
      - { name: channel, in: path, required: true, schema: { type: string, enum: [stable, canary] }, description: Release channel. }
    put:
      operationId: setAgentChannel
      tags: [panel]
      summary: Set a channel's desired agent version (owner, session only)
      description: >-
        Owner AND session-only: this is the one control in the panel that
        changes what code runs on every server, and an API token that can move a
        channel is an API token that owns the fleet — API tokens live in CI.


        An empty version clears the instruction, which is how a rollout an
        operator no longer wants is stopped. A version NEWER than the panel's
        own build is refused naming the remedy: additive-only proto guarantees
        the old-agent direction, not the new-agent one. A development panel
        cannot make that comparison and so does not.


        Setting an older version than the channel already names permits the
        agents to move backwards; moving forward clears that permission. It is
        derived rather than a second checkbox, because an operator who has to
        remember one is an operator whose rollback does not happen. It stops an
        ACCIDENT — a stale desired set, a mistyped tag, a restored snapshot
        walking the fleet backwards — and not a compromised plane, whose bound
        is the signature the agent checks.


        The version must be tag-shaped (`v1.2.3`, optionally with a
        pre-release suffix). It is bounded because it is concatenated into a URL
        by this pre-flight and by every agent's download, and `../` in a tag
        would aim a fetcher at a path the panel never named.


        Unless `CYPHERD_AGENT_UPDATE_PRECHECK=off`, the plane HEADs the release
        manifest first so a mistyped tag is refused where it is cheap. That
        probe goes to ONE host — the constant this project publishes releases
        from — and never to an `artifact_base` from this request body: the plane
        connecting to a host a caller named is a request-forgery primitive
        whatever guards sit in front of it, since a public host can redirect
        inward and a name can resolve differently the second time it is looked
        up (threat-model §5.14). A mirror is validated for SHAPE — absolute
        http(s), no credentials, query or fragment — and is otherwise the
        agents' business, which is what the off switch already meant.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetAgentChannelRequest" } } }
      responses:
        "200": { description: Set., content: { application/json: { schema: { $ref: "#/components/schemas/AgentChannel" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Agent updates are not enabled on this panel. }

  /api/v1/panel/agent-updates/promote:
    post:
      operationId: promoteAgentChannel
      tags: [panel]
      summary: Promote canary to stable (owner, session only)
      description: >-
        Refused with 409 when no canary server has CONVERGED on the candidate —
        promoting a version no host has run defeats a gate whose whole purpose
        is that a host ran it — or when any canary server reports it rolled
        back. Both refusals name what they refused on. There is no override
        flag: an operator who believes a rollback was spurious sets stable's
        version directly and owns that explicitly.


        A canary server that is merely OFFLINE neither blocks nor counts:
        blocking would make one powered-down host a permanent hold on every
        fleet update.


        Promotion moves every stable host at once. No waves and no percentages —
        ADR-010 §6 names staged rollout as a later refinement on this same
        primitive, and there is no automatic promotion on a health timer,
        because the only available health signal is "it reached the bus" and a
        timer that promotes on it converts one bad release into a fleet-wide
        outage while nobody is watching.
      responses:
        "200": { description: Promoted., content: { application/json: { schema: { $ref: "#/components/schemas/AgentChannel" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The gate refused; the message names the canary servers and what they are running. }
        "503": { description: Agent updates are not enabled on this panel. }

  /webhooks/github/app:
    post:
      operationId: githubAppWebhook
      tags: [applications]
      summary: The GitHub App's deliveries (HMAC, no session)
      description: >-
        Unauthenticated by design and verified by the App's webhook secret over
        the RAW body — a signature checked after decoding is a signature over
        something the sender did not sign.


        A push deploys EVERY application whose repository and branch it matches.
        Every one, deliberately: a repository can legitimately be deployed by
        several environments, and picking one would silently skip the rest. The
        per-application webhook cannot have this problem because its URL names
        the application; this endpoint has to resolve it, so resolving it to a
        set is the only correct answer.


        An unverified signature is a `401` and nothing else — no lookup, no log
        of the body, no hint about which applications exist. Events other than
        `push` are acknowledged and dropped, which is what stops GitHub
        disabling a delivery for something the panel simply does not act on.
      responses:
        "202":
          description: Accepted; the body reports how many deployments started.
          content: { application/json: { schema: { type: object, properties: { deployments: { type: integer } } } } }
        "204": { description: An event this panel does not act on. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: The signature did not verify. }
        "503": { description: The GitHub App is not enabled on this panel. }

  /api/v1/github/app:
    get:
      operationId: getGitHubApp
      tags: [panel]
      summary: Whether a GitHub App is connected, and where it is installed (admin+)
      description: >-
        NEVER returns the private key, not even redacted: a field that is
        sometimes a secret is a field that eventually leaks one.
      responses:
        "200": { description: The App., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubApp" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setGitHubApp
      tags: [panel]
      summary: Connect a GitHub App (owner, session only)
      description: >-
        Owner AND session-only: the private key can mint a token for every
        repository the App is installed on, and API tokens live in CI. It is the
        rule break glass and the agent channel already carry, applied to the
        credential with the widest reach in the panel.


        The credentials are validated against GitHub BEFORE anything is stored —
        a credential that fails at first use is a dead end, and a dead end is a
        bug. On success the installations are cached from GitHub's own answer.


        `private_key_pem` is write-only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetGitHubAppRequest" } } }
      responses:
        "200": { description: Connected., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubApp" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteGitHubApp
      tags: [panel]
      summary: Disconnect the GitHub App (owner, session only)
      description: >-
        Applications that reached their repository through it fail their next
        deploy with a reason, rather than silently falling back to an anonymous
        clone — which would succeed for a public repository and fail confusingly
        for a private one.
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/github/installations/refresh:
    post:
      operationId: refreshGitHubInstallations
      tags: [panel]
      summary: Re-read where the App is installed (admin+)
      description: >-
        Installations are OBSERVED, never authored: the panel does not decide
        which organisations its App is installed on, GitHub does. This replaces
        the cache with GitHub's answer, so an installation it no longer reports
        is gone — the same contract the DNS zone cache follows, for the same
        reason: an operator-entered list would be a second place to lie about
        what access exists.
      responses:
        "200": { description: Refreshed., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubApp" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: GitHub could not be reached. }

  /api/v1/github/repositories:
    get:
      operationId: listGitHubRepositories
      tags: [panel]
      summary: Repositories the App can deploy (member+)
      description: >-
        Read live rather than cached: the list changes when someone adds a
        repository, and a stale list that omits the one you just made is worse
        than a request. An empty list is what a panel with no App returns, and a
        client reads that as "type a URL instead".
      responses:
        "200":
          description: What can be deployed.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GitHubRepository" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: GitHub could not be reached. }

  /api/v1/onboarding:
    get:
      operationId: getOnboarding
      tags: [panel]
      summary: How far this panel is through the golden path (member+)
      description: >-
        Four steps — an owner account, a server, a project, a deployment that
        SUCCEEDED — each read from what exists rather than from a stored flag.


        Deriving it is the design, not an optimisation. A stored flag has to be
        written by whoever completes a step, so every creation path would have
        to remember: the template installer, preview environments, the API, a
        future CLI. DNS automation shipped with exactly that bug and the first
        real use hit it. Derived progress also self-heals in the direction that
        matters — delete every server and the panel says you need one again,
        which is true, where a flag would have lied.


        `done` is what a client renders on: the guided band appears only while it
        is false, and because nothing is stored it then stays gone rather than
        greeting an operator with a beginner's wizard after routine maintenance.
        There is deliberately no dismiss route — there is no flag to clear.
      responses:
        "200": { description: The four steps., content: { application/json: { schema: { $ref: "#/components/schemas/Onboarding" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/servers/local:
    get:
      operationId: getLocalServer
      tags: [servers]
      summary: Whether this panel can add its own host as a server (admin+)
      description: >-
        The most common first server is the machine the panel is already
        installed on, and the join command works there as well as anywhere —
        it is just not discoverable, because the dialog says "run this on the
        server you want to add" and the box you are signed into is not obviously
        one of those.


        `state` is `available`, `helper_missing` (this panel predates the
        root helper — re-run install.sh), `unsupported` (a container install,
        which has no host service manager to install into), `already_joined`, or
        `unknown` when the panel cannot read this machine's agent identity and
        so cannot tell.
        Anything but `available` carries a `reason` sentence to show in place of
        the button: a disabled control with no explanation is a dead end.
      responses:
        "200": { description: The state., content: { application/json: { schema: { $ref: "#/components/schemas/LocalServer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLocalServer
      tags: [servers]
      summary: Add this machine as a server (owner, session only)
      description: >-
        Creates the Server through the ordinary path, mints a join token, and
        writes a request that a root one-shot performs. THE PLANE INSTALLS
        NOTHING ITSELF: `cypherd` runs with `DynamicUser` and
        `ProtectSystem=strict`, so writing the agent binary, a unit file, or
        calling systemctl are all forbidden to it — deliberately, because
        relaxing that turns any RCE in this API into persistence on the
        control-plane host. Its entire power is to ask.


        ADR-002 is not bent. Nothing reaches out: the request never leaves the
        host, names no address, and holds no remote credential. The agent still
        dials home to enroll exactly as a pasted command's agent does — what
        changes is who types the command. The request has no field naming a
        machine and must never gain one, which is what keeps this from becoming
        a remote-execution primitive.


        Owner AND session-only: this installs software on the panel's own host
        as root, and API tokens live in CI. `POST /servers` stays admin and
        token-reachable, because handing out a join command grants nothing.
      responses:
        "202":
          description: The server exists and the install has been requested; poll GET for the phase.
          content: { application/json: { schema: { $ref: "#/components/schemas/LocalServerCreated" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: This host already runs an agent for this panel. }
        "501": { description: This panel cannot install an agent on its own host; the message names why and the remedy. }

  /api/v1/servers/{id}/agent-channel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Server ID. }
    put:
      operationId: setServerAgentChannel
      tags: [servers]
      summary: Move one server between release channels (owner, session only)
      description: >-
        Its own route rather than a field on `PATCH /servers/{id}`. That PATCH
        is panel-admin and deliberately reachable by a provisioning token, so
        re-ranking it would take `public_address` away from every admin that
        sets it today — while a field-level rank check would be the first in
        this API, and a new authorization precedent is a bad thing to introduce
        incidentally inside a feature.


        Only this server is nudged to re-read desired state: a channel change is
        one host's business.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetServerChannelRequest" } } }
      responses:
        "200": { description: Moved., content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Agent updates are not enabled on this panel. }

  /api/v1/panel/updates:
    get:
      operationId: getPanelUpdates
      tags: [panel]
      summary: What is running, what is available, and any upgrade in flight (member+)
      description: >-
        `mode` is `assisted` on a systemd install and `manual` in a container,
        where the panel CANNOT upgrade itself and says so rather than drawing a
        button that would not work.
      responses:
        "200": { description: The state., content: { application/json: { schema: { $ref: "#/components/schemas/PanelUpdates" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/changelog:
    get:
      operationId: getChangelog
      tags: [panel]
      summary: What changed in each release (any authenticated caller)
      description: >-
        Embedded in the binary rather than fetched: a fetched changelog is a
        second outbound call with its own rate limit, and it renders prose from
        a network source inside an operator-facing surface. The AVAILABLE
        release contributes only its version, its kind and a link pointing out —
        no untrusted prose is ever rendered here.
      responses:
        "200": { description: The entries., content: { application/json: { schema: { $ref: "#/components/schemas/Changelog" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/updates/preflight:
    get:
      operationId: preflightPanelUpdate
      tags: [panel]
      summary: The five checks, before anything changes (panel OWNER, session only)
      description: >-
        Changes nothing, which is why it is a GET. Signature, disk headroom,
        agent compatibility, snapshot readiness and quiescence.


        A signature failure is a REFUSAL, never a warning: an unverifiable
        artifact is the one thing this feature exists to not install. A disk
        refusal names BOTH numbers, because a disk that fills during an upgrade
        is how you end up with a panel that is neither the old version nor the
        new one. Agents below the release's floor are NAMED, and proceeding
        anyway needs the target version typed back.
      parameters:
        - { name: version, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: The checks., content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePreflight" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/updates/upgrade:
    post:
      operationId: startPanelUpgrade
      tags: [panel]
      summary: Run the guided upgrade (panel OWNER, session only)
      description: >-
        Owner, and session-only. This is the control that decides what code the
        control plane runs, and an API token may live in a CI runner.


        The plane does NOT perform the swap: it writes a request file that a
        separate root one-shot consumes. That helper has no dependency on the
        session that asked, so closing the tab, losing the network or signing
        out changes nothing.


        The panel goes read-only for about a minute and is unreachable for the
        few seconds of restart inside that. YOUR APPLICATIONS KEEP SERVING —
        they do not depend on the control plane.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartUpgradeRequest" } } }
      responses:
        "202": { description: Started., content: { application/json: { schema: { $ref: "#/components/schemas/PanelUpgrade" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: An upgrade is already running., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/panel/updates/cancel:
    post:
      operationId: cancelPanelUpgrade
      tags: [panel]
      summary: Cancel before the swap (panel OWNER, session only)
      description: >-
        Only before the swap. After it the helper owns the host and the panel
        has nothing to cancel with — it answers 409 and says the upgrade will
        roll itself back if the new version does not come up.
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The swap has already started., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/panel/updates/history:
    get:
      operationId: listPanelUpgrades
      tags: [panel]
      summary: Version history and the snapshots it kept (panel OWNER, session only)
      description: >-
        Records what RAN, not only what this panel performed: a boot whose
        version differs from the last recorded one writes a row with an
        `external` actor, which is what a container install's upgrades look
        like from in here.
      responses:
        "200": { description: The history., content: { application/json: { schema: { $ref: "#/components/schemas/PanelUpgradeHistory" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/snapshots/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Snapshot ID. }
    patch:
      operationId: setSnapshotRetention
      tags: [panel]
      summary: Extend, pin or expire a snapshot (panel OWNER, session only)
      description: >-
        Retention is the one decision this feature leaves to the operator, and
        it must not be made for them: the snapshot is the only thing standing
        between a bad release and a lost panel. A PINNED snapshot is never
        swept whatever its expiry says.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SnapshotRetentionRequest" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/PanelSnapshot" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePanelSnapshot
      tags: [panel]
      summary: Delete a snapshot and its file (panel OWNER, session only)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/panel/snapshots/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Snapshot ID. }
    post:
      operationId: restorePanelSnapshot
      tags: [panel]
      summary: Put the panel's database back (panel OWNER, session only)
      description: >-
        THE LAST RESORT. It rewinds the panel's own database to the moment the
        snapshot was taken, and everything written since is gone. The automatic
        rollback does not reach for this — it renames the previous binary back
        first, and only restores when the old build cannot start on the new
        schema.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string, description: "Must be the word restore." } } } } }
      responses:
        "202": { description: Started. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: An upgrade is already running., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/panel/disaster-recovery:
    get:
      operationId: getPlaneDisasterRecovery
      tags: [panel]
      summary: Whether this panel backs itself up (panel OWNER, session only)
      description: >-
        `armed` is whether a configuration exists at all — disarming deletes it
        rather than flipping a flag, so there is never a stale configuration
        beside a boolean.


        `recipient_verified_at` being null means ARMED BUT NOT PROVEN: the panel
        has never watched anyone decrypt with the matching key, so it must not
        imply the operator still has it. "Armed" and "recoverable" are different
        claims.
      responses:
        "200": { description: The configuration., content: { application/json: { schema: { $ref: "#/components/schemas/PlaneDisasterRecovery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: armPlaneDisasterRecovery
      tags: [panel]
      summary: Arm nightly plane snapshots (panel OWNER, session only)
      description: >-
        A snapshot of this panel's database is WORTHLESS without the master key
        — the CA that signs every agent certificate is sealed with it — and
        CATASTROPHIC with it. So the master key travels inside the archive, and
        the ARCHIVE is what is protected: encrypted to a public key whose
        private half the panel never holds.


        `generate: true` mints the pair and returns the private half in THIS
        response and never again. There is no endpoint that can return it later
        and no column that holds it. Alternatively pass a `recipient` you
        already have the key for.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ArmPlaneDRRequest" } } }
      responses:
        "200":
          description: Armed. `recovery_key` appears here and nowhere else, ever.
          content: { application/json: { schema: { $ref: "#/components/schemas/ArmPlaneDRResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: disarmPlaneDisasterRecovery
      tags: [panel]
      summary: Stop backing the panel up (panel OWNER, session only)
      description: >-
        Archives already in the bucket are left alone. Disarming is not the same
        decision as discarding, and deleting an operator's off-site copies from
        a panel action is the one mistake with no undo.
      responses:
        "204": { description: Disarmed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/disaster-recovery/run:
    post:
      operationId: runPlaneSnapshot
      tags: [panel]
      summary: Take a snapshot now (panel OWNER, session only)
      responses:
        "202": { description: Taken., content: { application/json: { schema: { $ref: "#/components/schemas/PlaneSnapshot" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Disaster recovery is not armed., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/panel/disaster-recovery/verify:
    post:
      operationId: verifyRecoveryKey
      tags: [panel]
      summary: Prove the Recovery Key still opens a snapshot (panel OWNER, session only)
      description: >-
        Because a backup nobody can open is worse than no backup: it is a year
        of green checkmarks ending in a discovery. The key is used to decrypt one
        manifest and discarded — never stored, never logged, never returned.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [recovery_key], properties: { recovery_key: { type: string } } } } }
      responses:
        "204": { description: It opens. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/panel/disaster-recovery/snapshots:
    get:
      operationId: listPlaneSnapshots
      tags: [panel]
      summary: The snapshot index (panel OWNER, session only)
      description: >-
        An INDEX of what is in the bucket, not the truth about it. The bucket is
        the truth, and a row here whose object was deleted out of band describes
        something gone.
      responses:
        "200":
          description: Recent snapshots.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PlaneSnapshot" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/revisions/{id}/promotion-plan:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The source revision. }
    get:
      operationId: planPromotion
      tags: [deployments]
      summary: Exactly what promoting this revision would change (member+)
      description: >-
        Ship the artifact that was TESTED, rather than rebuilding one that
        should be the same. The plan writes nothing, which is why it is a GET,
        and it IS the screen: an operator decides from what would change rather
        than from a confirmation dialog.


        NOTHING ABOUT ENVIRONMENT VARIABLES IS EVER COPIED by a promotion — not
        optionally, not behind a checkbox. Copying variables across environments
        is the most effective way there is to point production at a staging
        database, and a panel that offers it will eventually do it. The
        disagreement is made VISIBLE instead: `only_in_source` and
        `only_in_target` are computed from KEY NAMES ONLY, because a key present
        in both with a different value is not drift, it is the normal, intended
        difference between environments.


        `note` carries the one cost that has no fix inside the panel: the image
        is byte-for-byte the one that ran in staging, including anything baked
        in at build time.
      parameters:
        - { name: target_application_id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PromotionPlan" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/revisions/{id}/promote:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The source revision. }
    post:
      operationId: promoteRevision
      tags: [deployments]
      summary: Ship this revision's artifact to another environment (member+)
      description: >-
        No build runs and no source is fetched. The promoted revision carries the
        TARGET application's own canonical image tag — not the source's — because
        the agent parses ownership out of a tag and would otherwise reclaim, on
        the target server, the image that server is running from.


        The target's own configuration applies: port, health check, route,
        limits and environment are the target's. Only the artifact moves.


        Deploy protection and quotas both apply, exactly as they do to an
        ordinary deploy to the target.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [target_application_id], properties: { target_application_id: { type: string } } } } }
      responses:
        "202": { description: Started., content: { application/json: { schema: { $ref: "#/components/schemas/Deployment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A freeze window or a resource quota refused it; the body says which." , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/projects/{id}/quota:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    get:
      operationId: getProjectQuota
      tags: [projects]
      summary: This project's caps and what it is using (member+)
      description: >-
        The meter is computed, never stored. Memory is DECLARED — the sum of
        each resource's memory limit times its replicas — not observed, because
        a workload that has not started uses nothing, so an observed meter could
        never refuse a new application before it exists.


        `uncounted_compose_stacks` is a real hole stated rather than hidden: a
        stack's memory is declared inside its own file, and reading it out would
        meter a six-service stack as two services' worth and look complete.
      responses:
        "200": { description: The report., content: { application/json: { schema: { $ref: "#/components/schemas/QuotaReport" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setProjectQuota
      tags: [projects]
      summary: Cap what this project may consume (team admin, interactive session)
      description: >-
        A GUARDRAIL, not a meter. It is denominated in bytes and counts, there
        is no monetary concept anywhere in it, and it is set by an operator on
        infrastructure they own (ADR-012).


        Requires an interactive session. An API token inherits its owner's role,
        and a cap a leaked CI credential can raise is decorative.


        A null limit means that dimension is uncapped. A limit of ZERO is
        refused: removing a quota is DELETE, and zero means "nothing may be
        deployed here", which is deploy protection's job and says so more
        clearly.


        A memory cap over a scope containing a resource with NO declared limit
        is refused with a 409 that names them, because such a cap would be a
        fiction — and the runaway project this exists to stop is precisely the
        one that never set a limit.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetQuotaRequest" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceQuota" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A resource in this scope has no memory limit, so the cap could not be enforced; the body names them.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteProjectQuota
      tags: [projects]
      summary: Remove the cap (team admin, interactive session)
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/teams/{id}/quota:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID. }
    get:
      operationId: getTeamQuota
      tags: [teams]
      summary: This team's caps and what it is using (member+)
      description: >-
        A team's meter is the sum of its projects'. A refusal by either scope is
        a refusal — a team cap a project could exceed by having its own is not a
        cap.


        Each dimension additionally carries `committed` (the sum of this team's
        project caps) and `uncapped_projects`, which a project report does not.
      
      responses:
        "200": { description: The report., content: { application/json: { schema: { $ref: "#/components/schemas/QuotaReport" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setTeamQuota
      tags: [teams]
      summary: Cap what this team may consume (panel admin, interactive session)
      description: >-
        PANEL admin, not team admin, and the asymmetry is the point: a team
        quota set by that team's own admin would guard nothing against that
        team, which is the only thing it exists to guard against. Panel admin is
        the rank that already owns servers, deploy keys and backup targets —
        shared infrastructure — and a fleet-wide capacity policy is that.


        Requires an interactive session. An API token inherits its owner's role,
        so a `write` token belonging to an admin could otherwise raise the cap
        and then deploy freely, and a control a leaked CI credential can switch
        off is decorative.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetQuotaRequest" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceQuota" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A resource in this scope has no memory limit." , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteTeamQuota
      tags: [teams]
      summary: Remove the cap (panel admin, interactive session)
      description: Panel admin and interactive-session only, for the same reasons setting one is — removing a cap is setting it to "none".
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/mail/provider:
    get:
      operationId: getMailProvider
      tags: [panel]
      summary: Whether a mail provider is connected (panel admin)
      responses:
        "200": { description: The status., content: { application/json: { schema: { $ref: "#/components/schemas/MailProviderStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: connectMailProvider
      tags: [panel]
      summary: Connect a mail provider (panel admin)
      description: >-
        THE PANEL IS NOT BECOMING A MAIL SERVER. It writes MX, SPF, DKIM and
        DMARC through the DNS provider already connected, and creates mailboxes
        through this provider's API. It runs no MTA, stores no message, and
        never holds a DKIM private key — the provider generates that pair and
        publishes only the public half.


        The credential is tested before it is stored, then sealed under the
        master key and never returned. A credential saved and later found broken
        is one an operator discovers when a mailbox creation fails, which is the
        wrong moment.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MailProviderConfig" } } }
      responses:
        "200": { description: Connected., content: { application/json: { schema: { $ref: "#/components/schemas/MailProviderStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: disconnectMailProvider
      tags: [panel]
      summary: Forget the provider credential (panel admin)
      description: Domains and mailboxes at the provider are untouched — disconnecting the panel is not the same decision as deleting somebody's mail.
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/mail/domains:
    get:
      operationId: listMailDomains
      tags: [panel]
      summary: Domains with mail enabled (panel admin)
      responses:
        "200":
          description: The domains.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MailDomain" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: enableMailDomain
      tags: [panel]
      summary: Enable mail on a verified domain (panel admin)
      description: >-
        Refused for a domain the panel cannot write DNS for. That is not
        gatekeeping: on such a domain this feature can do nothing but print
        instructions, and enabling it would be claiming to have done something.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [domain], properties: { domain: { type: string } } } } }
      responses:
        "201": { description: Enabled., content: { application/json: { schema: { $ref: "#/components/schemas/MailDomainRecords" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/mail/domains/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Mail domain ID. }
    delete:
      operationId: disableMailDomain
      tags: [panel]
      summary: Stop managing this domain's mail (panel admin)
      description: The domain and its mailboxes stay at the provider. Deleting somebody's mail because a panel switch was turned off is not a trade this feature makes.
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/mail/domains/{id}/records:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Mail domain ID. }
    get:
      operationId: getMailDomainRecords
      tags: [panel]
      summary: The records this domain's mail requires (panel admin)
      responses:
        "200": { description: The records., content: { application/json: { schema: { $ref: "#/components/schemas/MailDomainRecords" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: rewriteMailDomainRecords
      tags: [panel]
      summary: Write the records again (panel admin)
      description: For a domain whose last attempt left something unwritten. Idempotent — a record that is already correct is left alone.
      responses:
        "200": { description: Written., content: { application/json: { schema: { $ref: "#/components/schemas/MailDomain" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/mail/domains/{id}/mailboxes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Mail domain ID. }
    get:
      operationId: listMailboxes
      tags: [panel]
      summary: The domain's mailboxes (panel admin)
      description: >-
        Read from the PROVIDER, which owns them. The panel caches nothing that
        would go stale; the only thing it stores is the link to a panel account,
        because that is a fact the provider knows nothing about.
      responses:
        "200":
          description: The mailboxes.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Mailbox" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMailbox
      tags: [panel]
      summary: Create a mailbox (panel admin)
      description: >-
        The password appears in THIS response and never again. The panel cannot
        read it back because it does not have it — the provider stores the hash
        and the panel forwarded it once, which is the contract an invitation
        link already has.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateMailboxRequest" } } }
      responses:
        "201":
          description: Created. `password` appears here and nowhere else, ever.
          content: { application/json: { schema: { $ref: "#/components/schemas/CreateMailboxResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMailbox
      tags: [panel]
      summary: Delete a mailbox (panel admin)
      parameters:
        - { name: address, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/mail/domains/{id}/mailboxes/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Mail domain ID. }
    post:
      operationId: resetMailboxPassword
      tags: [panel]
      summary: Mint a new mailbox password (panel admin)
      description: Shown once, like the create response, and for the same reason.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [address], properties: { address: { type: string } } } } }
      responses:
        "200":
          description: Reset. The password appears here and nowhere else.
          content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/log-drains:
    get:
      operationId: listLogDrains
      tags: [panel]
      summary: Every log drain, with its derived health (panel admin)
      description: >-
        A drain ships APPLICATION runtime logs. Managed databases and Compose
        Stacks carry different labels and are not on the stream this reads — a
        gap in those features rather than this one, and the copy says so rather
        than letting somebody discover it later.


        Health is derived, never stored, and a FAILING DRAIN IS NEVER
        AUTO-DISABLED: that would turn a visible failure into a silently
        stopped pipeline that does not resume when the sink returns, and the
        operator finds out when they go looking for last week's logs.
      responses:
        "200":
          description: The drains.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LogDrain" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLogDrain
      tags: [panel]
      summary: Add a log drain (panel admin)
      description: >-
        Panel admin, because a drain spends the panel's stream, CPU and egress —
        and a project-scoped drain still ships lines out of the install.


        The WHOLE config is sealed under the master key, not just its secret
        field: which half of a Loki config is a secret changes per deployment,
        since `X-Scope-OrgID` is a tenant id at one site and an access boundary
        at another. It is never returned; the API answers with a masked
        `config_hint` instead.


        An S3 drain names an existing Backup Target rather than carrying its own
        keys. A second sealed S3 credential would mean rotating a key in two
        places and finding the second one at 02:00 on the night the batch fails.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LogDrainRequest" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/LogDrain" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: A drain with that name already exists., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/log-drains/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Log drain ID. }
    patch:
      operationId: updateLogDrain
      tags: [panel]
      summary: Replace a drain's config, or just pause it (panel admin)
      description: >-
        A body carrying `config` replaces it WHOLESALE — a config is one
        document, and half-changing an endpoint's URL and its headers would
        leave a drain pointed somewhere with credentials for somewhere else. A
        body with only `enabled` pauses or resumes without re-sending the
        credential.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LogDrainRequest" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/LogDrain" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLogDrain
      tags: [panel]
      summary: Remove a drain and its cursor (panel admin)
      description: >-
        The durable consumer goes with it. Leaving it behind would hold the log
        stream's ack floor at the drain's last position forever — a retention
        window that stops sliding, which is the disk fill arrived at by a
        different road.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alert-rules:
    get:
      operationId: listAlertRules
      tags: [panel]
      summary: Every threshold rule, with its current state (member+)
      description: >-
        A rule has no name: the SENTENCE names it, rendered from the row, so
        this list, the modal, the Discord message and this response all say the
        same words and no label typed in March can drift from what the rule now
        does.


        All four states appear, including the two that deliver nothing —
        `no_data` and `flapping`. A rule quiet for a bad reason must not look
        like one quiet for a good reason.
      responses:
        "200":
          description: The rules.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AlertRule" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAlertRule
      tags: [panel]
      summary: Add a threshold rule (panel admin)
      description: >-
        The condition is not "the value is above the threshold". It is: every
        bucket covering the last `window_seconds` breached, with no gaps in that
        span. A four-second spike moves a five-minute mean by about a percent
        and does not fire, and a bucket the agent barely covered is `unknown` —
        neither high nor low — so an agent restart never reads as a breach.


        `p95_latency_ms` and `requests_per_second` are refused on a SERVER, and
        the refusal is substantive: a server's request buckets are the traffic
        that matched no route, so "p95 on this node" would silently mean "p95 of
        what hit nothing".
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAlertRuleRequest" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/AlertRule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: An identical rule already exists., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/alert-rules/backtest:
    post:
      operationId: backtestAlertRule
      tags: [panel]
      summary: What this rule would have done over the last week (panel admin)
      description: >-
        Every alerting product treats "what number should I type" as the
        operator's problem and hands them nothing to solve it with. This panel
        already keeps a fortnight of exactly the series the rule reads, so the
        answer is one range scan over data already on disk — and it runs before
        Create does anything.


        It counts EPISODES, not evaluations: an hour above the line is one
        alert, and counting ticks would make every rule look catastrophic. It
        uses the same evaluator the loop uses, because two implementations would
        be two answers to one question. `had_data: false` means the series has
        too many gaps to say anything, which is more useful than a confident 0.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAlertRuleRequest" } } }
      responses:
        "200": { description: The verdict., content: { application/json: { schema: { $ref: "#/components/schemas/AlertBacktest" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/alert-rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Alert rule ID. }
    patch:
      operationId: setAlertRuleEnabled
      tags: [panel]
      summary: Pause or resume a rule (panel admin)
      description: >-
        Pausing keeps the rule, its history and its notifier and stops it
        delivering — which is what an operator wants during a migration, and is
        not what deleting does.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/AlertRule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAlertRule
      tags: [panel]
      summary: Remove a rule and its history (panel admin)
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alert-rules/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Alert rule ID. }
    get:
      operationId: listAlertEvents
      tags: [panel]
      summary: This rule's episodes, newest first (member+)
      description: >-
        One row per EPISODE, not per evaluation — an hour above the line is one
        row. `delivered: false` marks an episode the flap guard held: it still
        happened and is still counted, it just was not sent.
      responses:
        "200":
          description: Up to 50 episodes.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AlertEvent" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/applications/{id}/metrics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    get:
      operationId: getApplicationMetrics
      tags: [applications]
      summary: CPU, memory and disk over a window (member+)
      parameters:
        - { name: window, in: query, required: false, schema: { type: string }, description: "A Go duration (6h) or an RFC 3339 instant; anything else is a 400 naming both. Defaults to 6h, maximum 720h." }
      description: >-
        The series carries no averages and no percentiles, because neither
        merges. `cpu_percent` and `memory_bytes` on each point are DERIVED from
        accumulators over that point's `covered_seconds`, so a window of any
        length is exact rather than an average-of-averages.


        `covered_seconds` is why an agent restart reads as a partial bucket
        instead of a dip in traffic, and `collecting: false` is why a resource
        with no data reads "collection is off" rather than as an idle
        application at 0%.


        Per-resource disk figures DO NOT SUM to the host's usage: image layers
        are shared, and a base layer used by four applications is counted for
        each of them. The number an operator should trust for capacity is the
        one on the Server.
      responses:
        "200": { description: The series and its summary., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceMetrics" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/compose-stacks/{id}/metrics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Compose Stack ID. }
    get:
      operationId: getComposeStackMetrics
      tags: [compose-stacks]
      summary: CPU, memory and disk over a window (member+)
      parameters:
        - { name: window, in: query, required: false, schema: { type: string }, description: "A Go duration (6h) or an RFC 3339 instant; anything else is a 400 naming both. Defaults to 6h, maximum 720h." }
      description: A stack's containers are summed into one figure — the operator asked about the stack, not its sidecars.
      responses:
        "200": { description: The series and its summary., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceMetrics" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/databases/{id}/metrics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
    get:
      operationId: getDatabaseMetrics
      tags: [databases]
      summary: CPU, memory and disk over a window (member+)
      parameters:
        - { name: window, in: query, required: false, schema: { type: string }, description: "A Go duration (6h) or an RFC 3339 instant; anything else is a 400 naming both. Defaults to 6h, maximum 720h." }
      responses:
        "200": { description: The series and its summary., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceMetrics" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{id}/metrics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Server ID. }
    get:
      operationId: getServerMetrics
      tags: [servers]
      summary: The node's managed containers, summed (panel admin)
      parameters:
        - { name: window, in: query, required: false, schema: { type: string }, description: "A Go duration (6h) or an RFC 3339 instant; anything else is a 400 naming both. Defaults to 6h, maximum 720h." }
      description: >-
        A node's figure IS its resources' figures, so there is no separate
        server-level sampler — a second source would be a second answer to the
        same question. Containers the panel does not manage are never sampled,
        so an operator's own workloads on a shared box do not appear here.
      responses:
        "200": { description: The series and its summary., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceMetrics" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/applications/{id}/traffic:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    get:
      operationId: getApplicationTraffic
      tags: [applications]
      summary: Requests, statuses, latency and top paths (member+)
      parameters:
        - { name: window, in: query, required: false, schema: { type: string }, description: "A Go duration (6h) or an RFC 3339 instant; anything else is a 400 naming both. Defaults to 6h, maximum 720h." }
      description: >-
        The whole screen in one response — summary, series and top paths —
        because it is one screen, and three round trips for one card is how a
        panel starts feeling slow.


        Percentiles are computed once from ONE summed histogram, never averaged
        from the buckets' own percentiles: two 5-minute buckets with p95 = 100
        ms and p95 = 2000 ms have an hour-p95 that is neither the mean nor the
        max of them.


        Paths are normalised on the node — no query string, at most three
        segments, id-shaped segments replaced with `:id` — and capped, with
        everything past the cap folded into `(other)` so the rows always
        reconcile with the request count. That is a heuristic, not an
        inventory: an application whose real route is `/v1/2024/report` sees it
        rewritten.


        `sampled: true` means the node exceeded its line-rate ceiling and fell
        back to 1-in-N, so the counters are estimates scaled back up. It is
        labelled rather than quietly presented as exact.
      responses:
        "200": { description: The traffic., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceTraffic" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/compose-stacks/{id}/traffic:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Compose Stack ID. }
    get:
      operationId: getComposeStackTraffic
      tags: [compose-stacks]
      summary: Requests, statuses, latency and top paths (member+)
      parameters:
        - { name: window, in: query, required: false, schema: { type: string }, description: "A Go duration (6h) or an RFC 3339 instant; anything else is a 400 naming both. Defaults to 6h, maximum 720h." }
      responses:
        "200": { description: The traffic., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceTraffic" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/usage:
    get:
      operationId: getUsage
      tags: [panel]
      summary: Per-project attribution for a month (member+)
      parameters:
        - { name: month, in: query, required: false, schema: { type: string }, description: "YYYY-MM. Defaults to the current UTC month." }
        - { name: team_id, in: query, required: false, schema: { type: string } }
      description: >-
        The capacity question — which project forces the next server — not a
        billing one. There is no price, no rate and no currency anywhere in this
        feature, and NOTHING IN IT EVER REFUSES AN ACTION: usage is reported, and
        it never gates a deploy.


        `cpu_share` needs a stated denominator or it is a tenancy leak: showing
        "38% of fleet CPU" to a member of one team would silently disclose the
        size of every other team's load. So the denominator is the total of what
        the CALLER can see, `denominator` says which in words, and a project the
        caller cannot see contributes to neither numerator nor denominator.
      responses:
        "200": { description: The month., content: { application/json: { schema: { $ref: "#/components/schemas/Usage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/usage/export:
    get:
      operationId: exportUsage
      tags: [panel]
      summary: One CSV row per resource (member+)
      parameters:
        - { name: month, in: query, required: false, schema: { type: string }, description: "YYYY-MM. Defaults to the current UTC month." }
        - { name: team_id, in: query, required: false, schema: { type: string } }
      description: >-
        Same scope as the page: the export can never contain a row the caller
        could not already read. It carries the ownership chain and the measures
        and stops there — the CSV ends where a spreadsheet begins.
      responses:
        "200":
          description: The CSV.
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/settings/metrics:
    get:
      operationId: getMetricsSettings
      tags: [panel]
      summary: Panel-wide metrics collection policy (panel admin)
      responses:
        "200": { description: The policy., content: { application/json: { schema: { $ref: "#/components/schemas/MetricsSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setMetricsSettings
      tags: [panel]
      summary: Change the collection policy (panel admin)
      description: >-
        Three knobs, not one per dimension. `enabled` and `request_analytics`
        are the two an operator has a real reason to change — cost, and privacy
        about paths — and `bucket_seconds` is load-bearing for the write budget:
        an operator with 500 containers raises it to 900 and cuts the stored row
        count by a factor of three.


        Turning `request_analytics` on changes the Proxy's static configuration,
        which RECREATES the Proxy container on each node once — a few seconds
        with no routing there.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MetricsSettings" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/MetricsSettings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/projects/{id}/status-page:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    get:
      operationId: getStatusPage
      tags: [projects]
      summary: The project's public status page (member+)
      responses:
        "200": { description: The page., content: { application/json: { schema: { $ref: "#/components/schemas/StatusPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setStatusPage
      tags: [projects]
      summary: Create or replace the status page (TEAM ADMIN)
      description: >-
        One page per project — "which of our four status pages is the real one"
        is not a question this product can be asked.


        This is TEAM ADMIN, not member, and the reason is the whole feature:
        publishing a project's health, under names of somebody's choosing, at a
        hostname customers will read, is a disclosure decision. It sits at the
        rank that already decides who joins the team, not at the rank that
        ships code.


        Nothing about a resource becomes public except the label an operator
        types for it. Not its name, not its server, not its route domain, not
        its revision, and never the agent's own status detail.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetStatusPageRequest" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/StatusPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: That slug is already taken by another status page., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteStatusPage
      tags: [projects]
      summary: Remove the status page and its history (TEAM ADMIN)
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{id}/components:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Status page ID. }
    get:
      operationId: listStatusPageComponents
      tags: [projects]
      summary: The ordered component list (member+)
      responses:
        "200":
          description: The components.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StatusPageComponent" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setStatusPageComponents
      tags: [projects]
      summary: Replace the whole ordered component list (TEAM ADMIN)
      description: >-
        Wholesale, because the list IS the page: adding and removing one row at
        a time through two routes would make "what does this page publish right
        now" a question with two answers mid-edit. A row that survives a save
        keeps its id, and with it the history its bars are drawn from — so
        fixing a typo in a label does not reset thirty days of uptime.


        A component naming a resource in a PREVIEW environment is refused with
        a reason. A preview is created by a machine from an outsider's pull
        request, so a page that could include one would publish branch names
        and pull request titles written by people outside the team. That is a
        rejection, not a default.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetStatusPageComponentsRequest" } } }
      responses:
        "200":
          description: Saved.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StatusPageComponent" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{id}/preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Status page ID. }
    get:
      operationId: previewStatusPage
      tags: [projects]
      summary: The real public payload, for a page that is not enabled yet (member+)
      description: >-
        The preview IS the disclosure control, and it is a better one than a
        warning. A confirmation dialog that says "this will be public" is read
        by nobody; a rendered page with the customer's name on it is read by
        everybody, because it looks like the thing it is.


        It is built by the same code that serves the public page — two
        renderers would be two chances to disclose different things.
      responses:
        "200": { description: The payload., content: { application/json: { schema: { $ref: "#/components/schemas/PublicStatusPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{id}/domain-check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Status page ID. }
    get:
      operationId: checkStatusPageDomain
      tags: [projects]
      summary: What the public internet gets back for the status domain (member+)
      responses:
        "200": { description: The verdict., content: { application/json: { schema: { $ref: "#/components/schemas/DomainCheck" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{id}/incidents/{iid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Status page ID. }
      - { name: iid, in: path, required: true, schema: { type: string }, description: Incident (interval) ID. }
    patch:
      operationId: annotateStatusIncident
      tags: [projects]
      summary: One line of public text on a live incident (member+)
      description: >-
        A member, deliberately. The person who notices at 02:00 is on call, not
        an admin, and making them find one before they can write "we are aware
        and investigating" is how a status page stops being used. The blast
        radius is bounded to 280 characters of plain text on a page that is
        already public, it is audited with the author's name, and it is never
        linkified — the text is escaped and rendered as text, so the page
        cannot become a redirect on a hostname the customer trusts.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnnotateIncidentRequest" } } }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/applications/{id}/volume-backup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    get:
      operationId: getVolumeBackup
      tags: [applications]
      summary: The application's volume backup schedule (member+)
      description: >-
        Answers `null` when the application has no schedule. That is a normal
        state — most applications never need one — so it is not a 404: a 404
        here would be indistinguishable from "no such application".
      responses:
        "200":
          description: The schedule, or null.
          content: { application/json: { schema: { oneOf: [ { $ref: "#/components/schemas/VolumeBackup" }, { type: "null" } ] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setVolumeBackup
      tags: [applications]
      summary: Create or replace the volume backup schedule (member+)
      description: >-
        One schedule per application, covering every volume the application
        marks `backed_up`. An operator who wants two cadences for two
        directories of the same application is describing two applications.


        A volume archive is a tar of a live directory, not a consistent
        snapshot: a database writing during the copy produces an archive of a
        half-written file. That is why databases keep their own engine-level
        dumps and this covers uploads, caches and generated assets instead.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetVolumeBackupRequest" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/VolumeBackup" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteVolumeBackup
      tags: [applications]
      summary: Remove the schedule (member+)
      description: >-
        Stops future runs and forgets the cadence. Archives already in the
        bucket are left alone — deleting an operator's off-site copies from a
        panel action is the one mistake with no undo.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/applications/{id}/volume-backup/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    post:
      operationId: runVolumeBackup
      tags: [applications]
      summary: Archive every flagged volume now (member+)
      description: >-
        Dispatches to the agent and answers 202 with one running record per
        flagged volume — a record per volume rather than per run, because a
        failure belongs to the volume that failed. An application with a
        schedule and nothing flagged answers 202 with an empty list.
      responses:
        "202":
          description: Dispatched.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VolumeBackupRecord" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The application has no volume backup schedule., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/applications/{id}/volume-backup/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    get:
      operationId: listVolumeBackupRecords
      tags: [applications]
      summary: Recent volume archives, newest first (member+)
      responses:
        "200":
          description: Up to 50 records.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VolumeBackupRecord" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/applications/{id}/restart:
    post:
      operationId: restartApplication
      tags: [applications]
      summary: Recreate the container without shipping a new revision
      description: >-
        Restarts the running application. Expressed as desired state rather than
        as a verb the agent obeys: the panel issues a new restart token, the
        reconciler recreates a container whose token does not match, and
        converging again afterwards changes nothing.


        This is NOT a deploy. No revision is created, no build runs, no
        deployment appears, and the desired revision does not move — restarting
        a wedged container must not silently ship the configuration someone
        edited an hour ago. The response is the application.


        The replacement starts alongside the container it replaces, passes the
        same health gate, takes the route, and only then does the old one drain
        — a restart is zero-downtime for the same reason a deploy is.


        A freeze window does NOT block it: a freeze exists to stop new code
        shipping, and a restart ships none. Refusing to restart a crashed
        application during a freeze would make the freeze an outage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: >-
            Accepted. The application, unchanged in everything a client can
            act on — the restart token itself is internal plumbing and is not
            part of the response. Watch `status` for the recreate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The application has never deployed, so there is no container to
            restart. Deploy it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/deploy:
    post:
      operationId: deployApplication
      tags: [deployments]
      summary: Deploy the application (build → rollout, zero-downtime)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "202":
          description: >-
            Accepted. Normally the pipeline has started; poll the deployment for
            progress. When the target environment requires approval
            (deploy-protection.md), the deployment comes back with
            `status: awaiting_approval` and its `approval` summary instead — no
            work item has been published, and it starts only once someone at or
            above `approval.required_role` approves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The environment is inside a freeze window; nothing was written. The
            error names the window and when it lifts, e.g. "production is frozen
            until Mon 08:00 Europe/Berlin", so the request can simply be retried
            after it. A team owner may open a break-glass grant first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/deployments:
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: The application's deployments, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}:
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: One deployment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/logs:
    get:
      operationId: streamDeploymentLogs
      tags: [deployments]
      summary: Stream build logs (Server-Sent Events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: >-
            Where the replay starts. Either a Go duration meaning "that long
            ago" (`15m`, `2h`, at most `720h`) or an RFC 3339 instant
            (`2026-09-06T09:00:00Z`). Omitted replays everything the stream
            still retains, then tails. A `since` older than the retention
            window yields whatever is retained; one in the future yields an
            empty replay that then tails. Anything unparseable is a `400`
            rather than a silent fall back to the whole window.
          example: 15m
      responses:
        "200":
          description: SSE stream of deployment build logs.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/environments/{id}/compose-stacks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Environment ID.
    get:
      operationId: listComposeStacks
      tags: [compose-stacks]
      summary: List the environment's Compose Stacks
      responses:
        "200":
          description: The stacks in this environment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComposeStack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Compose stacks are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createComposeStack
      tags: [compose-stacks]
      summary: Create a Compose Stack from a compose file
      description: >-
        **Team admin**, not member. A compose file can ask for
        `privileged: true`, host mounts and host networking — capabilities an
        Application cannot express and which amount to root on the node — so
        writing one is administration. Deploying an existing stack is a member
        action, because redeploying a file an admin already reviewed grants
        nothing new.


        Nothing is deployed here: a stack is born `stopped`, exactly as an
        application is, and the file becomes its first revision. Two directives
        are refused — `build:` (there is no builder on a target host) and
        `container_name:` (it collides across environments on one server).
        Everything else runs as-is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComposeStackRequest"
      responses:
        "201":
          description: Created. Deploy it to make it run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeStack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A stack with that name already exists in the environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Compose stacks are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/compose-stacks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Compose Stack ID (cs_... prefix).
    get:
      operationId: getComposeStack
      tags: [compose-stacks]
      summary: Get one Compose Stack
      responses:
        "200":
          description: The stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeStack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such compose stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Compose stacks are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateComposeStack
      tags: [compose-stacks]
      summary: Edit a Compose Stack
      description: >-
        **Team admin** when the request changes the compose file or the route;
        member otherwise. A changed file becomes a new revision but is NOT
        deployed — editing and shipping are separate acts, so a file can be
        reviewed before it reaches a host.


        A file identical to the current one mints no revision, so the history
        keeps meaning "the versions that were deployed".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComposeStackRequest"
      responses:
        "200":
          description: The updated stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeStack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such compose stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Compose stacks are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteComposeStack
      tags: [compose-stacks]
      summary: Delete a Compose Stack
      description: >-
        **Team admin.** Convergence never removes a volume, so
        `?delete_volumes=true` is the only way a stack's data goes — and it is
        never the default.
      parameters:
        - name: delete_volumes
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Destroy the stack's volumes as well. Irreversible.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such compose stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Compose stacks are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/compose-stacks/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Compose Stack ID (cs_... prefix).
    get:
      operationId: getComposeFile
      tags: [compose-stacks]
      summary: The compose file a deploy would ship
      description: >-
        The newest revision, not the row — so what is shown and what would run
        cannot differ.
      responses:
        "200":
          description: The current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such compose stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Compose stacks are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/compose-stacks/{id}/deploy:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Compose Stack ID (cs_... prefix).
    post:
      operationId: deployComposeStack
      tags: [compose-stacks]
      summary: Point desired state at the stack's current file
      description: >-
        Team member. There is no build and no distribute stage, so there is no
        Deployment record: desired state moves to the newest revision and the
        agent converges. Watch `status` for the outcome.
      responses:
        "202":
          description: Accepted. The agent converges toward the new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeStack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such compose stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The stack has no compose file yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Compose stacks are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/compose-stacks/{id}/rollback:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Compose Stack ID (cs_... prefix).
    post:
      operationId: rollbackComposeStack
      tags: [compose-stacks]
      summary: Re-point desired state at an older revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id]
              properties:
                revision_id:
                  type: string
                  description: A revision of THIS stack; another stack's is a 400.
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeStack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such compose stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Compose stacks are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/compose-stacks/{id}/revisions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Compose Stack ID (cs_... prefix).
    get:
      operationId: listComposeRevisions
      tags: [compose-stacks]
      summary: The stack's file history
      responses:
        "200":
          description: Revisions, newest first.
          content:
            application/json:
              schema:
