# CypherPanel control-plane REST API — the source of truth for the HTTP
# surface (ENGINEERING rule 19). Handlers implement this spec; the web UI's
# client is generated from it (arrives with web/ in Phase 4). Served live at
# GET /api/v1/openapi.yaml. Vocabulary is docs/glossary.md.
openapi: 3.1.0
info:
  title: CypherPanel API
  description: >-
    Operator-facing control-plane API covering Phases 1–3: authentication and
    teams/roles, the server lifecycle, projects/environments, applications and
    the deploy pipeline, managed databases with S3 backups/restore, preview
    environments, notifications, and scheduled tasks. Authentication is a bearer
    session token from /api/v1/auth/login; the GitHub webhook authenticates by
    per-application HMAC instead. Every project-scoped route is authorized by
    team membership (a non-member sees 404, insufficient rank 403).
  version: 0.3.0
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: teams
  - name: servers
  - name: projects
  - name: applications
  - name: deployments
  - name: deploy-keys
  - name: databases
  - name: backups
  - name: previews
  - name: notifiers
  - name: scheduled-tasks

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: readyz
      tags: [health]
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/setup:
    get:
      operationId: getSetupStatus
      tags: [auth]
      summary: Whether the panel needs first-run setup
      description: >-
        Public. Returns whether the panel has no account yet, so the UI can show
        the first-run setup screen instead of login. Reveals no secret.
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: setup
      tags: [auth]
      summary: Create the first owner account (one-time)
      description: >-
        Public and one-time. Creates the panel's first owner and signs it in.
        Once any account exists this returns 409, so it can never mint a second
        account on an open panel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Owner created and signed in. The token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The panel is already set up; sign in instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >-
            Session created. The token is returned exactly once and never
            retrievable again (only its hash is stored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: >-
            Invalid email or password (deliberately indistinguishable), OR the
            account has two-factor enabled and a valid `totp_code` was not
            supplied. In the latter case the body carries `"totp_required": true`
            and the client should re-submit with a code (the password check
            already passed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts from this client; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the current session
      responses:
        "204":
          description: Session deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The authenticated account and its teams
      responses:
        "200":
          description: The current user, with the teams they belong to and their role in each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tokens:
    get:
      operationId: listTokens
      tags: [auth]
      summary: List the caller's personal access tokens (metadata only)
      responses:
        "200":
          description: The caller's tokens, newest first. The secret is never returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createToken
      tags: [auth]
      summary: Create a personal access token
      description: >
        Issues a scoped API token that authenticates as the calling user,
        inheriting that user's role and team memberships. The raw token is
        returned exactly once in this response and never again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The created token, including the raw secret (shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tokens/{id}:
    delete:
      operationId: deleteToken
      tags: [auth]
      summary: Revoke a personal access token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/totp:
    get:
      operationId: getTotpStatus
      tags: [auth]
      summary: Two-factor authentication status for the current account
      responses:
        "200":
          description: Whether 2FA is enabled and how many recovery codes remain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [auth]
      summary: Begin two-factor enrollment
      description: >
        Generates a fresh TOTP secret and returns it (raw, for manual entry, and
        as an otpauth URI for QR rendering). Enrollment is NOT active until a
        code is confirmed via /auth/totp/verify. Fails with 409 if 2FA is
        already enabled — disable it first to re-enroll.
      responses:
        "200":
          description: A pending enrollment secret (activate it with verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Two-factor is already enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/totp/verify:
    post:
      operationId: verifyTotp
      tags: [auth]
      summary: Confirm a code and activate two-factor
      description: >
        Validates a code against the pending secret, activates 2FA, and returns a
        fresh set of single-use recovery codes — shown exactly once. Store them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Two-factor enabled; recovery codes returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPVerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid two-factor code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/totp/disable:
    post:
      operationId: disableTotp
      tags: [auth]
      summary: Disable two-factor
      description: >
        Turns off 2FA and clears recovery codes. Requires a valid authenticator
        or recovery code — a session alone cannot strip an account's second
        factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "204":
          description: Two-factor disabled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid two-factor code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ca.pem:
    get:
      operationId: getCaCert
      tags: [servers]
      summary: The control plane's CA certificate (public, for agent pinning)
      security: []
      responses:
        "200":
          description: PEM-encoded CA certificate.
          content:
            application/x-pem-file:
              schema:
                type: string

  /api/v1/events:
    get:
      operationId: streamEvents
      tags: [health]
      summary: Live resource-change stream (Server-Sent Events)
      description: >-
        An SSE stream of "invalidate" events — the caller fetches current state
        via the API on connect, then refetches a resource when this stream names
        it as changed (ui-principles §10). Scoped to the caller's visible
        resources (a panel owner sees all). Two event types: `connected` (once,
        empty) and `invalidate` (data: {resource, id}). The response media type
        is text/event-stream.
      responses:
        "200":
          description: The event stream (never closes until the client disconnects).
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags: [health]
      summary: This specification
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /install/agent.sh:
    get:
      operationId: getAgentInstaller
      tags: [servers]
      summary: The agent join installer
      description: >-
        POSIX shell script a joining server pipes to sh. Public and secret-free:
        the join token and CA fingerprint arrive via the install command from
        the operator's session, never in this script.
      security: []
      responses:
        "200":
          description: The installer script.
          content:
            text/x-shellscript:
              schema:
                type: string

  /api/v1/servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List all servers, newest first
      responses:
        "200":
          description: All registered servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createServer
      tags: [servers]
      summary: Register a server and issue its single-use join token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: >-
            Server registered. The join token appears exactly once in this
            response and is never retrievable again (threat-model §5.3).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Server ID (srv_… prefix).
    get:
      operationId: getServer
      tags: [servers]
      summary: One server
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete a server, revoking its agent
      description: >-
        Removes the server and its join tokens, severs the agent's live bus
        connection, and refuses the identity on any reconnect (threat-model §8
        requirement 6). Idempotent: deleting an absent server also returns 204.
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects, newest first
      responses:
        "200":
          description: All projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project and its default production environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created, with its default environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List the bundled template catalog
      responses:
        "200":
          description: Templates bundled with this release.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/templates/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get one bundled template
      responses:
        "200":
          description: Full declarative template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/templates/{slug}/install:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: installTemplate
      tags: [templates]
      summary: Resolve a template into ordinary resources and deploy it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallTemplateRequest" }
      responses:
        "202":
          description: Resources created and deployments scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallTemplateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID (prj_… prefix).
    get:
      operationId: getProject
      tags: [projects]
      summary: One project with its environments
      responses:
        "200":
          description: The project and its environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and everything in it
      description: Cascades to environments and their resources.
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects/{id}/environments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID (prj_… prefix).
    get:
      operationId: listEnvironments
      tags: [projects]
      summary: List a project's environments
      responses:
        "200":
          description: The project's environments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEnvironment
      tags: [projects]
      summary: Add an environment to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/environments/{id}/applications:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Environment ID (env_… prefix).
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications in an environment
      responses:
        "200":
          description: The environment's applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: >-
            Application created. The webhook secret appears exactly once in this
            response and is never retrievable again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID (app_… prefix).
    get:
      operationId: getApplication
      tags: [applications]
      summary: One application (secrets masked)
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update configuration (shapes the next revision; running revision unchanged until deploy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchApplicationRequest"
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: The merged configuration is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new name is already taken in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application and its env vars
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/applications/{id}/domain-check:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: checkApplicationDomain
      summary: Check whether this app's domain actually reaches it
      description: >-
        Resolves the domain and fetches it from the control plane, the way the
        public internet would, then reports who answered. A domain can resolve
        correctly and still be served by another program listening on port 80,
        which is invisible from inside the panel otherwise.
      tags: [applications]
      responses:
        "200":
          description: The check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/applications/{id}/logs:
    get:
      operationId: streamApplicationLogs
      tags: [applications]
      summary: Stream runtime logs (Server-Sent Events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of application logs.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/deploy:
    post:
      operationId: deployApplication
      tags: [deployments]
      summary: Deploy the application (build → rollout, zero-downtime)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "202":
          description: Pipeline started; poll the deployment for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/deployments:
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: The application's deployments, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}:
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: One deployment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/logs:
    get:
      operationId: streamDeploymentLogs
      tags: [deployments]
      summary: Stream build logs (Server-Sent Events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of deployment build logs.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/rollback:
    post:
      operationId: rollbackDeployment
      tags: [deployments]
      summary: Roll back to the revision this deployment shipped (build skipped)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Rollback pipeline started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The revision was never built; nothing to roll back to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/github/{id}:
    post:
      operationId: handleGithubWebhook
      tags: [deployments]
      summary: GitHub push webhook (HMAC-authenticated, no session)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The application's webhook id (wh_… prefix).
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: GitHub's HMAC-SHA256 body signature ("sha256=<hex>").
      responses:
        "202":
          description: Push on the configured branch; deployment started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "204":
          description: Authenticated, but not a deployable push (other branch, deletion, non-push event).
        "401":
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown webhook id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deploy-keys:
    get:
      operationId: listDeployKeys
      tags: [deploy-keys]
      summary: List all deploy keys (public key only)
      responses:
        "200":
          description: A list of deploy keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployKeysList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDeployKey
      tags: [deploy-keys]
      summary: Create a new deploy key for private repository access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeployKeyRequest"
      responses:
        "201":
          description: Deploy key created. The response carries the public key for the operator to register with their Git host; the private key is sealed server-side and never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDeployKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/deploy-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Deploy key ID (dk_... prefix).
    get:
      operationId: getDeployKey
      tags: [deploy-keys]
      summary: Get a deploy key by ID
      responses:
        "200":
          description: A single deploy key (public key only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deploy key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDeployKey
      tags: [deploy-keys]
      summary: Delete a deploy key (RESTRICT-gated by application references)
      responses:
        "204":
          description: Deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deploy key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Deploy key is still in use by one or more applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/env:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID.
    get:
      operationId: listEnvVarKeys
      tags: [applications]
      summary: List environment-variable keys (values are write-only)
      responses:
        "200":
          description: The keys only; values are never returned (ui-principles §6).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVarKeys"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/env/{key}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID.
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Environment-variable name.
    put:
      operationId: setEnvVar
      tags: [applications]
      summary: Set (create or replace) an environment variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEnvVarRequest"
      responses:
        "204":
          description: Stored (sealed at rest).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEnvVar
      tags: [applications]
      summary: Delete an environment variable
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Teams & users (teams-and-roles.md) ───────────────────────────────────
  /api/v1/teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List the caller's teams (all teams for a panel owner)
      responses:
        "200":
          description: Teams with the caller's role in each.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team (panel admin+); the creator becomes its owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/teams/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID (tm_… prefix). }
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team (member+)
      responses:
        "200": { description: The team., content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: renameTeam
      tags: [teams]
      summary: Rename a team (team owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RenameTeamRequest" } } }
      responses:
        "200": { description: Renamed., content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (team owner); refused while it owns projects
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The team still owns projects., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/teams/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID. }
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: List team members (member+)
      responses:
        "200": { description: The members., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TeamMember" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a member (team admin+; granting owner needs team owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddMemberRequest" } } }
      responses:
        "201": { description: Member added., content: { application/json: { schema: { $ref: "#/components/schemas/TeamMember" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teams/{id}/members/{uid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID. }
      - { name: uid, in: path, required: true, schema: { type: string }, description: User ID (usr_… prefix). }
    patch:
      operationId: changeTeamMemberRole
      tags: [teams]
      summary: Change a member's role (grant rules apply; the last owner is protected)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" } } }
      responses:
        "200": { description: Role changed., content: { application/json: { schema: { $ref: "#/components/schemas/TeamMember" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Would leave the team without an owner., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member (removing an owner needs team owner; last owner protected)
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Would leave the team without an owner., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [teams]
      summary: List all users (panel admin+)
      responses:
        "200": { description: Users., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      tags: [teams]
      summary: Create a user (panel admin+; a panel role above member needs panel owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateUserRequest" } } }
      responses:
        "201": { description: User created., content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: User ID. }
    patch:
      operationId: updateUserRole
      tags: [teams]
      summary: Change a user's panel role (panel owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetUserRoleRequest" } } }
      responses:
        "200": { description: Role changed., content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Would leave the panel without an owner., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteUser
      tags: [teams]
      summary: Delete a user (panel owner; never your own account)
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── Managed databases (managed-databases.md) ─────────────────────────────
  /api/v1/environments/{id}/databases:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Environment ID (env_… prefix). }
    get:
      operationId: listDatabases
      tags: [databases]
      summary: List databases in an environment
      responses:
        "200": { description: The environment's databases., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Database" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDatabase
      tags: [databases]
      summary: Create a managed database
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDatabaseRequest" } } }
      responses:
        "201":
          description: >-
            Database created. root_password appears exactly once here and is
            never retrievable (fetch a fresh one via reset-password).
          content: { application/json: { schema: { $ref: "#/components/schemas/CreateDatabaseResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID (db_… prefix). }
    get:
      operationId: getDatabase
      tags: [databases]
      summary: Get a database
      responses:
        "200": { description: The database., content: { application/json: { schema: { $ref: "#/components/schemas/Database" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateDatabase
      tags: [databases]
      summary: Update a database's config (creates a new revision if changed)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchDatabaseRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Database" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDatabase
      tags: [databases]
      summary: Delete a database
      responses:
        "204": { description: Deletion accepted (reconciled by the agent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopDatabase
      tags: [databases]
      summary: Stop a database
      responses:
        "202": { description: Stop accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/start:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: startDatabase
      tags: [databases]
      summary: Start a database
      responses:
        "202": { description: Start accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/reset-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resetDatabasePassword
      tags: [databases]
      summary: Reset the root password (returned once)
      responses:
        "200": { description: New password, shown once., content: { application/json: { schema: { $ref: "#/components/schemas/ResetPasswordResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Engine does not use password auth., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/databases/{id}/connection-info:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDatabaseConnectionInfo
      tags: [databases]
      summary: Connection details (password masked)
      responses:
        "200": { description: Connection info., content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Backups (managed-databases.md §7) ────────────────────────────────────
  /api/v1/backup-targets:
    get:
      operationId: listBackupTargets
      tags: [backups]
      summary: List S3-compatible backup targets
      responses:
        "200": { description: Targets (credentials never included)., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BackupTarget" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createBackupTarget
      tags: [backups]
      summary: Create a backup target (panel admin+)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateBackupTargetRequest" } } }
      responses:
        "201": { description: Target created., content: { application/json: { schema: { $ref: "#/components/schemas/BackupTarget" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/backup-targets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Backup target ID (bt_… prefix). }
    get:
      operationId: getBackupTarget
      tags: [backups]
      summary: Get a backup target
      responses:
        "200": { description: The target., content: { application/json: { schema: { $ref: "#/components/schemas/BackupTarget" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBackupTarget
      tags: [backups]
      summary: Delete a backup target (panel admin+; refused while in use)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: In use by one or more backup schedules., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/databases/{id}/backups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
    get:
      operationId: listDatabaseBackups
      tags: [backups]
      summary: List a database's backup schedules
      responses:
        "200": { description: Schedules., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DatabaseBackup" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDatabaseBackup
      tags: [backups]
      summary: Create a backup schedule
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDatabaseBackupRequest" } } }
      responses:
        "201": { description: Schedule created., content: { application/json: { schema: { $ref: "#/components/schemas/DatabaseBackup" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/backups/{bak_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
      - { name: bak_id, in: path, required: true, schema: { type: string }, description: Backup schedule ID (bak_… prefix). }
    delete:
      operationId: deleteDatabaseBackup
      tags: [backups]
      summary: Delete a backup schedule
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/backups/{bak_id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
      - { name: bak_id, in: path, required: true, schema: { type: string }, description: Backup schedule ID. }
    get:
      operationId: listBackupHistory
      tags: [backups]
      summary: List a schedule's backup run history
      responses:
        "200": { description: Backup records, newest first., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BackupRecord" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/backups/{bak_id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
      - { name: bak_id, in: path, required: true, schema: { type: string }, description: Backup schedule ID. }
    post:
      operationId: runBackupNow
      tags: [backups]
      summary: Run a backup now
      responses:
        "202": { description: Backup started; the record tracks progress., content: { application/json: { schema: { $ref: "#/components/schemas/RunBackupResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
    post:
      operationId: restoreDatabase
      tags: [backups]
      summary: Restore a database from a backup (destructive; confirm required)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RestoreRequest" } } }
      responses:
        "202": { description: Restore started. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Confirmation missing or the database is not in a restorable state., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ─── Preview environments (preview-environments.md §7) ────────────────────
  /api/v1/applications/{id}/previews:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Source application ID. }
    get:
      operationId: listPreviews
      tags: [previews]
      summary: List an application's previews
      responses:
        "200": { description: Previews., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Preview" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/previews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Preview ID (prv_… prefix). }
    get:
      operationId: getPreview
      tags: [previews]
      summary: Get a preview
      responses:
        "200": { description: The preview., content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePreview
      tags: [previews]
      summary: Tear down a preview (async)
      responses:
        "202": { description: Teardown accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Notifications (notifications.md §7) ──────────────────────────────────
  /api/v1/projects/{id}/notifiers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    get:
      operationId: listNotifiers
      tags: [notifiers]
      summary: List a project's notifiers
      responses:
        "200": { description: Notifiers (channel config never included; config_hint only)., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Notifier" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createNotifier
      tags: [notifiers]
      summary: Create a notifier
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateNotifierRequest" } } }
      responses:
        "201": { description: Notifier created., content: { application/json: { schema: { $ref: "#/components/schemas/Notifier" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notifiers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Notifier ID (ntf_… prefix). }
    get:
      operationId: getNotifier
      tags: [notifiers]
      summary: Get a notifier
      responses:
        "200": { description: The notifier., content: { application/json: { schema: { $ref: "#/components/schemas/Notifier" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateNotifier
      tags: [notifiers]
      summary: Update a notifier (omit config to keep the sealed value)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchNotifierRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Notifier" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteNotifier
      tags: [notifiers]
      summary: Delete a notifier
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notifiers/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Notifier ID. }
    post:
      operationId: testNotifier
      tags: [notifiers]
      summary: Send a synthetic test notification through this notifier
      responses:
        "202": { description: Delivery attempted (a channel failure is logged, not surfaced). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Scheduled tasks (scheduled-tasks.md §7) ──────────────────────────────
  /api/v1/applications/{id}/scheduled-tasks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    get:
      operationId: listScheduledTasks
      tags: [scheduled-tasks]
      summary: List an application's scheduled tasks
      responses:
        "200": { description: Tasks., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduledTask" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createScheduledTask
      tags: [scheduled-tasks]
      summary: Create a scheduled task (cron; command is argv, not a shell string)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateScheduledTaskRequest" } } }
      responses:
        "201": { description: Task created., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/scheduled-tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Scheduled task ID (sch_… prefix). }
    get:
      operationId: getScheduledTask
      tags: [scheduled-tasks]
      summary: Get a scheduled task
      responses:
        "200": { description: The task., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateScheduledTask
      tags: [scheduled-tasks]
      summary: Update a scheduled task
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateScheduledTaskRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteScheduledTask
      tags: [scheduled-tasks]
      summary: Delete a scheduled task
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/scheduled-tasks/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Scheduled task ID. }
    get:
      operationId: listScheduledTaskRuns
      tags: [scheduled-tasks]
      summary: List a task's recent run history
      responses:
        "200": { description: Runs, newest first., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduledTaskRun" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }


components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Session token from /api/v1/auth/login.

  responses:
    BadRequest:
      description: Malformed or invalid request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A backing dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but the caller's role is insufficient for this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        No such resource — also returned when the caller is not a member of the
        owning team, so resource existence never leaks across tenants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message; never contains secrets.

    SetupStatus:
      type: object
      required: [needs_setup]
      properties:
        needs_setup:
          type: boolean
          description: True when the panel has no account yet.

    SetupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        totp_code:
          type: string
          description: >
            Second factor, required only for 2FA-enabled accounts: a 6-digit
            authenticator code or a recovery code. If omitted for such an
            account, login returns 401 with "totp_required": true.

    TOTPStatus:
      type: object
      required: [enabled, recovery_codes_left]
      properties:
        enabled:
          type: boolean
        recovery_codes_left:
          type: integer
          description: Unused single-use recovery codes remaining.

    TOTPEnrollResponse:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry into an authenticator app.
        otpauth_uri:
          type: string
          description: otpauth:// URI the client renders as a QR code.

    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: An authenticator code or a recovery code.

    TOTPVerifyResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: >
            Single-use recovery codes, shown exactly once. Store them now —
            they are the only way in if the authenticator is lost.

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          description: usr_… prefixed ID.
        email:
          type: string
        role:
          type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer session token; shown once, store client-side.
        user:
          $ref: "#/components/schemas/User"

    ApiToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          description: tok_… prefixed ID.
        name:
          type: string
          description: Human-readable label.
        last_used_at:
          type: string
          format: date-time
          description: When the token last authenticated a request; absent if never used.
        expires_at:
          type: string
          format: date-time
          description: When the token expires; absent if it never expires.
        created_at:
          type: string
          format: date-time

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable label (1–100 characters).
        expires_in_days:
          type: integer
          description: Lifetime in days; 0 or omitted means the token never expires.
          minimum: 0
          maximum: 3650

    CreateTokenResponse:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >
                The raw bearer token (cyp_… prefixed). Shown exactly once —
                store it now; it cannot be retrieved again.

    Server:
      type: object
      required:
        [id, name, status, driver, agent_version, hostname, enrolled, created_at]
      properties:
        id:
          type: string
          description: srv_… prefixed ID; also the CN of the agent's certificate.
        name:
          type: string
        status:
          type: string
          description: Single status vocabulary (ui-principles §5).
          enum: [running, deploying, stopped, error, degraded, unknown]
        driver:
          type: string
          description: Orchestrator driver the agent reports (e.g. docker).
        role:
          type: string
          description: >-
            Agent-asserted role (builder-role-and-relay.md §1). "all" builds
            and runs; "builder" only builds; "worker" only runs. Read-only —
            set via the agent's --role flag, recorded from heartbeats.
          enum: [all, builder, worker]
        agent_version:
          type: string
        hostname:
          type: string
        enrolled:
          type: boolean
          description: Whether an agent has completed enrollment.
        enrolled_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: Time of the most recent heartbeat; null if never seen.
        created_at:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    JoinInstructions:
      type: object
      required:
        [token, enroll_addr, nats_url, ca_cert_pem, ca_fingerprint, command, install_command]
      properties:
        token:
          type: string
          description: Single-use join token; never shown again.
        enroll_addr:
          type: string
          description: host:port of the gRPC enrollment endpoint.
        nats_url:
          type: string
          description: tls:// URL of the data-plane bus.
        ca_cert_pem:
          type: string
          description: PEM CA certificate to pin during enrollment.
        ca_fingerprint:
          type: string
          description: >-
            SHA-256 hex of ca_cert_pem. Travels in the install command so the
            installer can verify the CA it fetches from the plane.
        command:
          type: string
          description: Manual cypher-agent enroll command (binary preinstalled).
        install_command:
          type: string
          description: Ready-to-paste curl|sh join line (the acceptance path).

    CreateServerResponse:
      type: object
      required: [server, join]
      properties:
        server:
          $ref: "#/components/schemas/Server"
        join:
          $ref: "#/components/schemas/JoinInstructions"

    Project:
      type: object
      required: [id, name, team_id, created_at]
      properties:
        id:
          type: string
          description: prj_… prefixed ID.
        name:
          type: string
        team_id:
          type: string
          description: tm_… prefixed ID of the owning team.
        created_at:
          type: string
          format: date-time

    Environment:
      type: object
      required: [id, project_id, name, created_at]
      properties:
        id:
          type: string
          description: env_… prefixed ID.
        project_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        team_id:
          type: string
          description: >-
            Owning team. Optional when the caller belongs to exactly one team
            (defaulted); required (400) when the caller belongs to several.

    CreateProjectResponse:
      type: object
      required: [project, default_environment]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        default_environment:
          $ref: "#/components/schemas/Environment"

    ProjectDetail:
      type: object
      required: [project, environments]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"

    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    AppSource:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [github, git_url, image]
        repo:
          type: string
          description: Git remote; required for `github` and `git_url`, empty for `image`.
        branch:
          type: string
          description: Branch to build; defaults to `main` for git kinds, empty for `image`.
        deploy_key_id:
          type: [string, "null"]
        image:
          type: string
          maxLength: 512
          description: >-
            OCI image reference (registry/repository[:tag][@digest]); required
            for kind `image`, empty otherwise. The target agent pulls it — no
            build stage runs, and deploys go straight to rollout. A digest is
            immutable and fetched once; a tag is re-fetched on every deploy, so
            redeploying a moved tag runs the new image rather than a cached one.

    DomainCheck:
      type: object
      required: [domain, verdict, summary, resolved_ips]
      properties:
        domain: { type: string }
        verdict:
          type: string
          enum: [ok, no_domain, no_dns, unreachable, served_by_other]
        summary:
          type: string
          description: One plain-language sentence describing what was found.
        remedy:
          type: string
          description: What to do about it; absent when the verdict is ok.
        resolved_ips:
          type: array
          items: { type: string }
        http_status: { type: integer }
        served_by:
          type: string
          description: The Server header of whatever answered, when it was not CypherPanel.

    AppBuild:
      type: object
      required: [kind, dockerfile_path, context]
      properties:
        kind:
          type: string
          enum: [auto, dockerfile, static]
          default: auto
          description: >-
            How the checkout becomes an image. `dockerfile` builds the file at
            `dockerfile_path`. `static` serves the build context as a website
            behind nginx, listening on `runtime.port`. `auto` decides by looking
            at the repository: a Dockerfile if there is one, otherwise a static
            site if there is an index.html, and a clear failure naming both if
            neither. Detection runs on the builder agent, where the source
            actually is — the control plane never fetches a repository.
        dockerfile_path:
          type: string
          description: Ignored for a `static` build.
        context:
          type: string

    AppVolume:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: Operator label (lowercase alphanumeric + dashes); the Docker volume name is derived from it.
        path:
          type: string
          description: Absolute mount path inside the container.

    AppRuntime:
      type: object
      required: [server_id, port, replicas]
      properties:
        server_id:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        replicas:
          type: integer
          description: Fixed at 1 for v1 (multiple replicas are post-v1).
        cpu_limit:
          type: [number, "null"]
          description: Fractional cores; null/omitted/0 = no limit (noisy-neighbor control).
        memory_limit_mb:
          type: [integer, "null"]
          description: MiB; null/omitted/0 = no limit.

    AppPort:
      type: object
      required: [host_port, container_port, protocol]
      properties:
        host_port:
          type: integer
          minimum: 1
          maximum: 65535
        container_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
          description: Empty on input defaults to tcp.

    AppRoute:
      type: object
      required: [https, path_prefix]
      properties:
        domain:
          type: string
          description: >
            Public HTTP hostname. OPTIONAL — an empty domain makes the app a raw
            (non-HTTP) service with no proxy route; expose it via `ports` instead.
        https:
          type: boolean
        path_prefix:
          type: string

    AppHealth:
      type: object
      required: [path, interval_seconds, timeout_seconds, retries]
      properties:
        kind:
          type: string
          enum: [http, tcp, none]
          description: >
            Rollout gate. "http" (default) probes path; "tcp" dials the container
            port; "none" is liveness-only for raw UDP services. Probe is internal.
        path:
          type: string
        interval_seconds:
          type: integer
        timeout_seconds:
          type: integer
        retries:
          type: integer

    Application:
      type: object
      required:
        [id, environment_id, name, source, build, runtime, route, health, webhook_id, created_at]
      properties:
        id:
          type: string
          description: app_… prefixed ID.
        environment_id:
          type: string
        name:
          type: string
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
          description: Persistent volume mounts (survive redeploys).
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Raw host-port publishes (tcp/udp), independent of the HTTP route.
        webhook_id:
          type: string
          description: Public webhook identifier used in the webhook URL.
        desired_revision_id:
          type: [string, "null"]
          description: Set on first deploy; rollback re-points it.
        status:
          type: string
          enum: [running, deploying, stopped, error, degraded, unknown]
          description: Observed state — what the agent last reported (ADR-005).
        status_detail:
          type: string
        observed_revision_id:
          type: string
          description: The revision actually serving per the last report.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.
        created_at:
          type: string
          format: date-time

    CreateApplicationRequest:
      type: object
      required: [name, source, runtime, route]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Raw host-port publishes (tcp/udp); route.domain may be empty for a raw service.
        env_vars:
          type: object
          additionalProperties:
            type: string
          description: Plaintext values; sealed before storage, never returned.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.

    WebhookInfo:
      type: object
      required: [url, secret]
      properties:
        url:
          type: string
        secret:
          type: string
          description: HMAC secret shown once; store it in your git provider now.

    CreateApplicationResponse:
      type: object
      required: [application, webhook]
      properties:
        application:
          $ref: "#/components/schemas/Application"
        webhook:
          $ref: "#/components/schemas/WebhookInfo"

    EnvVarKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string

    SetEnvVarRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    PatchApplicationRequest:
      type: object
      description: Absent sections stay unchanged; a present section replaces that section wholesale. The runtime server and replicas are not patchable.
      properties:
        name:
          type: string
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          type: object
          properties:
            port:
              type: integer
            cpu_limit:
              type: [number, "null"]
              description: Fractional cores; a non-positive value clears the limit.
            memory_limit_mb:
              type: [integer, "null"]
              description: MiB; a non-positive value clears the limit.
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
          description: Present = replace the volume set wholesale.
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Present = replace the port set wholesale.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.

    DeployRequest:
      type: object
      properties:
        ref:
          type: string
          description: Exact commit SHA to build; empty builds the configured branch's head.

    Deployment:
      type: object
      required: [id, application_id, revision_id, status, trigger, created_at]
      properties:
        id:
          type: string
        application_id:
          type: string
        revision_id:
          type: string
        status:
          type: string
          enum: [queued, building, distributing, rolling_out, succeeded, failed]
        trigger:
          type: string
          enum: [manual, webhook, rollback]
        detail:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    DeployKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        public_key:
          type: string
        fingerprint:
          type: string
        created_at:
          type: string
          format: date-time

    CreateDeployKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    CreateDeployKeyResponse:
      type: object
      required: [deploy_key]
      properties:
        deploy_key:
          $ref: "#/components/schemas/DeployKey"

    DeployKeysList:
      type: array
      items:
        $ref: "#/components/schemas/DeployKey"
    # ─── Teams & users ────────────────────────────────────────────────────────
    Me:
      type: object
      required: [id, email, role, teams]
      properties:
        id: { type: string }
        email: { type: string }
        role:
          type: string
          description: Panel role.
          enum: [member, admin, owner]
        teams:
          type: array
          items: { $ref: "#/components/schemas/Team" }
    Team:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, description: tm_… prefixed ID. }
        name: { type: string }
        role:
          type: string
          description: The requesting user's role in this team (present on listings and /auth/me).
          enum: [member, admin, owner]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamMember:
      type: object
      required: [user_id, email, role, created_at]
      properties:
        user_id: { type: string }
        email: { type: string }
        role: { type: string, enum: [member, admin, owner] }
        created_at: { type: string, format: date-time }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    RenameTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    AddMemberRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [member, admin, owner], default: member }
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [member, admin, owner] }
    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        role: { type: string, enum: [member, admin, owner], default: member }
    SetUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [member, admin, owner] }

    # ─── Databases ────────────────────────────────────────────────────────────
    Database:
      type: object
      required: [id, environment_id, name, engine, version, server_id, volume_name, network, root_user, require_password, status, desired_state, created_at, updated_at]
      properties:
        id: { type: string, description: db_… prefixed ID. }
        environment_id: { type: string }
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string }
        server_id: { type: string }
        cpu_limit: { type: [number, "null"], description: Fractional cores; null/0 = no limit. }
        memory_limit_mb: { type: [integer, "null"] }
        volume_name: { type: string, description: "Deterministic: cypher-db-<id>." }
        expose_port: { type: [integer, "null"], description: Host port; null = private only. }
        network: { type: string }
        root_user: { type: string }
        root_password: { type: string, description: Present only on create / reset; shown once. }
        require_password: { type: boolean }
        status: { type: string, enum: [running, provisioning, stopped, error, unknown] }
        status_detail: { type: string }
        desired_state:
          type: string
          enum: [running, stopped]
          description: >-
            What the operator asked for, as distinct from `status` (what the
            agent last observed). Start/stop are guarded on this, so a client
            must gate those actions on `desired_state` rather than `status` —
            otherwise it offers Start whenever reality is still catching up
            with intent, and the call is rejected.
        desired_revision_id: { type: [string, "null"] }
        observed_revision_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDatabaseRequest:
      type: object
      required: [name, engine, server_id]
      properties:
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string, description: Defaulted from the engine matrix when omitted. }
        server_id: { type: string }
        cpu_limit: { type: number, description: Fractional cores; 0 = no limit. }
        memory_limit_mb: { type: integer }
        expose_port: { type: integer, description: 0 or omitted = private only. }
        require_password: { type: boolean }
    CreateDatabaseResponse:
      type: object
      required: [database, root_password]
      properties:
        database: { $ref: "#/components/schemas/Database" }
        root_password: { type: string, description: Shown exactly once. }
    PatchDatabaseRequest:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        cpu_limit: { type: number }
        memory_limit_mb: { type: integer }
        expose_port: { type: integer }
    ResetPasswordResponse:
      type: object
      required: [root_password]
      properties:
        root_password: { type: string, description: Shown exactly once. }
    ConnectionInfo:
      type: object
      required: [host, port, password_hint, internal_host]
      properties:
        host: { type: string }
        port: { type: integer }
        user: { type: string }
        password_hint: { type: string, description: Never the password itself. }
        internal_host: { type: string, description: Address on the environment's private network. }

    # ─── Templates ────────────────────────────────────────────────────────────
    Template:
      type: object
      required: [schema, slug, name, description, category, version, resources]
      properties:
        schema: { type: string, enum: [v1] }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [analytics, automation, cms, dev-tools, monitoring, security, storage, other] }
        version: { type: string }
        resources:
          $ref: "#/components/schemas/TemplateResources"
    TemplateResources:
      type: object
      required: [databases, applications]
      properties:
        databases:
          type: array
          items: { $ref: "#/components/schemas/TemplateDatabase" }
        applications:
          type: array
          items: { $ref: "#/components/schemas/TemplateApplication" }
    TemplateDatabase:
      type: object
      required: [name, engine, version]
      properties:
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string }
    TemplateApplication:
      type: object
      required: [name, image, port, route, health, volumes, ports, env]
      properties:
        name: { type: string }
        image: { type: string }
        port: { type: integer }
        route: { type: boolean }
        health:
          type: object
          required: [kind, path]
          properties:
            kind: { type: string, enum: [http, tcp, none, ""] }
            path: { type: string }
        volumes:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
        ports:
          type: array
          items:
            type: object
            required: [host, container, protocol]
            properties:
              host: { type: integer }
              container: { type: integer }
              protocol: { type: string, enum: [tcp, udp, ""] }
        env:
          type: object
          additionalProperties: { type: string }
    InstallTemplateRequest:
      type: object
      required: [environment_id, server_id]
      properties:
        environment_id: { type: string }
        server_id: { type: string }
        domain: { type: string }
        name: { type: string }
    InstallTemplateResponse:
      type: object
      required: [applications, databases]
      properties:
        applications:
          type: array
          items: { type: string }
        databases:
          type: array
          items: { type: string }

    # ─── Backups ──────────────────────────────────────────────────────────────
    BackupTarget:
      type: object
      required: [id, name, endpoint, bucket, region, path_prefix, created_at, updated_at]
      properties:
        id: { type: string, description: bt_… prefixed ID. }
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        path_prefix: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateBackupTargetRequest:
      type: object
      required: [name, endpoint, bucket, access_key, secret_key]
      properties:
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        access_key: { type: string, description: Sealed at rest; never returned. }
        secret_key: { type: string, description: Sealed at rest; never returned. }
        path_prefix: { type: string }
    DatabaseBackup:
      type: object
      required: [id, database_id, target_id, schedule, retention_count, enabled, created_at, updated_at]
      properties:
        id: { type: string, description: bak_… prefixed ID. }
        database_id: { type: string }
        target_id: { type: string }
        schedule: { type: string, description: 5-field cron. }
        retention_count: { type: integer }
        enabled: { type: boolean }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDatabaseBackupRequest:
      type: object
      required: [target_id, schedule]
      properties:
        target_id: { type: string }
        schedule: { type: string, description: 5-field cron. }
        retention_count: { type: integer }
        enabled: { type: boolean, default: true }
    BackupRecord:
      type: object
      required: [id, database_backup_id, size_bytes, status, started_at, created_at]
      properties:
        id: { type: string, description: br_… prefixed ID. }
        database_backup_id: { type: string }
        object_key: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [running, succeeded, failed] }
        detail: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    RunBackupResponse:
      type: object
      required: [record]
      properties:
        record: { $ref: "#/components/schemas/BackupRecord" }
    RestoreRequest:
      type: object
      required: [backup_record_id, confirm]
      properties:
        backup_record_id: { type: string }
        confirm: { type: boolean, description: Must be true — restore overwrites the database. }

    # ─── Previews ───────────────────────────────────────────────────────────────
    Preview:
      type: object
      required: [id, source_app_id, environment_id, pr_number, pr_branch, domain, status, created_at]
      properties:
        id: { type: string, description: prv_… prefixed ID. }
        source_app_id: { type: string }
        environment_id: { type: string, description: The child environment created for this preview. }
        preview_app_id: { type: [string, "null"], description: The cloned application. }
        pr_number: { type: integer }
        pr_branch: { type: string }
        domain: { type: string, description: "pr-<n>.<base>." }
        status: { type: string, enum: [creating, running, error, destroying] }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # ─── Notifiers ──────────────────────────────────────────────────────────────
    Notifier:
      type: object
      required: [id, project_id, name, channel, events, enabled, config_hint, created_at, updated_at]
      properties:
        id: { type: string, description: ntf_… prefixed ID. }
        project_id: { type: string }
        name: { type: string }
        channel: { type: string, enum: [email, discord, slack, telegram] }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
        config_hint: { type: string, description: Masked summary of the sealed channel config; never the secret. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateNotifierRequest:
      type: object
      required: [name, channel, config, events]
      properties:
        name: { type: string }
        channel: { type: string, enum: [email, discord, slack, telegram] }
        config:
          type: object
          description: >-
            Channel-specific config, sealed at rest and never returned. email:
            {smtp_host, smtp_port, username, password, from, to}; discord/slack:
            {webhook_url}; telegram: {bot_token, chat_id}.
          additionalProperties: true
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean, default: true }
    PatchNotifierRequest:
      type: object
      properties:
        name: { type: string }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
        config:
          type: object
          description: Supply to reseal the channel config wholesale; omit to keep the existing sealed value.
          additionalProperties: true

    # ─── Scheduled tasks ──────────────────────────────────────────────────────
    ScheduledTask:
      type: object
      required: [id, application_id, name, schedule, command, enabled, created_at, updated_at]
      properties:
        id: { type: string, description: sch_… prefixed ID. }
        application_id: { type: string }
        name: { type: string }
        schedule: { type: string, description: 5-field cron. }
        command:
          type: array
          items: { type: string }
          description: argv, passed straight to exec (never a shell string; use ["sh","-c","…"] for a shell).
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateScheduledTaskRequest:
      type: object
      required: [name, schedule, command]
      properties:
        name: { type: string }
        schedule: { type: string, description: 5-field cron. }
        command:
          type: array
          minItems: 1
          items: { type: string }
        enabled: { type: boolean, default: true }
    ScheduledTaskRun:
      type: object
      required: [id, task_id, started_at, status]
      properties:
        id: { type: string, description: str_… prefixed ID. }
        task_id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        exit_code: { type: [integer, "null"] }
        status: { type: string, enum: [running, succeeded, failed] }
        output_tail: { type: string, description: Capped stdout+stderr tail. }
security:
  - bearer: []
