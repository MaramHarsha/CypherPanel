# CypherPanel control-plane REST API — the source of truth for the HTTP
# surface (ENGINEERING rule 19). Handlers implement this spec; the web UI's
# client is generated from it (arrives with web/ in Phase 4). Served live at
# GET /api/v1/openapi.yaml. Vocabulary is docs/glossary.md.
openapi: 3.1.0
info:
  title: CypherPanel API
  description: >-
    Operator-facing control-plane API. Phase 1 covers authentication and the
    server lifecycle (register, list, inspect, delete) for the control-plane ↔
    agent handshake. Authentication is a bearer session token from
    /api/v1/auth/login.
  version: 0.1.0
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: servers
  - name: projects
  - name: applications

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >-
            Session created. The token is returned exactly once and never
            retrievable again (only its hash is stored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password (deliberately indistinguishable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts from this client; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the current session
      responses:
        "204":
          description: Session deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: The authenticated account
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ca.pem:
    get:
      tags: [servers]
      summary: The control plane's CA certificate (public, for agent pinning)
      security: []
      responses:
        "200":
          description: PEM-encoded CA certificate.
          content:
            application/x-pem-file:
              schema:
                type: string

  /api/v1/openapi.yaml:
    get:
      tags: [health]
      summary: This specification
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /install/agent.sh:
    get:
      tags: [servers]
      summary: The agent join installer
      description: >-
        POSIX shell script a joining server pipes to sh. Public and secret-free:
        the join token and CA fingerprint arrive via the install command from
        the operator's session, never in this script.
      security: []
      responses:
        "200":
          description: The installer script.
          content:
            text/x-shellscript:
              schema:
                type: string

  /api/v1/servers:
    get:
      tags: [servers]
      summary: List all servers, newest first
      responses:
        "200":
          description: All registered servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [servers]
      summary: Register a server and issue its single-use join token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: >-
            Server registered. The join token appears exactly once in this
            response and is never retrievable again (threat-model §5.3).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Server ID (srv_… prefix).
    get:
      tags: [servers]
      summary: One server
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [servers]
      summary: Delete a server, revoking its agent
      description: >-
        Removes the server and its join tokens, severs the agent's live bus
        connection, and refuses the identity on any reconnect (threat-model §8
        requirement 6). Idempotent: deleting an absent server also returns 204.
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects:
    get:
      tags: [projects]
      summary: List all projects, newest first
      responses:
        "200":
          description: All projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [projects]
      summary: Create a project and its default production environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created, with its default environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID (prj_… prefix).
    get:
      tags: [projects]
      summary: One project with its environments
      responses:
        "200":
          description: The project and its environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [projects]
      summary: Delete a project and everything in it
      description: Cascades to environments and their resources.
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects/{id}/environments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID (prj_… prefix).
    get:
      tags: [projects]
      summary: List a project's environments
      responses:
        "200":
          description: The project's environments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [projects]
      summary: Add an environment to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/environments/{id}/applications:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Environment ID (env_… prefix).
    get:
      tags: [applications]
      summary: List applications in an environment
      responses:
        "200":
          description: The environment's applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [applications]
      summary: Create an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: >-
            Application created. The webhook secret appears exactly once in this
            response and is never retrievable again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID (app_… prefix).
    get:
      tags: [applications]
      summary: One application (secrets masked)
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [applications]
      summary: Update configuration (shapes the next revision; running revision unchanged until deploy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchApplicationRequest"
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: The merged configuration is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new name is already taken in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [applications]
      summary: Delete an application and its env vars
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/applications/{id}/logs:
    get:
      tags: [applications]
      summary: Stream runtime logs (Server-Sent Events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of application logs.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/deploy:
    post:
      tags: [deployments]
      summary: Deploy the application (build → rollout, zero-downtime)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "202":
          description: Pipeline started; poll the deployment for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/deployments:
    get:
      tags: [deployments]
      summary: The application's deployments, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}:
    get:
      tags: [deployments]
      summary: One deployment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/logs:
    get:
      tags: [deployments]
      summary: Stream build logs (Server-Sent Events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of deployment build logs.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/rollback:
    post:
      tags: [deployments]
      summary: Roll back to the revision this deployment shipped (build skipped)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Rollback pipeline started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The revision was never built; nothing to roll back to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/github/{id}:
    post:
      tags: [deployments]
      summary: GitHub push webhook (HMAC-authenticated, no session)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The application's webhook id (wh_… prefix).
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: GitHub's HMAC-SHA256 body signature ("sha256=<hex>").
      responses:
        "202":
          description: Push on the configured branch; deployment started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "204":
          description: Authenticated, but not a deployable push (other branch, deletion, non-push event).
        "401":
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown webhook id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deploy-keys:
    get:
      tags: [deploy-keys]
      summary: List all deploy keys (public key only)
      responses:
        "200":
          description: A list of deploy keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployKeysList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [deploy-keys]
      summary: Create a new deploy key for private repository access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeployKeyRequest"
      responses:
        "201":
          description: Deploy key created. Public key is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDeployKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/deploy-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Deploy key ID (dk_... prefix).
    get:
      tags: [deploy-keys]
      summary: Get a deploy key by ID
      responses:
        "200":
          description: A single deploy key (public key only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deploy key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [deploy-keys]
      summary: Delete a deploy key (RESTRICT-gated by application references)
      responses:
        "204":
          description: Deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such deploy key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Deploy key is still in use by one or more applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/env:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID.
    get:
      tags: [applications]
      summary: List environment-variable keys (values are write-only)
      responses:
        "200":
          description: The keys only; values are never returned (ui-principles §6).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVarKeys"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/env/{key}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID.
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Environment-variable name.
    put:
      tags: [applications]
      summary: Set (create or replace) an environment variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEnvVarRequest"
      responses:
        "204":
          description: Stored (sealed at rest).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [applications]
      summary: Delete an environment variable
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Session token from /api/v1/auth/login.

  responses:
    BadRequest:
      description: Malformed or invalid request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A backing dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message; never contains secrets.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          description: usr_… prefixed ID.
        email:
          type: string
        role:
          type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer session token; shown once, store client-side.
        user:
          $ref: "#/components/schemas/User"

    Server:
      type: object
      required:
        [id, name, status, driver, agent_version, hostname, enrolled, created_at]
      properties:
        id:
          type: string
          description: srv_… prefixed ID; also the CN of the agent's certificate.
        name:
          type: string
        status:
          type: string
          description: Single status vocabulary (ui-principles §5).
          enum: [running, deploying, stopped, error, degraded, unknown]
        driver:
          type: string
          description: Orchestrator driver the agent reports (e.g. docker).
        agent_version:
          type: string
        hostname:
          type: string
        enrolled:
          type: boolean
          description: Whether an agent has completed enrollment.
        enrolled_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: Time of the most recent heartbeat; null if never seen.
        created_at:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    JoinInstructions:
      type: object
      required:
        [token, enroll_addr, nats_url, ca_cert_pem, ca_fingerprint, command, install_command]
      properties:
        token:
          type: string
          description: Single-use join token; never shown again.
        enroll_addr:
          type: string
          description: host:port of the gRPC enrollment endpoint.
        nats_url:
          type: string
          description: tls:// URL of the data-plane bus.
        ca_cert_pem:
          type: string
          description: PEM CA certificate to pin during enrollment.
        ca_fingerprint:
          type: string
          description: >-
            SHA-256 hex of ca_cert_pem. Travels in the install command so the
            installer can verify the CA it fetches from the plane.
        command:
          type: string
          description: Manual cypher-agent enroll command (binary preinstalled).
        install_command:
          type: string
          description: Ready-to-paste curl|sh join line (the acceptance path).

    CreateServerResponse:
      type: object
      required: [server, join]
      properties:
        server:
          $ref: "#/components/schemas/Server"
        join:
          $ref: "#/components/schemas/JoinInstructions"

    Project:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          description: prj_… prefixed ID.
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Environment:
      type: object
      required: [id, project_id, name, created_at]
      properties:
        id:
          type: string
          description: env_… prefixed ID.
        project_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    CreateProjectResponse:
      type: object
      required: [project, default_environment]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        default_environment:
          $ref: "#/components/schemas/Environment"

    ProjectDetail:
      type: object
      required: [project, environments]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"

    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    AppSource:
      type: object
      required: [kind, repo, branch]
      properties:
        kind:
          type: string
          enum: [github, git_url]
        repo:
          type: string
        branch:
          type: string
        deploy_key_id:
          type: [string, "null"]

    AppBuild:
      type: object
      required: [kind, dockerfile_path, context]
      properties:
        kind:
          type: string
          enum: [dockerfile]
        dockerfile_path:
          type: string
        context:
          type: string

    AppRuntime:
      type: object
      required: [server_id, port, replicas]
      properties:
        server_id:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        replicas:
          type: integer
          description: Fixed at 1 for v1 (multiple replicas are post-v1).

    AppRoute:
      type: object
      required: [domain, https, path_prefix]
      properties:
        domain:
          type: string
        https:
          type: boolean
        path_prefix:
          type: string

    AppHealth:
      type: object
      required: [path, interval_seconds, timeout_seconds, retries]
      properties:
        path:
          type: string
        interval_seconds:
          type: integer
        timeout_seconds:
          type: integer
        retries:
          type: integer

    Application:
      type: object
      required:
        [id, environment_id, name, source, build, runtime, route, health, webhook_id, created_at]
      properties:
        id:
          type: string
          description: app_… prefixed ID.
        environment_id:
          type: string
        name:
          type: string
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        webhook_id:
          type: string
          description: Public webhook identifier used in the webhook URL.
        desired_revision_id:
          type: [string, "null"]
          description: Set on first deploy; rollback re-points it.
        status:
          type: string
          enum: [running, deploying, stopped, error, degraded, unknown]
          description: Observed state — what the agent last reported (ADR-005).
        status_detail:
          type: string
        observed_revision_id:
          type: string
          description: The revision actually serving per the last report.
        created_at:
          type: string
          format: date-time

    CreateApplicationRequest:
      type: object
      required: [name, source, runtime, route]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        env_vars:
          type: object
          additionalProperties:
            type: string
          description: Plaintext values; sealed before storage, never returned.

    WebhookInfo:
      type: object
      required: [url, secret]
      properties:
        url:
          type: string
        secret:
          type: string
          description: HMAC secret shown once; store it in your git provider now.

    CreateApplicationResponse:
      type: object
      required: [application, webhook]
      properties:
        application:
          $ref: "#/components/schemas/Application"
        webhook:
          $ref: "#/components/schemas/WebhookInfo"

    EnvVarKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string

    SetEnvVarRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    PatchApplicationRequest:
      type: object
      description: Absent sections stay unchanged; a present section replaces that section wholesale. The runtime server and replicas are not patchable.
      properties:
        name:
          type: string
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          type: object
          properties:
            port:
              type: integer
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"

    DeployRequest:
      type: object
      properties:
        ref:
          type: string
          description: Exact commit SHA to build; empty builds the configured branch's head.

    Deployment:
      type: object
      required: [id, application_id, revision_id, status, trigger, created_at]
      properties:
        id:
          type: string
        application_id:
          type: string
        revision_id:
          type: string
        status:
          type: string
          enum: [queued, building, distributing, rolling_out, succeeded, failed]
        trigger:
          type: string
          enum: [manual, webhook, rollback]
        detail:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    DeployKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        public_key:
          type: string
        fingerprint:
          type: string
        created_at:
          type: string
          format: date-time

    CreateDeployKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    CreateDeployKeyResponse:
      type: object
      required: [deploy_key]
      properties:
        deploy_key:
          $ref: "#/components/schemas/DeployKey"

    DeployKeysList:
      type: array
      items:
        $ref: "#/components/schemas/DeployKey"

security:
  - bearer: []
