          description: The registry, without its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No such registry — the same answer given for a registry in a team
            you do not belong to, so membership is not probeable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateRegistry
      tags: [registries]
      summary: Edit a registry, or rotate its token
      description: >-
        Team admin or above. Every field is optional; an omitted field is left
        alone, so rotating the token does not mean re-sending the URL. The
        merged result is validated exactly as a create would be.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRegistryRequest"
      responses:
        "200":
          description: The updated registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A registry with that name already exists in the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteRegistry
      tags: [registries]
      summary: Delete a registry (refused while applications use it)
