      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateBackupTargetRequest" } } }
      responses:
        "201": { description: Target created., content: { application/json: { schema: { $ref: "#/components/schemas/BackupTarget" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/backup-targets/{id}:
