    delete:
      operationId: deleteNotifier
      tags: [notifiers]
      summary: Delete a notifier
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{id}/notifiers/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    post:
      operationId: testNotifierConfig
      tags: [notifiers]
      summary: Prove a channel configuration before saving it
      description: >
        Validates the configuration exactly as create would, uses it once, and
        persists nothing. It exists because a dialog that can only test what it
        has already stored teaches operators to save broken credentials and find
        out later. A config the panel would refuse to store is a 400 — there is
        nothing to retry until the form changes — while a config that stores but
        does not reach its far end is `200 {ok:false, detail}`.


        Two limits apply here that do not apply to a saved notifier, because
        this path can be aimed anywhere, repeatedly, leaving no row behind.
        **The `email` channel is refused with 400**: an unsaved email test would
        relay a message through an arbitrary SMTP server, with an arbitrary
        From, to an arbitrary recipient — save the notifier and use
        `POST /notifiers/{id}/test`. **A webhook URL must be `https` with a
        dotted hostname** (no cleartext, no IP literal, no userinfo), and
        addresses that resolve into the panel's own network are refused at dial
        time.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TestNotifierConfigRequest" } } }
      responses:
        "200": { description: "Tested. `ok` is the verdict.", content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionTest" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { description: Notifications are not enabled on this panel., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/notifiers/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Notifier ID. }
    post:
      operationId: testNotifier
      tags: [notifiers]
      summary: Send a synthetic test notification through this notifier
      description: >
        Answers what happened. This used to return 202 without looking, so a
        notifier with a stale webhook URL reported success and the operator
        learned the truth from a notification that never arrived. A channel
        failure is `200 {ok:false, detail}`, not an error status: the request
        succeeded and the connection did not, and conflating the two costs the
        caller the distinction.
      responses:
        "200": { description: "Tested. `ok` is the verdict.", content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionTest" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Outbound webhooks (outbound-webhooks.md §7) ──────────────────────────
  #
  # Notifiers talk to people; these talk to machines. Every delivery is POSTed
  # as JSON signed with the endpoint's own secret. Verify it BEFORE parsing —
  # a signature over reserialised JSON signs the wrong bytes:
  #
  #   mac := hmac.New(sha256.New, []byte(endpointSecret))
  #   mac.Write([]byte(ts + "." + string(rawBody)))   // ts = X-CypherPanel-Timestamp
  #   got, ok := strings.CutPrefix(sig, "sha256=")    // sig = X-CypherPanel-Signature
  #   want := hex.EncodeToString(mac.Sum(nil))
  #   if !ok || !hmac.Equal([]byte(want), []byte(got)) { reject() }   // constant time
  #   if abs(now-atoi(ts)) > 300 { reject() }                         // 5-minute replay window
  #
  # Delivery is at-least-once and unordered: dedupe on X-CypherPanel-Delivery.
  /api/v1/projects/{id}/webhook-endpoints:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    get:
      operationId: listWebhookEndpoints
      tags: [webhooks]
      summary: List a project's outbound webhook endpoints
      responses:
        "200": { description: "Endpoints (the signing secret is never included).", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createWebhookEndpoint
      tags: [webhooks]
      summary: Create an outbound webhook endpoint (the signing secret is shown exactly once)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" } } }
      responses:
        "201": { description: "Endpoint created. `secret` is the raw HMAC signing secret and is returned here and never again.", content: { application/json: { schema: { $ref: "#/components/schemas/CreateWebhookEndpointResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: An endpoint with that URL already exists in the project. }
  /api/v1/webhook-endpoints/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook endpoint ID (whe_… prefix). }
    get:
      operationId: getWebhookEndpoint
      tags: [webhooks]
      summary: Get an outbound webhook endpoint
      responses:
        "200": { description: The endpoint., content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWebhookEndpoint
      tags: [webhooks]
      summary: Update an endpoint's url, events or enabled flag
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchWebhookEndpointRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: An endpoint with that URL already exists in the project. }
    delete:
      operationId: deleteWebhookEndpoint
      tags: [webhooks]
      summary: Delete an endpoint (its deliveries and attempts go with it)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/webhook-endpoints/{id}/rotate-secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook endpoint ID. }
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Replace the signing secret (returned once; no overlap window)
      responses:
        "200": { description: "The new signing secret. The previous one stops verifying immediately — send a ping to confirm the new one.", content: { application/json: { schema: { $ref: "#/components/schemas/WebhookSecret" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/webhook-endpoints/{id}/ping:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook endpoint ID. }
    post:
      operationId: pingWebhookEndpoint
      tags: [webhooks]
      summary: Send a synthetic webhook.ping delivery to prove the wiring
      responses:
        "202": { description: "Delivery recorded and attempted (detached). webhook.ping is delivery-only — it is never subscribed to, so an endpoint always receives its own pings.", content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The endpoint is disabled. }
  /api/v1/webhook-endpoints/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook endpoint ID. }
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Page an endpoint's delivery log, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Page size; caps at 100.
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: "Seek cursor: return deliveries strictly older than this delivery id."
      responses:
        "200": { description: "A page of deliveries plus the cursor for the next one (empty when this is the last page).", content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDeliveryPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/webhook-deliveries/{id}/redeliver:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Webhook delivery ID (whd_… prefix). }
    post:
      operationId: redeliverWebhookDelivery
      tags: [webhooks]
      summary: Replay a delivery as a new one
      responses:
        "202": { description: "A new delivery with a fresh id, a fresh attempt schedule and redelivery_of set. The original row is never mutated — the log is evidence.", content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The endpoint is disabled. }

  # ─── Audit log (audit-log.md §7) ──────────────────────────────────────────
  #
  # One immutable row per sensitive action: who did what to which resource, from
  # where, and whether it worked. It is what makes the destructive-confirm
  # dialog's promise ("audit-logged with your name") true, what the threat model
  # relies on to make a compromise reconstructable, and the answer to "who
  # deleted this?" after the resource itself is gone.
  #
  # There is no write route. A row is minted by the handler that performed the
  # action, never by a request to this collection — a log anyone can POST to is
  # not evidence.
  #
  # SCOPE IS THE AUTHORIZATION. Neither route carries a role gate; the service
  # resolves what the caller may see and every filter narrows inside it:
  #   * a panel owner sees every row (the same superadmin bypass team roles
  #     already grant);
  #   * anyone sees the rows of the teams they belong to;
  #   * a panel admin also sees PANEL-scoped rows — a server, a user, the
  #     mail/DNS/TLS settings — which belong to no team;
  #   * everyone sees their own actions, whatever scope those landed in.
  # A `team_id` the caller does not belong to therefore returns an EMPTY page,
  # not 403: the log must not become a way to probe for another tenant.
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Page the audit log, newest first
      description: >-
        Seek pagination on `(at, id)` descending: pass the previous page's
        `next_before` as `before`. An empty `next_before` is the end of the log.
        Every filter is optional and narrows within what the caller may already
        see.
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string }
          description: >-
            Only this team's rows. A team the caller does not belong to yields
            an empty page rather than 403.
        - name: project_id
          in: query
          required: false
          schema: { type: string }
          description: Only rows scoped to this project.
        - name: resource_id
          in: query
          required: false
          schema: { type: string }
          description: >-
            One resource's whole timeline — every action ever recorded against
            this id, including the one that deleted it.
        - name: action
          in: query
          required: false
          schema: { type: string }
          description: >-
            An exact verb (`deploy.started`) or a whole family by prefix
            (`deploy` selects every `deploy.*`). The vocabulary is closed and
            documented in `AuditEvent.action`.
          example: deploy
        - name: actor
          in: query
          required: false
          schema: { type: string }
          description: >-
            A user id (`usr_…`) or the email label recorded at the time, so
            "priya@example.com" works without resolving it to an id first.
        - name: outcome
          in: query
          required: false
          schema: { type: string, enum: [success, failure] }
          description: >-
            `failure` is every refused action — a wrong password, a deploy a
            freeze window turned away, a rejected approval.
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC 3339 lower bound on `at`. Omitted means unbounded.
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: >-
            Cursor: the id of the last event on the previous page. An id the
            caller may not see yields an empty page rather than restarting at
            the newest row.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of the log, newest first.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/audit/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Audit event ID (aud_… prefix). }
    get:
      operationId: getAuditEvent
      tags: [audit]
      summary: Get one audit entry
      description: >-
        The permalink behind an entry — what a trace id in a support
        conversation resolves to. An entry outside the caller's scope answers
        404, the same as one that does not exist.
      responses:
        "200":
          description: The audit entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Project shared variables (shared-variables.md §7) ────────────────
  #
  # One sealed value defined once for a whole project — or narrowed to a single
  # environment of it — referenced from any application's env vars as
  # {{shared.KEY}}. An environment-scoped variable shadows a project-scoped one
  # of the same key, so scope is a property of the VARIABLE, not of the
  # reference: promoting a value needs no edit in any referencing application.
  #
  # Values are write-only and carry no masked hint: a shared variable is already
  # identified by its key, so a hint would be gratuitous partial disclosure.
  # `key` and `environment_id` are immutable after create, and DELETE is guarded
  # with no force override — changing or removing either silently re-points or
  # orphans every referencing application.
  #
  # Changing a value does NOT redeploy anything. Every referencing application
  # reports `redeploy_pending: true` until it is deployed again; one edit
  # silently redeploying production is not a thing this API does.
  /api/v1/projects/{id}/shared-variables:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Project ID. }
    get:
      operationId: listSharedVariables
      tags: [shared-variables]
      summary: List a project's shared variables (both scopes)
      responses:
        "200": { description: "Shared variables, each with its scope-accurate used-by count. Values are never included.", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SharedVariable" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createSharedVariable
      tags: [shared-variables]
      summary: Create a shared variable (project scope, or scoped to one environment)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSharedVariableRequest" } } }
      responses:
        "201": { description: "Created. The value is sealed at rest and never returned.", content: { application/json: { schema: { $ref: "#/components/schemas/SharedVariable" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A shared variable with that key already exists in this scope. }
  /api/v1/shared-variables/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Shared variable ID (sv_… prefix). }
    get:
      operationId: getSharedVariable
      tags: [shared-variables]
      summary: Get a shared variable
      responses:
        "200": { description: The shared variable., content: { application/json: { schema: { $ref: "#/components/schemas/SharedVariable" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSharedVariable
      tags: [shared-variables]
      summary: Replace the value (key and scope are immutable)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchSharedVariableRequest" } } }
      responses:
        "200": { description: "Updated. Every referencing application now reports redeploy_pending until it is deployed again.", content: { application/json: { schema: { $ref: "#/components/schemas/SharedVariable" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSharedVariable
      tags: [shared-variables]
      summary: Delete a shared variable (refused while anything references it)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Still referenced. The message names the applications; remove the references first — there is no force override." }
  /api/v1/shared-variables/{id}/used-by:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Shared variable ID. }
    get:
      operationId: listSharedVariableUsage
      tags: [shared-variables]
      summary: List the applications that reference this variable
      responses:
        "200": { description: "Scope-accurate usage: an application whose own environment shadows the key is absent, because it does not use this variable.", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SharedVariableUsage" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Notification inbox (notification-inbox.md §6) ────────────────────────
  #
  # The panel's own record of what happened to what you own: the same observed
  # outcomes the notifier channels receive, persisted per user. There is no
  # owner segment in these paths on purpose — the inbox is ALWAYS the caller's,
  # and every route filters on the authenticated user's id. No route accepts
  # another user's id, so tenancy here is a column rather than a resolver.
  #
  # An API token acts as its owner: it reads and clears its owner's inbox and
  # nobody else's.
  /api/v1/inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      summary: Page the caller's own notification inbox, newest first
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean }
          description: "Pass true to return only unread items. Filtered-to-zero is a distinct state from an empty inbox."
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Page size; caps at 100.
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: "Seek cursor: return items strictly older than this item id. Keyset, not offset — a feed gains rows at the head while you page it."
      responses:
        "200": { description: "A page of items plus the cursor for the next one (empty when this is the last page).", content: { application/json: { schema: { $ref: "#/components/schemas/InboxPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/inbox/unread-count:
    get:
      operationId: getInboxUnreadCount
      tags: [inbox]
      summary: The caller's unread count — the bell's number
      responses:
        "200": { description: Unread item count., content: { application/json: { schema: { $ref: "#/components/schemas/InboxUnreadCount" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/inbox/read-all:
    post:
      operationId: markAllInboxRead
      tags: [inbox]
      summary: Mark every unread item read
      responses:
        "200": { description: "How many items this call actually changed. The items stay listed — reading is not deleting.", content: { application/json: { schema: { $ref: "#/components/schemas/InboxMarked" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/inbox/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Inbox item ID (inb_… prefix). }
    post:
      operationId: markInboxItemRead
      tags: [inbox]
      summary: Mark one item read (idempotent)
      responses:
        "204": { description: "Marked. Marking an already-read item returns 204 and changes nothing." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { description: "No such item in the caller's inbox — the same answer an item belonging to someone else gets." }
  /api/v1/inbox/preferences:
    get:
      operationId: getInboxPreferences
      tags: [inbox]
      summary: The caller's muted kinds, and every kind this plane can emit
      responses:
        "200": { description: Preferences., content: { application/json: { schema: { $ref: "#/components/schemas/InboxPreferences" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setInboxPreferences
      tags: [inbox]
      summary: Replace the caller's muted kinds wholesale
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetInboxPreferencesRequest" } } }
      responses:
        "200": { description: Updated preferences., content: { application/json: { schema: { $ref: "#/components/schemas/InboxPreferences" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─── Scheduled tasks (scheduled-tasks.md §7) ──────────────────────────────
  # ─── Deploy protection (deploy-protection.md §6) ──────────────────────────
  # Protection hangs off the ENVIRONMENT because that is the unit an operator
  # reasons about ("nobody deploys to production on a Friday"), and the two
  # decision routes hang off the DEPLOYMENT because that is what is parked.

  /api/v1/environments/{id}/protection:
    get:
      operationId: getEnvironmentProtection
      tags: [protection]
      summary: The environment's deploy-protection policy
      description: >-
        Returns the DEFAULT document (`require_approval: false`, `windows: []`)
        for an environment that has never been protected, rather than 404: "not
        protected" is an answer, and a 404 would make a screen invent one. Any
        team member may read it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The policy in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentProtection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such environment (or the caller is not a member of its team).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setEnvironmentProtection
      tags: [protection]
      summary: Replace the environment's protection policy (team admin, session only)
      description: >-
        Carries the WHOLE document — the flags plus the complete window list —
        and replaces it wholesale; an empty `windows` array means no freeze.
        There is no partial update, because flags and windows describing
        different intents is exactly the state an operator cannot reason about.
        Every field is required for the same reason: an omitted one read as a
        default would turn a forgotten field into a policy change, answered
        `200`. Preview environments cannot be protected.


        Session only, like break glass and the two decision routes, and for the
        same reason with more force: this request can switch the control off
        wholesale (`require_approval: false`, `freeze_enabled: false`,
        `windows: []`), which is strictly more powerful than the single
        30-minute grant that suspends one freeze. A leaked CI token must not be
        able to switch a protection control off — including by deleting it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProtectionRequest"
      responses:
        "200":
          description: The stored policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentProtection"
        "400":
          description: >-
            Invalid document — an unknown role, a day or minute out of range, a
            window that starts and ends at the same moment, a time zone that is
            not an IANA name, or more than 8 windows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Not a team admin, or the caller authenticated with an API token
            rather than an interactive session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such environment (or the caller is not a member of its team).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            This is a preview environment. Previews are ordinary environments
            with a TTL and stay unprotected — freezing them would strand every
            open pull request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: >-
            Deploy protection is not enabled on this panel, so there is no
            policy to write. Reads still answer: the default document says
            nothing is protected, which is true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/environments/{id}/approvals:
    get:
      operationId: listDeployApprovals
      tags: [protection]
      summary: The environment's gate decisions, newest first
      description: >-
        Bounded to the 100 most recent decisions. The pending queue is short by
        construction, but `state=all` asks for a history that grows for as long
        as the environment exists, and an unbounded answer is one that
        eventually stops arriving.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Filter by decision state. Defaults to `pending`; pass `all` for every state.
          schema:
            type: string
            enum: [pending, approved, rejected, all]
      responses:
        "200":
          description: The approvals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeployApproval"
        "400":
          description: Unknown state filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such environment (or the caller is not a member of its team).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/environments/{id}/break-glass:
    get:
      operationId: listBreakGlassGrants
      tags: [protection]
      summary: Break-glass grants on this environment, newest first
      description: >-
        Active and recent grants, each with who opened it, why, and when it
        lapses. Any team member may read them: a recorded override is only a
        control if the people it affects can see it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreakGlassGrant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such environment (or the caller is not a member of its team).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: openBreakGlass
      tags: [protection]
      summary: Suspend this environment's freeze for 30 minutes (team owner, session only)
      description: >-
        Opens a bounded, recorded override of the FREEZE gate — and only the
        freeze gate; the approval gate is unaffected. The grant lapses on its
        own after 30 minutes and is never revoked early. The reason is required
        and is stored verbatim beside the opener's name.


        Session only: an API token may not open one, for the same reason it may
        not manage credentials — a leaked CI token must not be able to switch a
        protection control off.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakGlassRequest"
      responses:
        "201":
          description: The grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassGrant"
        "400":
          description: Missing, over-long or multi-line reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a team owner, or the caller authenticated with an API token rather than a session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such environment (or the caller is not a member of its team).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: >-
            Deploy protection is not enabled on this panel, so no freeze exists
            to suspend. The grant listing still answers, with nothing in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/approval:
    get:
      operationId: getDeployApproval
      tags: [protection]
      summary: One deployment's gate decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployApproval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No such deployment, or it was never gated — an ungated deployment
            has no approval, which is the ordinary case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/approve:
    post:
      operationId: approveDeployment
      tags: [protection]
      summary: Approve a parked deploy and let it run (approver rank, session only)
      description: >-
        The caller must rank at or above the approval's `required_role` — the
        rank snapshotted when the deploy parked, so relaxing the policy since
        then does not relax this decision. The requester may not approve their
        own deploy while another qualifying approver exists; where they are the
        only one, they may, because a two-person rule needs two people.


        Session only: an API token inherits its owner's role, so a `deploy`
        token in CI could otherwise approve the deploy it had just requested and
        the gate would be decorative. Deploy routes are unchanged, so CI keeps
        working — its deploys park.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Approved; the deployment re-entered the ordinary queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Rank below `required_role`, an API token rather than a session, or
            the requester approving their own deploy while another qualifying
            approver exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such deployment, or it was never gated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already approved or rejected — decisions are once-only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/reject:
    post:
      operationId: rejectDeployment
      tags: [protection]
      summary: Reject a parked deploy (approver rank, session only)
      description: >-
        Ends the deployment as `failed` with a detail naming the rejecter and
        their reason. No container is ever touched, because the deploy never
        started. The reason is required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDeploymentRequest"
      responses:
        "200":
          description: Rejected; the deployment ended failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          description: Missing, over-long or multi-line reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Rank below `required_role`, or an API token rather than a session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such deployment, or it was never gated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already approved or rejected — decisions are once-only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/scheduled-tasks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Application ID. }
    get:
      operationId: listScheduledTasks
      tags: [scheduled-tasks]
      summary: List an application's scheduled tasks
      responses:
        "200": { description: Tasks., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduledTask" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createScheduledTask
      tags: [scheduled-tasks]
      summary: Create a scheduled task (cron; command is argv, not a shell string)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateScheduledTaskRequest" } } }
      responses:
        "201": { description: Task created., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/scheduled-tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Scheduled task ID (sch_… prefix). }
    get:
      operationId: getScheduledTask
      tags: [scheduled-tasks]
      summary: Get a scheduled task
      responses:
        "200": { description: The task., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateScheduledTask
      tags: [scheduled-tasks]
      summary: Update a scheduled task
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateScheduledTaskRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTask" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteScheduledTask
      tags: [scheduled-tasks]
      summary: Delete a scheduled task
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/scheduled-tasks/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Scheduled task ID. }
    get:
      operationId: listScheduledTaskRuns
      tags: [scheduled-tasks]
      summary: List a task's recent run history
      responses:
        "200": { description: "Runs, newest first.", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduledTaskRun" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }


components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Session token from /api/v1/auth/login.

  headers:
    RequestId:
      description: >-
        Correlation id for this request, minted by the API's outermost
        middleware and present on every response. It is repeated as `trace_id`
        in every JSON error body, and it is the key to search for in
        `GET /api/v1/panel/logs`. An inbound `X-Request-Id` is honoured only
        when the peer is a configured trusted proxy and the value is a short
        printable token; otherwise a fresh id is minted.
      schema: { type: string }
      example: trace_9f3a-11bd-4c02-7e51

  responses:
    BadRequest:
      description: Malformed or invalid request body.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired session token.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A backing dependency is unavailable.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but the caller's role is insufficient for this action.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        No such resource — also returned when the caller is not a member of the
        owning team, so resource existence never leaks across tenants.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        Throttled. The `Retry-After` header and the body's
        `retry_after_seconds` both give the whole seconds to wait.
      headers:
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema: { type: integer, minimum: 1 }
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message; never contains secrets.
        trace_id:
          type: string
          description: >-
            The value of this response's `X-Request-Id` header, repeated in the
            body so a screenshot of a failure carries it. Paste it into a bug
            report or `GET /api/v1/panel/logs` to find the request. Present on
            every response served through the API's middleware.
          example: trace_9f3a-11bd-4c02-7e51
        retry_after_seconds:
          type: integer
          minimum: 1
          description: >-
            Present only on `429`: whole seconds until the throttle lifts, the
            same value as the `Retry-After` header. Count down against it rather
            than guessing.
        totp_required:
          type: boolean
          description: >-
            Present only on the `401` from `POST /api/v1/auth/login` and
            `POST /api/v1/invites/{token}/accept`: the password was correct and
            the account has two-factor enabled, so the client should ask for the
            code rather than the password again.

    DeployKeyInUse:
      type: object
      description: >-
        The `Error` envelope plus the applications blocking a deploy-key
        delete. Additive: a client that reads only `error` is unaffected.
      required: [error, applications]
      properties:
        error: { type: string }
        trace_id: { type: string }
        applications:
          type: array
          description: The applications that still reference the key.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }

    PanelVersion:
      type: object
      required: [version, commit, built_at, go_version, latest]
      properties:
        version:
          type: string
          description: The release this binary was built from; `dev` for a local build.
          example: v0.4.0
        commit:
          type: string
          description: The commit it was built from; `dev` for a local build.
          example: 0c7a08b
        built_at:
          type: string
          format: date-time
          nullable: true
          description: When it was built, or null when the build carried no date.
        go_version:
          type: string
          description: The Go toolchain the binary was compiled with.
          example: go1.25.12
        latest:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PanelRelease" }]
          description: The newest release beyond the running one, or null.

    PanelRelease:
      type: object
      required: [version, kind, notes_url, published_at]
      properties:
        version:
          type: string
          example: v0.5.0
        kind:
          type: string
          enum: [patch, minor, major]
          description: >-
            The semver class of the delta from the running build — what a
            release badge shows, and how urgent the read is.
        notes_url:
          type: string
          description: Where the release notes live.
        published_at:
          type: string
          format: date-time
          nullable: true

    PanelLogs:
      type: object
      required: [lines, capacity]
      properties:
        lines:
          type: array
          description: >-
            Structured log records rendered as `key=value` text, oldest first.
          items: { type: string }
          example: ["time=2026-09-05T10:00:00.000Z level=INFO msg=\"http request\" method=GET path=/api/v1/servers status=200 duration_ms=3 trace_id=trace_9f3a-11bd-4c02-7e51"]
        capacity:
          type: integer
          description: How many lines the ring holds in total.
          example: 500

    SetupStatus:
      type: object
      required: [needs_setup]
      properties:
        needs_setup:
          type: boolean
          description: True when the panel has no account yet.

    SetupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        totp_code:
          type: string
          description: >
            Second factor, required only for 2FA-enabled accounts: a 6-digit
            authenticator code or a recovery code. If omitted for such an
            account, login returns 401 with "totp_required": true.

    TOTPStatus:
      type: object
      required: [enabled, recovery_codes_left]
      properties:
        enabled:
          type: boolean
        recovery_codes_left:
          type: integer
          description: Unused single-use recovery codes remaining.

    TOTPEnrollResponse:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry into an authenticator app.
        otpauth_uri:
          type: string
          description: otpauth:// URI the client renders as a QR code.

    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: An authenticator code or a recovery code.

    TOTPVerifyResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: >
            Single-use recovery codes, shown exactly once. Store them now —
            they are the only way in if the authenticator is lost.

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          description: usr_… prefixed ID.
        email:
          type: string
        role:
          type: string
        display_name:
          type: string
          description: What teammates see. Empty means the panel falls back to the address.
        timezone:
          type: string
          description: IANA name the UI reads timestamps in. Empty means UTC.

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 64
          description: Empty clears it, and the address is shown instead.
        timezone:
          type: string
          maxLength: 64
          description: An IANA name such as Europe/Berlin. Empty means UTC.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        revoke_other_sessions:
          type: boolean
          default: false
          description: Sign every other device out. The session making the request survives.

    AvatarResponse:
      type: object
      required: [etag]
      properties:
        etag:
          type: string
          description: Changes when the image does; use it to bust a cached <img>.

    RequestEmailChangeRequest:
      type: object
      required: [new_email, current_password]
      properties:
        new_email: { type: string }
        current_password: { type: string }

    ConfirmEmailChangeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The `id.secret` value from the confirmation link.

    ConfirmEmailChangeResponse:
      type: object
      required: [email, revoked]
      properties:
        email: { type: string }
        revoked:
          type: integer
          format: int64
          description: Other sessions signed out, because the recovery address moved.

    PanelTLSSettings:
      type: object
      required: [configured, acme_email, acme_ca_server]
      properties:
        configured:
          type: boolean
          description: >-
            Whether an ACME account exists — the same question as "will a server configure a
            certificate resolver?". False means every https route is served over plain HTTP
            until an account is set.
        acme_email:
          type: string
          description: >-
            The account email registered with the CA. Empty when unconfigured. Not a secret:
            the CA publishes it back in the account record, and the ACME account KEY — the
            part that is secret — is generated and kept by the proxy on the serving node,
            never by the control plane.
        acme_ca_server:
          type: string
          description: >-
            ACME directory URL. Empty means Let's Encrypt production; point it at the Let's
            Encrypt staging directory while testing so a misconfigured domain does not burn
            the production rate limit.
        updated_at: { type: string, format: date-time }

    SetPanelTLSRequest:
      type: object
      required: [acme_email]
      properties:
        acme_email:
          type: string
          description: >-
            A plain email address (`ops@example.com`), not a display-name form — the CA
            registers the address itself. Empty clears the account and turns certificate
            issuance off fleet-wide.
        acme_ca_server:
          type: string
          description: >-
            Optional absolute http(s) ACME directory URL. Empty means Let's Encrypt
            production.

    DNSSettings:
      type: object
      required: [configured, kind, config_hint, zone_count]
      properties:
        configured: { type: boolean }
        account_id:
          type: string
          description: The Cloudflare account the zone list is scoped to. Empty for a user-owned token.
        account_name:
          type: string
          description: Display only; the id is what is authoritative.
        kind: { type: string, enum: [cloudflare], description: The provider kind. Only Cloudflare at v1. }
        config_hint:
          type: string
          description: >-
            Names the zones the token can reach — the thing an operator actually wants
            confirmed. Never the token itself.
        zone_count: { type: integer }
        updated_at: { type: string, format: date-time }

    SetPanelDNSRequest:
      type: object
      required: [api_token]
      properties:
        api_token:
          type: string
          description: >-
            A Cloudflare API token with Zone:Read and DNS:Edit on the zones CypherPanel
            should manage. Write-only: it is sealed at rest and never returned.
            Cloudflare recommends an *account-owned* token for durable integrations, because
            it survives the person who created it leaving:
            https://developers.cloudflare.com/fundamentals/api/get-started/account-owned-tokens/
        account_id:
          type: string
          description: >-
            Optional. The Cloudflare account an account-owned token belongs to. Leave it
            empty and the panel resolves it — a token that sees exactly one account adopts
            it. A token that sees several returns 400 with the choices, and you send one back
            here. A classic user-owned token needs no account at all.

    ChooseAccountError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        accounts:
          type: array
          description: Present only when the token reaches several accounts; the choices to pick from.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }

    DNSZone:
      type: object
      required: [id, name, status, refreshed_at]
      properties:
        id: { type: string }
        name: { type: string, description: "The zone apex, e.g. example.com." }
        status:
          type: string
          description: >-
            The provider's activation state (initializing, pending, active). A non-active
            zone is still yours and still verifies a domain — it will not resolve until its
            nameservers point at the provider.
        refreshed_at: { type: string, format: date-time }
        managed_record_count:
          type: integer
          format: int64
          description: >-
            How many records the panel still wants to exist in this zone. What a
            disconnect would orphan, so it is a count of desired state rather
            than of what the provider currently holds.

    ApplicationDNS:
      type: object
      required: [enforced, verified, available_zones, domain, record_created]
      properties:
        enforced:
          type: boolean
          description: >-
            False when no DNS provider is connected. Everything downstream keys off this:
            an install that never connects one behaves exactly as it did before.
        verified: { type: boolean, description: Whether the domain falls inside a zone this panel can manage. }
        zone: { type: string, description: The zone the domain matched, when verified. }
        zone_status:
          type: string
          description: That zone's activation state, so a verified domain that will not resolve yet says why.
        available_zones:
          type: array
          items: { type: string }
          description: The connected zones, so a refusal can say what you do have.
        domain: { type: string }
        reason: { type: string, description: Why no record exists although the domain verified. }
        record_name: { type: string }
        record_content: { type: string }
        record_created: { type: boolean, description: Whether the record has been observed to exist at the provider. }
        last_error: { type: string, description: The provider's own words on the last failed attempt. }
        next_attempt_at: { type: string, format: date-time }

    PatchServerRequest:
      type: object
      required: [public_address]
      properties:
        disk_total_bytes:
          type: integer
          format: int64
          description: >-
            The Docker data root's filesystem, as of the last heartbeat. `0`
            means not reported — an older agent, or a host where it could not be
            read — which a client should show as unknown, never as full.
        disk_free_bytes:
          type: integer
          format: int64
        disk_low:
          type: boolean
          description: >-
            Whether the server is past the panel's disk threshold
            (`CYPHERD_DISK_WARN_PERCENT`, default 85). Crossing it, and crossing
            back, writes one notification-inbox item for the panel's owners and
            admins — on the transition, never on every heartbeat.
        public_address:
          type: string
          description: >-
            An IP address — what an A record points at. Empty string clears it, which stops
            new DNS records being written for this server's applications.

    PanelMailSettings:
      type: object
      required: [configured, config_hint]
      properties:
        configured: { type: boolean }
        config_hint:
          type: string
          description: Non-secret summary, e.g. "smtp.acme.com → ops@acme.com". Never the password.
        updated_at: { type: string, format: date-time }
        smtp_host:
          type: string
          description: >-
            Present only when configured. The saved settings are read back so the
            form can be edited rather than retyped; the password is the one field
            that never comes back.
        smtp_port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from: { type: string }
        tls:
          type: string
          enum: [starttls, implicit, none]
          description: >-
            Transport security in use. Settings saved before this field existed
            read back as starttls, which is how they are sent.

    PatchBackupTargetRequest:
      type: object
      description: Every field optional; omitted means "leave it alone".
      properties:
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        access_key: { type: string, description: Write-only. Resealed only when sent. }
        secret_key: { type: string, description: Write-only. Resealed only when sent. }
        path_prefix: { type: string }

    PatchDatabaseBackupRequest:
      type: object
      description: Every field optional; omitted means "leave it alone".
      properties:
        target_id: { type: string }
        schedule: { type: string, description: "Cron expression; empty means manual only." }
        retention_count: { type: integer, description: "Keep the last N backups; zero or less falls back to 7." }
        enabled: { type: boolean }

    DNSDisconnectPreview:
      type: object
      required: [verified_domain_count, domains]
      properties:
        verified_domain_count: { type: integer }
        domains:
          type: array
          items: { $ref: "#/components/schemas/DNSVerifiedDomain" }

    DNSVerifiedDomain:
      type: object
      required: [application_name, domain, zone_name]
      properties:
        application_id: { type: string }
        application_name: { type: string }
        domain: { type: string }
        zone_name: { type: string }

    PatchProjectRequest:
      type: object
      description: Every field optional; omitted means "leave it alone".
      properties:
        name: { type: string, maxLength: 100 }
        team_id:
          type: string
          description: Transfer. Needs owner of both teams and an interactive session.
        default_environment_id:
          type: string
          description: Must belong to this project. Empty string clears it.

    PatchEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }

    DatabaseRestore:
      type: object
      required: [id, database_id, status, bytes_done, bytes_total, started_at]
      properties:
        id: { type: string, description: rst_… prefixed ID. }
        database_id: { type: string }
        backup_record_id:
          type: string
          description: >
            The record restored from. Absent once that record has aged out of
            retention — the restore outlives what it restored.
        status:
          type: string
          enum: [running, succeeded, failed]
        step:
          type: string
          enum: [fetching, stopping, applying, restarting]
          description: >
            Where a running restore has got to. Absent once it is finished,
            because the status then says everything.
        bytes_done:
          type: integer
          format: int64
          description: >
            Bytes of the decompressed dump handled so far. Zero where the step
            has no meaningful byte count — an engine restart is not measured in
            bytes, and a bar that moved for it would be drawing something nobody
            counted.
        bytes_total: { type: integer, format: int64 }
        detail: { type: string, description: Failure reason. Never contains secrets. }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    ConnectionTest:
      type: object
      required: [ok, detail]
      properties:
        ok:
          type: boolean
          description: Whether the far end accepted the message.
        detail:
          type: string
          description: >-
            What the far end said, verbatim on failure. "connection refused" is
            the whole answer, and paraphrasing it makes an operator guess.

    ComposeStack:
      type: object
      required: [id, environment_id, name, server_id, route, status, created_at]
      properties:
        id:
          type: string
          example: cs_2m9K4pQ
        environment_id: { type: string }
        name: { type: string, maxLength: 100 }
        server_id:
          type: string
          description: The server this stack runs on.
        route:
          $ref: "#/components/schemas/ComposeRoute"
        desired_revision_id:
          type: [string, "null"]
          description: The revision the agent is converging toward; null before the first deploy.
        status:
          type: string
          enum: [running, degraded, stopped, error, deploying, unknown]
          description: >-
            Observed (ADR-005), in the same vocabulary an Application uses.
            `degraded` is some but not all of the services compose was asked
            for; `stopped` is the birth state.
        status_detail:
          type: string
          description: Compose's own last words on failure. Never contains a variable's value.
        observed_revision_id:
          type: string
          description: The revision the agent last reported actually running.
        created_at: { type: string, format: date-time }

    ComposeRoute:
      type: object
      required: [domain, service, port, https]
      properties:
        domain:
          type: string
          description: >-
            Empty means the stack publishes nothing through the Proxy. Its
            services still reach each other, and anything it publishes with
            compose `ports:` is published as the file asks.
        service:
          type: string
          description: >-
            Which compose service the domain reaches. Required with a domain —
            the file's own Traefik labels cannot work, because the managed Proxy
            runs the file provider only and no docker provider (ADR-004), so the
            panel emits the same route fragment an Application gets.
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: The port that service listens on inside its container.
        https:
          type: boolean
          default: true

    ComposeRevision:
      type: object
      required: [id, stack_id, compose_yaml, created_at]
      properties:
        id:
          type: string
          example: csr_2m9K4pQ
        stack_id: { type: string }
        compose_yaml:
          type: string
          description: The file, verbatim, as the operator wrote it.
        created_at: { type: string, format: date-time }

    CreateComposeStackRequest:
      type: object
      required: [name, server_id, compose_yaml]
      properties:
        name: { type: string, maxLength: 100 }
        server_id:
          type: string
          description: A server that runs workloads; a builder-role server is a 400.
        compose_yaml:
          type: string
          maxLength: 524288
          description: >-
            The compose file. Must parse as YAML and declare at least one
            service. `build:` and `container_name:` are refused; everything else
            runs as-is.
        route:
          $ref: "#/components/schemas/ComposeRoute"
        env_vars:
          type: object
          additionalProperties: { type: string }
          description: >-
            Sealed on the way in and never returned. Compose interpolates
            `${KEY}` from them, so a secret need not live in the file.

    UpdateComposeStackRequest:
      type: object
      description: Every field optional; an omitted field is left alone.
      properties:
        name: { type: string, maxLength: 100 }
        compose_yaml:
          type: string
          description: A changed file becomes a new revision, but is not deployed.
        route:
          $ref: "#/components/schemas/ComposeRoute"

    Registry:
      type: object
      required: [id, team_id, name, url, can_pull, can_push, token_set, last_test_ok, created_at]
      properties:
        id:
          type: string
          example: reg_2m9K4pQ
        team_id:
          type: string
        name:
          type: string
        url:
          type: string
          description: >-
            The registry host, optionally with a namespace — `ghcr.io`,
            `ghcr.io/acme`, `registry:5000`. No scheme: a registry reference
            carries none, and accepting one would produce image names nothing
            can pull.
          example: ghcr.io/acme
        username:
          type: string
        can_pull:
          type: boolean
          description: >-
            Whether this credential may be attached to an application as its
            image source.
        can_push:
          type: boolean
          description: >-
            Whether builds may push their result here. A pull-only credential
            attached to a pushing build is refused at validation rather than
            discovered as a 403 from the registry mid-deploy.
        token_set:
          type: boolean
          description: >-
            That a credential exists — never what it is (ENGINEERING rule 20).
        last_test_at:
          type: string
          format: date-time
        last_test_ok:
          type: boolean
        last_test_detail:
          type: string
        created_at:
          type: string
          format: date-time

    RegistryUse:
      type: object
      required: [application_id, application_name, environment_name, project_name, pulls, pushes]
      properties:
        application_id:
          type: string
        application_name:
          type: string
        environment_name:
          type: string
        project_name:
          type: string
        pulls:
          type: boolean
          description: The application's image source is this registry.
        pushes:
          type: boolean
          description: The application's builds push here.

    CreateRegistryRequest:
      type: object
      required: [name, url, token]
      properties:
        team_id:
          type: string
          description: >-
            Optional when you belong to exactly one team; required otherwise.
        name:
          type: string
          maxLength: 100
        url:
          type: string
          description: Registry host, without a scheme.
          example: ghcr.io
        username:
          type: string
          description: >-
            Omit for a registry that takes a bearer token rather than a
            username and password.
        token:
          type: string
          description: >-
            The password or access token. Sealed under the master key on the
            way in and never returned.
        can_pull:
          type: boolean
          default: true
        can_push:
          type: boolean
          default: false

    UpdateRegistryRequest:
      type: object
      description: Every field optional; an omitted field is left alone.
      properties:
        name:
          type: string
          maxLength: 100
        url:
          type: string
        username:
          type: string
        token:
          type: string
          description: Send only to rotate; omitting it keeps the stored credential.
        can_pull:
          type: boolean
        can_push:
          type: boolean

    TestRegistryRequest:
      type: object
      required: [url, token]
      properties:
        url:
          type: string
          description: Registry host, without a scheme.
        username:
          type: string
        token:
          type: string

    TestNotifierConfigRequest:
      type: object
      required: [channel, config]
      properties:
        channel:
          type: string
          enum: [email, discord, slack, telegram]
        config:
          type: object
          additionalProperties: true
          description: >-
            The same channel-specific shape create takes. Never stored by this
            route.

    PendingEmailChange:
      type: object
      required: [new_email, requested_at, expires_at]
      properties:
        new_email:
          type: string
          description: The address the account is moving to, as the panel parsed it.
        requested_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: When the confirmation link stops working.

    EmailChangeCancelled:
      type: object
      required: [cancelled]
      properties:
        cancelled:
          type: integer
          format: int64
          description: >-
            How many pending changes were spent. 0 means there was nothing to
            undo, which is a different answer from having undone something.

    SetPanelMailRequest:
      type: object
      required: [smtp_host, smtp_port, from]
      properties:
        smtp_host: { type: string }
        smtp_port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        password:
          type: string
          description: Write-only. Never returned by any route.
        from: { type: string }
        tls:
          type: string
          enum: [starttls, implicit, none]
          default: starttls
          description: >-
            Transport security. starttls (port 587) upgrades the connection and
            refuses to send if the server will not offer STARTTLS — no silent
            downgrade. implicit (port 465) is TLS from the first byte. none sends
            in the clear and is only defensible for a relay you control.

    ChangePasswordResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          format: int64
          description: Other sessions signed out; 0 unless asked.

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer session token; shown once, store client-side.
        user:
          $ref: "#/components/schemas/User"

    Session:
      type: object
      required: [id, current, created_at, expires_at]
      properties:
        id:
          type: string
          description: sess_… prefixed ID.
        current:
          type: boolean
          description: True for the session making this request.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    Ability:
      type: string
      enum: [read, write, deploy, env, servers, admin]
      description: >
        What a personal access token may do. A token's authority is the
        intersection of its owner's role and its abilities: an ability never
        grants access to something the owner could not already reach.


        `read` permits safe methods. `deploy` permits triggering deploys and
        rollbacks. `write` permits every other mutation.


        `env`, `servers` and `admin` carve narrower grants out of `write`, so a
        credential can be minted for one job rather than for every mutation the
        API has: `env` sets and removes an application's environment variables,
        `servers` enrols and removes servers and reads join instructions, and
        `admin` changes teams, members, invitations, users and panel settings.


        **`write` still satisfies all three.** A token issued before they
        existed does exactly what it did before; the narrow abilities are for
        narrowing a new token, not for re-cutting an old one.

    ApiToken:
      type: object
      required: [id, name, abilities, created_at]
      properties:
        id:
          type: string
          description: tok_… prefixed ID.
        name:
          type: string
          description: Human-readable label.
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/Ability"
        project_id:
          type: string
          description: >
            Present when the token is confined to one project. Absent means
            unscoped, which is what every token was before scoping existed.
        last_used_at:
          type: string
          format: date-time
          description: When the token last authenticated a request; absent if never used.
        expires_at:
          type: string
          format: date-time
          description: When the token expires; absent if it never expires.
        created_at:
          type: string
          format: date-time

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable label (1–100 characters).
        expires_in_days:
          type: integer
          description: Lifetime in days; 0 or omitted means the token never expires.
          minimum: 0
          maximum: 3650
        project_id:
          type: string
          description: >
            Confine the token to one project. Abilities say what a credential
            may do; this says where. A scoped token answers 404 for any other
            project — the same answer a non-member gets, so one token cannot be
            used to enumerate which projects its owner can see — and 403 for
            panel- and team-level routes, which belong to no project. The caller
            must be a member of the project named here.
        abilities:
          type: array
          description: >
            What this token may do. Omitted means full access (read, write,
            deploy); an explicit empty list is rejected.
          items:
            $ref: "#/components/schemas/Ability"

    CreateTokenResponse:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >
                The raw bearer token (cyp_… prefixed). Shown exactly once —
                store it now; it cannot be retrieved again.

    Server:
      type: object
      required:
        [id, name, status, driver, agent_version, hostname, enrolled, created_at]
      properties:
        id:
          type: string
          description: srv_… prefixed ID; also the CN of the agent's certificate.
        name:
          type: string
        status:
          type: string
          description: Single status vocabulary (ui-principles §5).
          enum: [running, deploying, stopped, error, degraded, unknown]
        driver:
          type: string
          description: Orchestrator driver the agent reports (e.g. docker).
        role:
          type: string
          description: >-
            Agent-asserted role (builder-role-and-relay.md §1). "all" builds
            and runs; "builder" only builds; "worker" only runs. Read-only —
            set via the agent's --role flag, recorded from heartbeats.
          enum: [all, builder, worker]
        agent_version:
          type: string
        hostname:
          type: string
        public_address:
          type: string
          description: >-
            Where DNS records for this server's applications point
            (dns-automation.md §3.4). Empty until an operator sets it; the plane
            cannot learn it, because the agent dials out and the heartbeat
            carries no address.
        enrolled:
          type: boolean
          description: Whether an agent has completed enrollment.
        enrolled_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: Time of the most recent heartbeat; null if never seen.
        created_at:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    JoinInstructions:
      type: object
      required:
        [token, enroll_addr, nats_url, ca_cert_pem, ca_fingerprint, command, install_command]
      properties:
        token:
          type: string
          description: Single-use join token; never shown again.
        enroll_addr:
          type: string
          description: host:port of the gRPC enrollment endpoint.
        nats_url:
          type: string
          description: tls:// URL of the data-plane bus.
        ca_cert_pem:
          type: string
          description: PEM CA certificate to pin during enrollment.
        ca_fingerprint:
          type: string
          description: >-
            SHA-256 hex of ca_cert_pem. Travels in the install command so the
            installer can verify the CA it fetches from the plane.
        command:
          type: string
          description: Manual cypher-agent enroll command (binary preinstalled).
        install_command:
          type: string
          description: >-
            Ready-to-paste curl|sh join line (the acceptance path). It is self-sufficient: on
            a release build it pins `CYPHER_AGENT_URL` to this panel's own version, so the
            server joins running the agent that matches the plane. A development build omits
            it and the installer falls back to the project's latest GitHub release. Either
            way the plane never stores or serves the binary itself (ADR-010).

    CreateServerResponse:
      type: object
      required: [server, join]
      properties:
        server:
          $ref: "#/components/schemas/Server"
        join:
          $ref: "#/components/schemas/JoinInstructions"

    Project:
      type: object
      required: [id, name, team_id, created_at]
      properties:
        id:
          type: string
          description: prj_… prefixed ID.
        name:
          type: string
        team_id:
          type: string
          description: tm_… prefixed ID of the owning team.
        created_at:
          type: string
          format: date-time
        slug:
          type: string
          description: >-
            Stable handle for URLs and the CLI. Derived from the name at
            creation and immutable after: renaming must not break a bookmark or
            a script. Unique within the team.
        default_environment_id:
          type: string
          description: Where "open this project" lands. Absent only if the project has no environments.
        last_activity_at:
          type: string
          format: date-time
          description: Last deploy, resource change or setting change here. The list orders by it.
        application_count: { type: integer, format: int64, description: "List view only." }
        database_count: { type: integer, format: int64, description: "List view only." }
        error_count: { type: integer, format: int64, description: "List view only." }
        worst_status:
          type: string
          description: >-
            List view only. The most severe observed status among the project's
            applications and managed databases, so a page can be ordered
            worst-first. Empty when the project holds nothing.

    Environment:
      type: object
      required: [id, project_id, name, created_at]
      properties:
        id:
          type: string
          description: env_… prefixed ID.
        project_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [production, standard, preview]
          description: >-
            A preview is created and destroyed by its pull request and cannot be
            renamed or deleted by hand.
        is_default: { type: boolean }

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        team_id:
          type: string
          description: >-
            Owning team. Optional when the caller belongs to exactly one team
            (defaulted); required (400) when the caller belongs to several.

    CreateProjectResponse:
      type: object
      required: [project, default_environment]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        default_environment:
          $ref: "#/components/schemas/Environment"

    ProjectDetail:
      type: object
      required: [project, environments]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"

    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    AppSource:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [github, git_url, image]
        repo:
          type: string
          description: Git remote; required for `github` and `git_url`, empty for `image`.
        branch:
          type: string
          description: Branch to build; defaults to `main` for git kinds, empty for `image`.
        deploy_key_id:
          type: [string, "null"]
        image:
          type: string
          maxLength: 512
          description: >-
            OCI image reference (registry/repository[:tag][@digest]); required
            for kind `image`, empty otherwise. The target agent pulls it — no
            build stage runs, and deploys go straight to rollout. A digest is
            immutable and fetched once; a tag is re-fetched on every deploy, so
            redeploying a moved tag runs the new image rather than a cached one.
        registry_id:
          type: [string, "null"]
          description: >-
            The stored registry credential the pull authenticates with
            (`reg_...`). It answers "where do this application's bits come
            from": the image itself for kind `image`, and the private base
            image a Dockerfile `FROM` names for a git kind. Must belong to the
            application's own team and allow pulling; null is the ordinary
            public case. Nothing in the deploy path requires one (ADR-008).

    DomainCheck:
      type: object
      required: [domain, verdict, summary, resolved_ips]
      properties:
        domain: { type: string }
        verdict:
          type: string
          enum: [ok, no_domain, no_dns, unreachable, served_by_other]
        summary:
          type: string
          description: One plain-language sentence describing what was found.
        remedy:
          type: string
          description: What to do about it; absent when the verdict is ok.
        resolved_ips:
          type: array
          items: { type: string }
        http_status: { type: integer }
        served_by:
          type: string
          description: The Server header of whatever answered, when it was not CypherPanel.

    AppBuild:
      type: object
      required: [kind, dockerfile_path, context]
      properties:
        kind:
          type: string
          enum: [auto, dockerfile, static, nixpacks, railpack]
          default: auto
          description: >-
            How the checkout becomes an image. `dockerfile` builds the file at
            `dockerfile_path`. `static` serves the build context as a website
            behind nginx, listening on `runtime.port`. `nixpacks` hands the
            repository to a build pack, which decides the language, package
            manager, build command and runtime, and writes a Dockerfile the
            ordinary path then builds.


            `auto` decides by looking at the repository: a Dockerfile if there
            is one, then a language manifest (`package.json`, `go.mod`, …) if
            the Nixpacks binary is installed on the builder, then an index.html
            to serve as a static site, and a clear failure naming what would fix
            it if none apply. Detection runs on the builder agent, where the
            source actually is — the control plane never fetches a repository.


            A pack is an opt-in an operator installs on a builder. Where none
            is present, `auto` behaves exactly as it did before packs existed.
            `auto` never infers `railpack`: choosing between two packs that
            claim the same repositories would be arbitrary, and Nixpacks is the
            one that needs no BuildKit and pulls no frontend image.
        dockerfile_path:
          type: string
          description: Ignored for a `static` build.
        context:
          type: string
        push_registry_id:
          type: [string, "null"]
          description: >-
            Push the completed image to this stored registry (`reg_...`) in
            addition to keeping it locally — ADR-008 path 3. Must belong to the
            application's own team and allow pushing, and cannot be set on an
            image source, which is never built. The rollout never reads this
            copy: it runs the local build or the relayed one, so no registry is
            required even for an application that configures one. A failed push
            fails the deployment.
        push_repository:
          type: string
          maxLength: 255
          description: >-
            Repository within the push registry, e.g. `acme/web`. Lowercase
            path components only. Empty uses the application's own name reduced
            to a legal repository path. Requires `push_registry_id`.

    AppVolume:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: Operator label (lowercase alphanumeric + dashes); the Docker volume name is derived from it.
        path:
          type: string
          description: Absolute mount path inside the container.

    AppRuntime:
      type: object
      required: [server_id, port, replicas]
      properties:
        server_id:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        replicas:
          type: integer
          description: Fixed at 1 for v1 (multiple replicas are post-v1).
        cpu_limit:
          type: [number, "null"]
          description: Fractional cores; null/omitted/0 = no limit (noisy-neighbor control).
        memory_limit_mb:
          type: [integer, "null"]
          description: MiB; null/omitted/0 = no limit.

    AppPort:
      type: object
      required: [host_port, container_port, protocol]
      properties:
        host_port:
          type: integer
          minimum: 1
          maximum: 65535
        container_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
          description: Empty on input defaults to tcp.

    AppRoute:
      type: object
      required: [https, path_prefix]
      properties:
        domain:
          type: string
          description: >
            Public HTTP hostname. OPTIONAL — an empty domain makes the app a raw
            (non-HTTP) service with no proxy route; expose it via `ports` instead.
        https:
          type: boolean
        path_prefix:
          type: string

    AppHealth:
      type: object
      required: [path, interval_seconds, timeout_seconds, retries]
      properties:
        kind:
          type: string
          enum: [http, tcp, none]
          description: >
            Rollout gate. "http" (default) probes path; "tcp" dials the container
            port; "none" is liveness-only for raw UDP services. Probe is internal.
        path:
          type: string
        interval_seconds:
          type: integer
        timeout_seconds:
          type: integer
        retries:
          type: integer

    Application:
      type: object
      required:
        [id, environment_id, name, source, build, runtime, route, health, webhook_id, created_at]
      properties:
        id:
          type: string
          description: app_… prefixed ID.
        environment_id:
          type: string
        name:
          type: string
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
          description: Persistent volume mounts (survive redeploys).
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Raw host-port publishes (tcp/udp), independent of the HTTP route.
        webhook_id:
          type: string
          description: Public webhook identifier used in the webhook URL.
        desired_revision_id:
          type: [string, "null"]
          description: Set on first deploy; rollback re-points it.
        status:
          type: string
          enum: [running, deploying, stopped, error, degraded, unknown]
          description: Observed state — what the agent last reported (ADR-005).
        status_detail:
          type: string
        observed_revision_id:
          type: string
          description: The revision actually serving per the last report.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.
        tls_state:
          type: string
          enum: [https, http_only_no_resolver, http_only]
          description: >-
            Derived, never stored (agent-identity-and-tls.md §5): what this application's
            route is actually served as, given what the panel knows. Omitted entirely when
            the application has no domain, because then there is no route to describe.


            `https` — the route asks for HTTPS and the panel has an ACME account, so the
            serving node configures a resolver and obtains a certificate.
            `http_only_no_resolver` — the route asks for HTTPS but the panel has no ACME
            account, so there is nothing to issue with: the node serves the app over plain
            HTTP and the deploy is unaffected. Say "serving over HTTP meanwhile", never
            "HTTPS".
            `http_only` — HTTPS was not requested; plain HTTP is what was asked for and
            nothing is missing.


            This reports the panel's configuration, not an observed certificate. It cannot
            see a per-node `CYPHER_ACME_EMAIL` override, and it does not claim a certificate
            was actually ISSUED — issuance also needs DNS pointing at the server
            (`GET /applications/{id}/domain-check`). Reporting per-domain certificate state
            from the node is a later refinement (routing-and-tls.md §10).
        redeploy_pending:
          type: boolean
          description: >-
            Derived, never stored (shared-variables.md §5): a shared variable
            this application references changed after the environment it is
            running was frozen onto the wire. It is NOT a status word — the
            status vocabulary is closed — so render it as a badge beside the
            status, never in place of one.
        created_at:
          type: string
          format: date-time

    CreateApplicationRequest:
      type: object
      required: [name, source, runtime, route]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Raw host-port publishes (tcp/udp); route.domain may be empty for a raw service.
        env_vars:
          type: object
          additionalProperties:
            type: string
          description: Plaintext values; sealed before storage, never returned.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.

    WebhookInfo:
      type: object
      required: [url, secret]
      properties:
        url:
          type: string
        secret:
          type: string
          description: HMAC secret shown once; store it in your git provider now.

    CreateApplicationResponse:
      type: object
      required: [application, webhook]
      properties:
        application:
          $ref: "#/components/schemas/Application"
        webhook:
          $ref: "#/components/schemas/WebhookInfo"

    EnvVarKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string
        shared_refs:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            Per env-var key, the shared variables its value references as
            {{shared.KEY}} (shared-variables.md §7). Key names only — values
            stay write-only, so the Env vars tab can show the wiring without a
            reveal.

    SetEnvVarRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    PatchApplicationRequest:
      type: object
      description: Absent sections stay unchanged; a present section replaces that section wholesale. The runtime server and replicas are not patchable.
      properties:
        name:
          type: string
        source:
          $ref: "#/components/schemas/AppSource"
        build:
          $ref: "#/components/schemas/AppBuild"
        runtime:
          type: object
          properties:
            port:
              type: integer
            cpu_limit:
              type: [number, "null"]
              description: Fractional cores; a non-positive value clears the limit.
            memory_limit_mb:
              type: [integer, "null"]
              description: MiB; a non-positive value clears the limit.
        route:
          $ref: "#/components/schemas/AppRoute"
        health:
          $ref: "#/components/schemas/AppHealth"
        volumes:
          type: array
          items: { $ref: "#/components/schemas/AppVolume" }
          description: Present = replace the volume set wholesale.
        ports:
          type: array
          items: { $ref: "#/components/schemas/AppPort" }
          description: Present = replace the port set wholesale.
        preview_enabled:
          type: boolean
          description: >-
            Whether pull requests against this app's repository create preview
            environments (preview-environments.md). Off by default.
        preview_base_domain:
          type: string
          description: >-
            Base domain previews are published under — a PR gets
            `pr-<number>.<base>`. Required when preview_enabled is true.
        preview_ttl_hours:
          type: integer
          description: >-
            Backstop lifetime for a preview whose PR never closes; defaults to
            72 when unset.

    DeployRequest:
      type: object
      properties:
        ref:
          type: string
          description: Exact commit SHA to build; empty builds the configured branch's head.

    Deployment:
      type: object
      required: [id, application_id, revision_id, status, trigger, created_at]
      properties:
        id:
          type: string
        application_id:
          type: string
        revision_id:
          type: string
        status:
          type: string
          description: >-
            Pipeline state. `awaiting_approval` is a deploy that deploy
            protection parked before it started: nothing was published, the
            application's own status is untouched, and it holds no queue slot.
            It is NOT terminal — it is waiting for a person. A rejected deploy
            ends `failed`, with a detail naming the rejecter.
          enum: [queued, building, distributing, rolling_out, succeeded, failed, awaiting_approval]
        trigger:
          type: string
          enum: [manual, webhook, rollback]
        detail:
          type: string
        approval:
          description: >-
            The gate decision on this deployment, present only when it was
            gated. Carries enough to render the pending card without a second
            request; a deployment that was never gated omits it entirely.
          oneOf:
            - $ref: "#/components/schemas/DeployApproval"
            - type: "null"
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    DeployKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        public_key:
          type: string
        fingerprint:
          type: string
        created_at:
          type: string
          format: date-time

    CreateDeployKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    CreateDeployKeyResponse:
      type: object
      required: [deploy_key]
      properties:
        deploy_key:
          $ref: "#/components/schemas/DeployKey"

    DeployKeysList:
      type: array
      items:
        $ref: "#/components/schemas/DeployKey"
    # ─── Teams & users ────────────────────────────────────────────────────────
    Me:
      type: object
      required: [id, email, role, teams]
      properties:
        id: { type: string }
        email: { type: string }
        role:
          type: string
          description: Panel role.
          enum: [member, admin, owner]
        display_name:
          type: string
          description: What teammates see. Empty means the panel falls back to the address.
        timezone:
          type: string
          description: IANA name the UI reads timestamps in. Empty means UTC.
        teams:
          type: array
          items: { $ref: "#/components/schemas/Team" }
    Team:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, description: tm_… prefixed ID. }
        name: { type: string }
        role:
          type: string
          description: The requesting user's role in this team (present on listings and /auth/me).
          enum: [member, admin, owner]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamMember:
      type: object
      required: [user_id, email, role, created_at]
      properties:
        user_id: { type: string }
        email: { type: string }
        role: { type: string, enum: [member, admin, owner] }
        created_at: { type: string, format: date-time }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    RenameTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    AddMemberRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [member, admin, owner], default: member }
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [member, admin, owner] }
    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        role: { type: string, enum: [member, admin, owner], default: member }
    SetUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [member, admin, owner] }

    # ─── Invitations and access requests
    #     (invitations-and-access-requests.md §7) ──────────────────────────────
    TeamInvite:
      type: object
      description: >-
        One invitation to join a team. It never carries the token or its hash:
        the accept URL is readable exactly once, in the response that created it.
      required: [id, team_id, email, role, state, invited_by_label, expires_at, created_at]
      properties:
        id: { type: string, description: inv_… prefixed ID. }
        team_id: { type: string }
        email: { type: string, format: email, description: The address as the panel parsed and lower-cased it. }
        role: { type: string, enum: [member, admin, owner], description: The rank accepting will grant. }
        state:
          type: string
          enum: [pending, accepted, revoked, expired]
          description: >-
            Derived from the timestamps below, never stored — a stored
            "expired" would need a sweeper to stay true.
        invited_by_label:
          type: string
          description: >-
            Who sent it, as their address read at the time. A snapshot: it still
            names them after their account is deleted.
        expires_at: { type: string, format: date-time, description: Seven days after it was issued. }
        accepted_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    CreateInviteRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [member, admin, owner]
          default: member
          description: >-
            May not exceed the caller's own rank; inviting an owner needs team
            owner. Checked here rather than at acceptance, because the person
            accepting has no rank of their own.
    CreatedInvite:
      type: object
      description: A fresh invitation plus the two facts that exist only at this moment.
      required: [invite, accept_url, mail_sent]
      properties:
        invite: { $ref: "#/components/schemas/TeamInvite" }
        accept_url:
          type: string
          description: >-
            The full link to hand to the invitee. This is the ONLY time it is
            readable — only a hash of its secret is stored — and it is returned
            whether or not the panel could mail it, so an operator on a panel
            with no SMTP can still pass it on themselves.
        mail_sent:
          type: boolean
          description: >-
            Whether Panel Mail actually delivered the invitation. False means
            the panel has no mail configured (Settings → Mail) or the send
            failed; the invitation is valid either way.
    InvitePreview:
      type: object
      description: >-
        What the unauthenticated landing screen may see about an invitation.
        Deliberately not the invitation itself: no id, no timestamps beyond the
        expiry, nothing about the team but its name.
      required: [team_name, inviter_label, email, role, expires_at, account_exists]
      properties:
        team_name: { type: string }
        inviter_label: { type: string, description: Who invited you, as an address. Empty if the panel no longer knows. }
        email: { type: string, format: email, description: The address this invitation was issued for; it cannot be changed. }
        role: { type: string, enum: [member, admin, owner] }
        expires_at: { type: string, format: date-time }
        account_exists:
          type: boolean
          description: >-
            True when this address already has an account, so the form asks for
            the existing password instead of offering to choose one. A
            disclosure only to whoever already holds a valid invitation for that
            exact address.
    AcceptInviteRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          description: >-
            For an address with no account, the password being chosen (at least
            8 characters). For one that already has an account, that account's
            CURRENT password — accepting an invitation never resets it.
        display_name:
          type: string
          maxLength: 64
          description: >-
            Optional, and only used when the account is being created. If the
            panel cannot accept it — too long, or more than a single line — the
            account is still created and joined without it, and the person can
            set one from their profile: a name is not worth failing a join over,
            and the invitation has already been spent by then.
        totp_code:
          type: string
          description: >-
            Second factor, required only when the address already has an account
            with two-factor enabled — an invitation is not a way around one.
    AccessRequest:
      type: object
      description: One member's ask for a higher rank in one team.
      required: [id, team_id, user_id, user_email, current_role, requested_role, message, state, created_at]
      properties:
        id: { type: string, description: acr_… prefixed ID. }
        team_id: { type: string }
        user_id: { type: string }
        user_email: { type: string, format: email, description: Who asked. }
        current_role:
          type: string
          description: >-
            Their rank in this team as it stands NOW, derived at read time —
            empty if they have since left, which is why granting then answers
            409.
        requested_role: { type: string, enum: [member, admin, owner] }
        message: { type: string, description: The requester's own words, at most 500 characters. }
        state: { type: string, enum: [pending, granted, denied] }
        decided_by_label: { type: string, description: Who decided, as an address read at the time. A snapshot. }
        decision_reason: { type: string, description: A denial's reason, carried verbatim to the requester. Empty otherwise. }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    CreateAccessRequestRequest:
      type: object
      required: [requested_role]
      properties:
        requested_role:
          type: string
          enum: [member, admin, owner]
          description: Must rank strictly above the caller's current role in this team.
        message: { type: string, maxLength: 500, description: Why you need it — shown to the owners who decide. }
    DenyAccessRequestRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Optional; carried verbatim to the requester. }

    # ─── Databases ────────────────────────────────────────────────────────────
    Database:
      type: object
      required: [id, environment_id, name, engine, version, server_id, volume_name, network, root_user, require_password, status, desired_state, created_at, updated_at]
      properties:
        id: { type: string, description: db_… prefixed ID. }
        environment_id: { type: string }
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string }
        server_id: { type: string }
        cpu_limit: { type: [number, "null"], description: Fractional cores; null/0 = no limit. }
        memory_limit_mb: { type: [integer, "null"] }
        volume_name: { type: string, description: "Deterministic: cypher-db-<id>." }
        expose_port: { type: [integer, "null"], description: Host port; null = private only. }
        network: { type: string }
        root_user: { type: string }
        root_password: { type: string, description: Present only on create / reset; shown once. }
        require_password: { type: boolean }
        initial_database:
          type: string
          description: >-
            The application database the engine created on first boot. Empty
            means the engine's own default — the `postgres` maintenance
            database for PostgreSQL, and nothing at all for MySQL, MariaDB and
            MongoDB.
        status: { type: string, enum: [running, provisioning, stopped, error, unknown] }
        status_detail: { type: string }
        desired_state:
          type: string
          enum: [running, stopped]
          description: >-
            What the operator asked for, as distinct from `status` (what the
            agent last observed). Start/stop are guarded on this, so a client
            must gate those actions on `desired_state` rather than `status` —
            otherwise it offers Start whenever reality is still catching up
            with intent, and the call is rejected.
        desired_revision_id: { type: [string, "null"] }
        observed_revision_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDatabaseRequest:
      type: object
      required: [name, engine, server_id]
      properties:
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string, description: Defaulted from the engine matrix when omitted. }
        server_id: { type: string }
        cpu_limit: { type: number, description: Fractional cores; 0 = no limit. }
        memory_limit_mb: { type: integer }
        expose_port: { type: integer, description: 0 or omitted = private only. }
        require_password: { type: boolean }
        initial_database:
          type: string
          description: >-
            An application database for the engine to create on first boot; a
            plain SQL identifier, at most 63 characters. Creation-only: the
            engine images read it while initializing an empty data directory
            and ignore it on every later start, so PATCH has no counterpart.
            Rejected for Redis and Valkey, whose databases are numbered.
    CreateDatabaseResponse:
      type: object
      required: [database, root_password]
      properties:
        database: { $ref: "#/components/schemas/Database" }
        root_password: { type: string, description: Shown exactly once. }
    PatchDatabaseRequest:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        cpu_limit: { type: number }
        memory_limit_mb: { type: integer }
        expose_port: { type: integer }
    ResetPasswordResponse:
      type: object
      required: [root_password]
      properties:
        root_password: { type: string, description: Shown exactly once. }
    ConnectionInfo:
      type: object
      required: [host, port, password_hint, internal_host]
      properties:
        host:
          type: string
          description: >-
            The address to dial from outside the environment's private network,
            when the database exposes a port: the server's public address, or
            the hostname its agent reported if no public address is set. Empty
            (`""`) when the database exposes no port, or when the panel knows
            no address for its server — an honest "we do not know where this
            is" rather than a plausible value that is not an address. Use
            `internal_host` for in-network access, which always works.
          example: db1.example.com
        port: { type: integer }
        user: { type: string }
        password_hint: { type: string, description: Never the password itself. }
        internal_host: { type: string, description: Address on the environment's private network. }

    # ─── Templates ────────────────────────────────────────────────────────────
    Template:
      type: object
      required: [schema, slug, name, description, category, version, resources]
      properties:
        schema: { type: string, enum: [v1] }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [ai, analytics, automation, cms, communication, dev-tools, finance, media, monitoring, productivity, security, storage, other] }
        version: { type: string }
        resources:
          $ref: "#/components/schemas/TemplateResources"
    TemplateResources:
      type: object
      required: [databases, applications]
      properties:
        databases:
          type: array
          items: { $ref: "#/components/schemas/TemplateDatabase" }
        applications:
          type: array
          items: { $ref: "#/components/schemas/TemplateApplication" }
    TemplateDatabase:
      type: object
      required: [name, engine, version]
      properties:
        name: { type: string }
        engine: { type: string, enum: [postgresql, mysql, mariadb, mongodb, redis, valkey] }
        version: { type: string }
    TemplateApplication:
      type: object
      required: [name, image, port, route, health, volumes, ports, env]
      properties:
        name: { type: string }
        image: { type: string }
        port: { type: integer }
        route: { type: boolean }
        health:
          type: object
          required: [kind, path]
          properties:
            kind: { type: string, enum: [http, tcp, none, ""] }
            path: { type: string }
        volumes:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
        ports:
          type: array
          items:
            type: object
            required: [host, container, protocol]
            properties:
              host: { type: integer }
              container: { type: integer }
              protocol: { type: string, enum: [tcp, udp, ""] }
        env:
          type: object
          additionalProperties: { type: string }
    InstallTemplateRequest:
      type: object
      required: [environment_id, server_id]
      properties:
        environment_id: { type: string }
        server_id: { type: string }
        domain: { type: string }
        name: { type: string }
    InstallTemplateResponse:
      type: object
      required: [applications, databases]
      properties:
        applications:
          type: array
          items: { type: string }
        databases:
          type: array
          items: { type: string }
        first_login:
          allOf: [{ $ref: "#/components/schemas/FirstLogin" }]
          description: >-
            How to get into what was just installed. Returned ONCE — when `generated` is
            true this is the only place that password ever appears. Absent when the template
            declares nothing.

    FirstLogin:
      type: object
      required: [kind, generated]
      properties:
        kind:
          type: string
          enum: [credentials, setup, none]
          description: >-
            `credentials` — sign in with what is here. `setup` — the app creates the account
            itself on first visit. `none` — there is no sign-in.
        application_id:
          type: string
          description: The installed application these apply to.
        username: { type: string }
        password: { type: string }
        generated:
          type: boolean
          description: >-
            True when the panel invented this password rather than it being a documented
            upstream default. A generated one is shown once and cannot be recovered; a
            default is public knowledge about the image.
        note:
          type: string
          description: The one thing to do first, or to change immediately.

    # ─── Backups ──────────────────────────────────────────────────────────────
    BackupTarget:
      type: object
      required: [id, name, endpoint, bucket, region, path_prefix, created_at, updated_at]
      properties:
        id: { type: string, description: bt_… prefixed ID. }
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        path_prefix: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateBackupTargetRequest:
      type: object
      required: [name, endpoint, bucket, access_key, secret_key]
      properties:
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        access_key: { type: string, description: Sealed at rest; never returned. }
        secret_key: { type: string, description: Sealed at rest; never returned. }
        path_prefix: { type: string }
    DatabaseBackup:
      type: object
      required: [id, database_id, target_id, schedule, retention_count, enabled, created_at, updated_at]
      properties:
        id: { type: string, description: bak_… prefixed ID. }
        database_id: { type: string }
        target_id: { type: string }
        schedule: { type: string, description: 5-field cron. }
        retention_count: { type: integer }
        enabled: { type: boolean }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDatabaseBackupRequest:
      type: object
      required: [target_id, schedule]
      properties:
        target_id: { type: string }
        schedule: { type: string, description: 5-field cron. }
        retention_count: { type: integer }
        enabled: { type: boolean, default: true }
    BackupRecord:
      type: object
      required: [id, database_backup_id, size_bytes, status, started_at, created_at]
      properties:
        id: { type: string, description: br_… prefixed ID. }
        database_backup_id: { type: string }
        object_key: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [running, succeeded, failed] }
        detail: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    RunBackupResponse:
      type: object
      required: [record]
      properties:
        record: { $ref: "#/components/schemas/BackupRecord" }
    RestoreRequest:
      type: object
      required: [backup_record_id, confirm]
      properties:
        backup_record_id: { type: string }
        confirm: { type: boolean, description: Must be true — restore overwrites the database. }

    # ─── Previews ───────────────────────────────────────────────────────────────
    Preview:
      type: object
      required: [id, source_app_id, environment_id, pr_number, pr_branch, domain, status, created_at]
      properties:
        id: { type: string, description: prv_… prefixed ID. }
        source_app_id: { type: string }
        environment_id: { type: string, description: The child environment created for this preview. }
        preview_app_id: { type: [string, "null"], description: The cloned application. }
        pr_number: { type: integer }
        pr_branch: { type: string }
        domain: { type: string, description: "pr-<n>.<base>." }
        status: { type: string, enum: [creating, running, error, destroying] }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # ─── Notifiers ──────────────────────────────────────────────────────────────
    Notifier:
      type: object
      required: [id, project_id, name, channel, events, enabled, config_hint, created_at, updated_at]
      properties:
        id: { type: string, description: ntf_… prefixed ID. }
        project_id: { type: string }
        name: { type: string }
        channel: { type: string, enum: [email, discord, slack, telegram] }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
        config_hint: { type: string, description: Masked summary of the sealed channel config; never the secret. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateNotifierRequest:
      type: object
      required: [name, channel, config, events]
      properties:
        name: { type: string }
        channel: { type: string, enum: [email, discord, slack, telegram] }
        config:
          type: object
          description: >-
            Channel-specific config, sealed at rest and never returned. email:
            {smtp_host, smtp_port, username, password, from, to}; discord/slack:
            {webhook_url}; telegram: {bot_token, chat_id}.
          additionalProperties: true
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean, default: true }
    PatchNotifierRequest:
      type: object
      properties:
        name: { type: string }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
        config:
          type: object
          description: Supply to reseal the channel config wholesale; omit to keep the existing sealed value.
          additionalProperties: true

    # ─── Outbound webhooks ────────────────────────────────────────────────────
    WebhookEndpoint:
      type: object
      required: [id, project_id, url, events, enabled, health, created_at, updated_at]
      properties:
        id: { type: string, description: whe_… prefixed ID. }
        project_id: { type: string }
        url: { type: string, description: "The http(s) receiver. It is the endpoint's identity — there is no name." }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
        health:
          type: string
          enum: [healthy, degraded, failing, unknown]
          description: >-
            Derived from the ten most recent terminal deliveries, never stored.
            unknown = disabled or nothing delivered yet; healthy = all ten
            succeeded; degraded = the most recent succeeded but at least one
            failed; failing = the most recent exhausted its attempts.
        last_delivery_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateWebhookEndpointRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, description: http(s) receiver. }
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
          description: "webhook.ping is not subscribable — an endpoint always receives its own pings."
        enabled: { type: boolean, default: true }
    PatchWebhookEndpointRequest:
      type: object
      properties:
        url: { type: string }
        events:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed] }
        enabled: { type: boolean }
    CreateWebhookEndpointResponse:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        secret:
          type: string
          description: >-
            The raw HMAC signing secret, shown here exactly once and never
            retrievable again. Store it in the receiver now.
    WebhookSecret:
      type: object
      required: [secret]
      properties:
        secret: { type: string, description: The raw HMAC signing secret, shown exactly once. }
    WebhookDelivery:
      type: object
      required: [id, endpoint_id, event_type, resource_kind, resource_id, resource_name, status, attempt, created_at, updated_at]
      properties:
        id: { type: string, description: "whd_… prefixed ID — this is the X-CypherPanel-Delivery header value." }
        endpoint_id: { type: string }
        event_type: { type: string, description: "deploy.succeeded | deploy.failed | backup.succeeded | backup.failed | webhook.ping" }
        resource_kind: { type: string, enum: [application, database] }
        resource_id: { type: string, description: "The resource this event describes. Deliberately not a foreign key — the log outlives what it describes." }
        resource_name: { type: string, description: Denormalised so the feed still reads correctly after a deletion. }
        status: { type: string, enum: [pending, succeeded, failed] }
        attempt: { type: integer, description: "Attempts made so far (max 4)." }
        response_status: { type: [integer, "null"], description: "The most recent attempt's HTTP status; null before the first attempt and on a transport error." }
        duration_ms: { type: [integer, "null"], description: "How long the most recent attempt took; null before the first attempt." }
        next_attempt_at: { type: [string, "null"], format: date-time, description: When the next retry is due; null once terminal. }
        redelivery_of: { type: [string, "null"], description: The original delivery id when this row is a replay. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookDeliveryPage:
      type: object
      required: [deliveries, next_before]
      properties:
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        next_before:
          type: string
          description: Cursor to pass as ?before= for the next page; empty when this is the last page.

    # ─── Notification inbox ───────────────────────────────────────────────────
    InboxItem:
      type: object
      required: [id, project_id, kind, severity, digest, title, body, link, link_label, created_at, updated_at]
      properties:
        id: { type: string, description: inb_… prefixed ID. }
        project_id:
          type: string
          description: >-
            The project the event happened in — **empty for a panel-level kind**
            (`panel.update_available`) and for a team-scoped one
            (`access.*`, `invite.accepted`), which belong to the panel and to a
            team rather than to any project.
        team_id:
          type: string
          description: >-
            The team the item is about, set only for the team-access kinds
            (`access.requested`, `access.granted`, `access.denied`,
            `invite.accepted`). An item is scoped to a project, to a team, or to
            the panel — never to two of them.
        kind:
          type: string
          enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed, panel.update_available, deploy.awaiting_approval, deploy.approved, deploy.rejected, access.requested, access.granted, access.denied, invite.accepted]
          description: >-
            An inbox kind: an event key from the notification taxonomy — the
            same closed set notifiers and webhook endpoints subscribe to — or a
            panel-level kind, which only the inbox ever carries.
        severity:
          type: string
          enum: [info, error]
          description: >-
            The event's level, not a resource status. `error` is immediate and
            individual; `info` is rolled into the day's digest.
        digest:
          type: boolean
          description: >-
            True when this row is a daily rollup — one per (project, kind, UTC
            day), one unread however many events it holds. A digest carries no
            link: a rollup of three backups has no single thing to open.
        title:
          type: string
          description: >-
            The line to render, composed server-side — "Deploy failed: web", or
            "Backups: 3/3 succeeded" for a digest. The counters behind that
            sentence are deliberately not in this contract, so a CLI and the
            panel print the same words.
        body: { type: string, description: "Event detail, capped at 2 KB. Renders as text, never as markup." }
        link: { type: string, description: "An in-panel path such as /projects/prj_…/applications/app_…/deployments?dep=dep_… — validated at write time; empty when there is nothing to open." }
        link_label: { type: string, description: 'What to call the link — "View deployment", "View backups". Empty when link is.' }
        read_at: { type: [string, "null"], format: date-time, description: Null while unread; that is what the bell counts. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InboxPage:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
        next_before:
          type: string
          description: Cursor to pass as ?before= for the next page; empty when this is the last page.
    InboxUnreadCount:
      type: object
      required: [unread]
      properties:
        unread: { type: integer, description: How many of the caller's items are unread. }
    InboxMarked:
      type: object
      required: [marked]
      properties:
        marked: { type: integer, description: How many items the call changed from unread to read. }
    InboxPreferences:
      type: object
      required: [muted_kinds, available_kinds]
      properties:
        muted_kinds:
          type: array
          items: { type: string }
          description: >-
            Kinds this account does NOT want. Stored as mutes rather than
            subscriptions, so an empty array means "everything on" and a kind
            added later is on by default for everyone.
        available_kinds:
          type: array
          items: { type: string }
          description: >-
            Every inbox kind this plane can emit — the subscribable event
            taxonomy plus the panel-level kinds — served rather than hardcoded,
            so a new entry needs no client change.
    SetInboxPreferencesRequest:
      type: object
      required: [muted_kinds]
      properties:
        muted_kinds:
          type: array
          items: { type: string, enum: [deploy.succeeded, deploy.failed, backup.succeeded, backup.failed, panel.update_available] }
          description: The complete muted set; this replaces the previous one. A kind outside available_kinds is a 400.

    # ─── Audit log (audit-log.md §2, §7) ──────────────────────────────────
    #
    # Every id and name below is a SNAPSHOT taken when the action happened, not
    # a live reference. Renaming an application does not rewrite its history,
    # and deleting one does not delete the record of the deletion — so an id
    # here may name something that no longer exists, which is information
    # rather than an inconsistency.

    AuditActor:
      type: object
      required: [kind, user_id, token_id, label]
      properties:
        kind:
          type: string
          enum: [user, token, agent, system, anonymous]
          description: >-
            `user` — an interactive session. `token` — a personal access token
            acting for its owner (the owner is recorded too; a token is a way to
            act, not an identity). `agent` — an enrolled agent acting for its
            server. `system` — the panel itself, such as a signed inbound
            webhook. `anonymous` — an unauthenticated caller, which is what a
            refused sign-in is.
        user_id:
          type: string
          description: >-
            Empty for agent, system and anonymous actors. A snapshot: the
            account it names may since have been deleted, and the entry stays.
        token_id:
          type: string
          description: The personal access token used, when one was — the credential to revoke. Empty otherwise.
        label:
          type: string
          description: >-
            The email as it read when the action happened, never re-resolved.
            For an anonymous actor it is the address the sign-in claimed to be.

    AuditResource:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
          description: >-
            The glossary noun acted on — `user`, `session`, `api_token`, `team`,
            `server`, `deploy_key`, `project`, `environment`, `application`,
            `database`, `deployment`, `backup_target`, `backup_schedule`,
            `shared_variable`, `notifier`, `webhook_endpoint`, `panel`. Not a
            table name: an env-var change names the APPLICATION and a membership
            change names the TEAM, because that is the timeline they are read
            from.
        id: { type: string }
        name:
          type: string
          description: The name at the time. Empty when the action had no name to snapshot.

    AuditEvent:
      type: object
      required: [id, at, action, outcome, actor, resource, team_id, project_id, environment_id, detail, trace_id, client_ip]
      properties:
        id: { type: string, description: aud_… prefixed ID. }
        at: { type: string, format: date-time }
        action:
          type: string
          description: >-
            A dotted verb from the closed vocabulary: the family before the dot,
            the past-tense event after it. The families are `auth`, `token`,
            `user`, `team`, `server`, `deploy_key`, `project`, `environment`,
            `application`, `database`, `deploy`, `protection`, `backup_target`,
            `backup_schedule`, `backup`, `shared_variable`, `notifier`,
            `webhook_endpoint` and `panel`. Filter on a family with
            `?action=deploy`. The list grows additively; a client must treat an
            unrecognised verb as ordinary text.
          example: application.deleted
        outcome:
          type: string
          enum: [success, failure]
          description: >-
            Failure is an outcome, not a separate verb, so "everything that was
            refused" is one predicate over the whole vocabulary. A refusal
            carries its reason in `detail.reason`.
        actor:
          $ref: "#/components/schemas/AuditActor"
        resource:
          $ref: "#/components/schemas/AuditResource"
        team_id:
          type: string
          description: >-
            The owning team at the time. EMPTY means the action was
            panel-level — a server, a user, the mail/DNS/TLS settings — and only
            panel admins may read it.
        project_id:
          type: string
          description: Empty when the action was not scoped to a project.
        environment_id:
          type: string
          description: Empty when the action was not scoped to an environment.
        detail:
          type: object
          additionalProperties: true
          description: >-
            Structured extras: identifiers, key NAMES, counts, and the reason a
            refusal was refused. Never a secret VALUE — an env-var change
            records `{"key": "DATABASE_URL"}` and nothing else, and the audit
            service strips a denylist of secret-shaped key names as a second
            line of defence.
        trace_id:
          type: string
          description: >-
            The `X-Request-Id` of the request that performed the action, so a
            trace id from a screenshot finds what it did as well as what it
            logged.
        client_ip:
          type: string
          description: >-
            The address the panel attributed the request to — the same value the
            sign-in throttle counts against. Empty for actions with no request
            behind them.

    AuditPage:
      type: object
      required: [events, next_before]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_before:
          type: string
          description: >-
            Pass as `before` for the following page. Empty at the end of the
            log. A full page always returns a cursor, so the last page of an
            exactly-divisible log costs one extra request that comes back empty.

    # ─── Project shared variables (shared-variables.md §7) ────────────────
    # ─── Deploy protection (deploy-protection.md §2, §6) ────────────────────

    EnvironmentProtection:
      type: object
      required: [environment_id, require_approval, min_approver_role, freeze_enabled, windows]
      properties:
        environment_id: { type: string }
        require_approval:
          type: boolean
          description: >-
            Deploys to this environment park until someone at or above
            min_approver_role approves them. Webhook deploys park too — they
            simply have no requester.
        min_approver_role:
          type: string
          enum: [member, admin, owner]
          description: >-
            The minimum team rank that may approve. Snapshotted onto each
            approval at park time, so relaxing it does not relax a deploy that
            is already parked.
        freeze_enabled:
          type: boolean
          description: >-
            The master switch over `windows`. Turning it off keeps the declared
            windows, so they can be re-armed without retyping; an empty
            `windows` list means no freeze whatever this says.
        windows:
          type: array
          items:
            $ref: "#/components/schemas/FreezeWindow"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FreezeWindow:
      type: object
      required: [id, start_dow, start_minute, end_dow, end_minute, timezone, summary]
      properties:
        id: { type: string, description: fzw_… prefixed ID, minted on each wholesale write. }
        start_dow:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday.
        start_minute:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes past local midnight, in `timezone`.
        end_dow:
          type: integer
          minimum: 0
          maximum: 6
        end_minute:
          type: integer
          minimum: 0
          maximum: 1439
        timezone:
          type: string
          description: >-
            IANA name, e.g. "Europe/Berlin". The window is evaluated on WALL
            CLOCK in this zone, so a DST change makes it an hour shorter or
            longer in absolute terms twice a year — which is what "no deploys
            after six on Friday" means. The window is half-open and may wrap the
            week (Fri 18:00 → Mon 08:00 is one window).
        summary:
          type: string
          description: >-
            The window rendered as the sentence the panel and the CLI both
            print, e.g. "Fri 18:00 → Mon 08:00 (Europe/Berlin)". Derived,
            never stored.

    SetProtectionRequest:
      type: object
      # Every field is required, and the handler answers 400 for each omission
      # rather than applying a default: this is a wholesale replace, so a
      # forgotten field would silently rewrite the policy and answer 200.
      required: [require_approval, min_approver_role, freeze_enabled, windows]
      properties:
        require_approval: { type: boolean }
        min_approver_role:
          type: string
          enum: [member, admin, owner]
        freeze_enabled: { type: boolean }
        windows:
          type: array
          maxItems: 8
          description: The complete window list; it replaces whatever was there.
          items:
            $ref: "#/components/schemas/FreezeWindowInput"

    FreezeWindowInput:
      type: object
      required: [start_dow, start_minute, end_dow, end_minute, timezone]
      properties:
        start_dow: { type: integer, minimum: 0, maximum: 6 }
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        end_dow: { type: integer, minimum: 0, maximum: 6 }
        end_minute: { type: integer, minimum: 0, maximum: 1439 }
        timezone: { type: string, description: "IANA name, e.g. Europe/Berlin." }

    DeployApproval:
      type: object
      required: [deployment_id, environment_id, required_role, state, created_at]
      properties:
        deployment_id: { type: string }
        environment_id: { type: string }
        requested_by:
          type: string
          description: >-
            The user who asked for the deploy. Empty for a webhook deploy — a
            push has no panel user behind it — and for a requester who has since
            been deleted.
        requested_by_email:
          type: string
          description: That user's address, joined for display. Empty when there is no requester.
        required_role:
          type: string
          enum: [member, admin, owner]
          description: The rank that must approve, snapshotted at park time.
        state:
          type: string
          enum: [pending, approved, rejected]
        decided_by:
          type: string
          description: Who approved or rejected; empty while pending.
        decided_by_email:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          description: The rejecter's sentence, stored verbatim and rendered as text. Empty on an approval.
        created_at:
          type: string
          format: date-time

    BreakGlassGrant:
      type: object
      required: [id, environment_id, opened_by, reason, created_at, expires_at, active]
      properties:
        id: { type: string, description: bg_… prefixed ID. }
        environment_id: { type: string }
        opened_by: { type: string }
        opened_by_email: { type: string }
        reason:
          type: string
          description: Why the freeze was overridden, stored verbatim and rendered as text.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: >-
            30 minutes after it was opened. Grants lapse on their own and are
            never revoked early.
        active:
          type: boolean
          description: Whether the grant still suspends the freeze, as of this response.

    BreakGlassRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required, single-line. It is the gate on the dialog instead of a typed name.

    RejectDeploymentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            Why the deploy is refused. It becomes part of the deployment's
            detail ("rejected by alex@acme.com: shipping Monday") and of the
            requester's inbox item.

    SharedVariable:
      type: object
      required: [id, project_id, environment_id, environment_name, key, used_by_count, created_at, updated_at]
      properties:
        id: { type: string, description: sv_… prefixed ID. }
        project_id: { type: string }
        environment_id:
          type: [string, "null"]
          description: null at project scope; otherwise the environment this variable is narrowed to.
        environment_name:
          type: string
          description: Empty at project scope. Present so a list needs no second lookup to render the scope.
        key: { type: string, description: "Matches [A-Za-z_][A-Za-z0-9_]* — the same charset as an application's own env keys." }
        used_by_count:
          type: integer
          description: >-
            How many applications reference this variable. Scope-accurate: an
            application whose own environment defines a shadowing row of the
            same key is not counted, because it does not use this one.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SharedVariableUsage:
      type: object
      required: [application_id, application_name, environment_name, redeploy_pending]
      properties:
        application_id: { type: string }
        application_name: { type: string }
        environment_name: { type: string }
        redeploy_pending:
          type: boolean
          description: This variable changed after the environment the application is running was frozen onto the wire.
    CreateSharedVariableRequest:
      type: object
      required: [key, value]
      properties:
        key: { type: string, description: "[A-Za-z_][A-Za-z0-9_]*" }
        environment_id:
          type: [string, "null"]
          description: >-
            Omit or send null for project scope. An environment of another
            project is a 400 — the foreign key alone cannot express that.
        value:
          type: string
          maxLength: 32768
          description: >-
            The value, sealed at rest and never returned. It is stored verbatim:
            a nested shared reference inside it is rejected — there is no nesting.
    PatchSharedVariableRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          maxLength: 32768
          description: >-
            Replaces the sealed value. Always bumps updated_at, even when the
            plaintext is unchanged, which marks every referencing application
            "redeploy to apply".

    # ─── Scheduled tasks ──────────────────────────────────────────────────────
    ScheduledTask:
      type: object
      required: [id, application_id, name, schedule, command, enabled, created_at, updated_at]
      properties:
        id: { type: string, description: sch_… prefixed ID. }
        application_id: { type: string }
        name: { type: string }
        schedule: { type: string, description: 5-field cron. }
        command:
          type: array
          items: { type: string }
          description: argv, passed straight to exec (never a shell string; use ["sh","-c","…"] for a shell).
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateScheduledTaskRequest:
      type: object
      required: [name, schedule, command]
      properties:
        name: { type: string }
        schedule: { type: string, description: 5-field cron. }
        command:
          type: array
          minItems: 1
          items: { type: string }
        enabled: { type: boolean, default: true }
    ScheduledTaskRun:
      type: object
      required: [id, task_id, started_at, status]
      properties:
        id: { type: string, description: str_… prefixed ID. }
        task_id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        exit_code: { type: [integer, "null"] }
        status: { type: string, enum: [running, succeeded, failed] }
        output_tail: { type: string, description: Capped stdout+stderr tail. }
security:
  - bearer: []
