          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/restart:
    post:
      operationId: restartApplication
      tags: [applications]
      summary: Recreate the container without shipping a new revision
      description: >-
        Restarts the running application. Expressed as desired state rather than
        as a verb the agent obeys: the panel issues a new restart token, the
        reconciler recreates a container whose token does not match, and
        converging again afterwards changes nothing.


        This is NOT a deploy. No revision is created, no build runs, no
        deployment appears, and the desired revision does not move — restarting
        a wedged container must not silently ship the configuration someone
        edited an hour ago. The response is the application.


        The replacement starts alongside the container it replaces, passes the
        same health gate, takes the route, and only then does the old one drain
        — a restart is zero-downtime for the same reason a deploy is.


        A freeze window does NOT block it: a freeze exists to stop new code
        shipping, and a restart ships none. Refusing to restart a crashed
        application during a freeze would make the freeze an outage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: >-
            Accepted. The application, unchanged in everything a client can
            act on — the restart token itself is internal plumbing and is not
            part of the response. Watch `status` for the recreate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The application has never deployed, so there is no container to
            restart. Deploy it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/deploy:
    post:
      operationId: deployApplication
      tags: [deployments]
      summary: Deploy the application (build → rollout, zero-downtime)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "202":
          description: >-
            Accepted. Normally the pipeline has started; poll the deployment for
            progress. When the target environment requires approval
            (deploy-protection.md), the deployment comes back with
            `status: awaiting_approval` and its `approval` summary instead — no
            work item has been published, and it starts only once someone at or
            above `approval.required_role` approves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The environment is inside a freeze window; nothing was written. The
            error names the window and when it lifts, e.g. "production is frozen
            until Mon 08:00 Europe/Berlin", so the request can simply be retried
            after it. A team owner may open a break-glass grant first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

