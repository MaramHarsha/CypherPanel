    get:
      operationId: listDatabaseBackups
      tags: [backups]
      summary: List a database's backup schedules
      responses:
        "200": { description: Schedules., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DatabaseBackup" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDatabaseBackup
      tags: [backups]
      summary: Create a backup schedule
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDatabaseBackupRequest" } } }
      responses:
        "201": { description: Schedule created., content: { application/json: { schema: { $ref: "#/components/schemas/DatabaseBackup" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/backups/{bak_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
      - { name: bak_id, in: path, required: true, schema: { type: string }, description: Backup schedule ID (bak_… prefix). }
    patch:
      operationId: patchDatabaseBackup
      tags: [backups]
      summary: Edit a backup schedule
      description: >
        A partial edit: pause a schedule without forgetting where it wrote, move
        it to another target, or change the retention window, one at a time. A
        target that does not exist is a 400 rather than a foreign-key error, and
        a retention of zero or less falls back to the same default creation uses.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatchDatabaseBackupRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/DatabaseBackup" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDatabaseBackup
      tags: [backups]
      summary: Delete a backup schedule
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/backups/{bak_id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
      - { name: bak_id, in: path, required: true, schema: { type: string }, description: Backup schedule ID. }
    get:
      operationId: listBackupHistory
      tags: [backups]
      summary: List a schedule's backup run history
      responses:
        "200": { description: "Backup records, newest first.", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BackupRecord" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/backups/{bak_id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
      - { name: bak_id, in: path, required: true, schema: { type: string }, description: Backup schedule ID. }
    post:
      operationId: runBackupNow
      tags: [backups]
      summary: Run a backup now
      responses:
        "202": { description: Backup started; the record tracks progress., content: { application/json: { schema: { $ref: "#/components/schemas/RunBackupResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/databases/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
    post:
      operationId: restoreDatabase
      tags: [backups]
      summary: Restore a database from a backup (destructive; confirm required)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RestoreRequest" } } }
      responses:
        "202": { description: "Restore started. The record tracks it.", content: { application/json: { schema: { $ref: "#/components/schemas/DatabaseRestore" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Confirmation missing or the database is not in a restorable state., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/databases/{id}/restores:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
    get:
      operationId: listDatabaseRestores
      tags: [backups]
      summary: A database's restore history, newest first
      description: >
        What was put back, and how it went. A different question from the backup
        history, which is what was taken.
      responses:
        "200": { description: Restores., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DatabaseRestore" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { description: Restores are not enabled on this panel., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/databases/{id}/restores/{rid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Database ID. }
      - { name: rid, in: path, required: true, schema: { type: string }, description: Restore ID. }
    get:
      operationId: getDatabaseRestore
      tags: [backups]
      summary: One restore, including how far a running one has got
      description: >
        The blocking progress dialog polls this while a restore runs, and reopens
        onto it when someone closes the tab and comes back to a database that is
        still offline. A restore belonging to another database is 404 here even
        though the id exists.
      responses:
        "200": { description: The restore., content: { application/json: { schema: { $ref: "#/components/schemas/DatabaseRestore" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { description: Restores are not enabled on this panel., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ─── Preview environments (preview-environments.md §7) ────────────────────
