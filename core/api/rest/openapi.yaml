  /api/v1/deployments/{id}/cancel:
    post:
      operationId: cancelDeployment
      tags: [deployments]
      summary: Stop waiting on a deploy that is going nowhere
      description: >-
        Ends a deployment the operator has stopped waiting on. It is the PANEL
        stopping waiting, not a remote kill: a build already in flight finishes
        on its builder, and the image it produces is reclaimed by desired-state
        garbage collection because nothing desires its revision.


        Works while the deploy is `queued`, `awaiting_approval`, `building` or
        `distributing`. Once it is `rolling_out` the answer is `409` — desired
        state has already moved and every agent is converging on the new
        revision, so the honest recovery is a rollback rather than a cancel that
        would leave the panel claiming it abandoned what the reconciler is still
        applying.


        A cancelled deploy ends as `failed`, with `cancelled by <email>` in its
        detail. There is no separate `cancelled` status, and nothing is
        announced to notifiers or outbound webhooks: their taxonomy is
        infrastructure outcomes, and a cancellation is a person's decision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled. The deployment comes back terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The deploy is already rolling out (roll back instead), or it has
            already finished. Nothing is written either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deployments/{id}/rollback:
    post:
      operationId: rollbackDeployment
      tags: [deployments]
      summary: Roll back to the revision this deployment shipped (build skipped)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: >-
            Accepted. Normally the rollback pipeline has started. When the
            environment requires approval the deployment comes back with
            `status: awaiting_approval` and its `approval` summary — a rollback
            changes what is serving, so it passes the same gate a forward deploy
            does.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Either the revision was never built (nothing to roll back to), or
            the environment is inside a freeze window — in which case the error
            names the window and when it lifts. Nothing is written in either
            case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/github/{id}:
    post:
      operationId: handleGithubWebhook
      tags: [deployments]
      summary: GitHub push webhook (HMAC-authenticated, no session)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The application's webhook id (wh_… prefix).
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: GitHub's HMAC-SHA256 body signature ("sha256=<hex>").
      responses:
        "202":
          description: >-
            Push on the configured branch; deployment started — or, when the
            environment requires approval, parked with
            `status: awaiting_approval` and a `requested_by`-less approval
            (a push has no panel user behind it).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "204":
          description: Authenticated, but not a deployable push (other branch, deletion, non-push event).
        "401":
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown webhook id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The environment is inside a freeze window; nothing was written. The
            error names the window and when it lifts, so the delivery is
            diagnosable from the response alone and can be redelivered from
            GitHub after the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/deploy-keys:
    get:
      operationId: listDeployKeys
      tags: [deploy-keys]
      summary: List all deploy keys (public key only)
      responses:
        "200":
          description: A list of deploy keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployKeysList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createDeployKey
      tags: [deploy-keys]
      summary: Create a new deploy key for private repository access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeployKeyRequest"
      responses:
        "201":
          description: Deploy key created. The response carries the public key for the operator to register with their Git host; the private key is sealed server-side and never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDeployKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/deploy-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Deploy key ID (dk_... prefix).
    get:
      operationId: getDeployKey
      tags: [deploy-keys]
      summary: Get a deploy key by ID
      responses:
        "200":
          description: A single deploy key (public key only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such deploy key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDeployKey
      tags: [deploy-keys]
      summary: Delete a deploy key (RESTRICT-gated by application references)
      responses:
        "204":
          description: Deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such deploy key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Deploy key is still in use. The body names the blocking
            applications so the operator can go detach them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployKeyInUse"

  /api/v1/registries:
    get:
      operationId: listRegistries
      tags: [registries]
      summary: List the container registries your teams can use
      description: >-
        Filtered to the teams you belong to rather than refused, so a caller in
        no teams gets an empty list. The token is never returned — `token_set`
        says only that one exists.
      responses:
        "200":
          description: The registries visible to you.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createRegistry
      tags: [registries]
      summary: Store a container registry credential
      description: >-
        Team admin or above. `team_id` may be omitted when you belong to exactly
        one team. Nothing in the deploy path requires a registry (ADR-008); this
        is for pulling a private base image and for pushing builds somewhere the
        operator already runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistryRequest"
      responses:
        "201":
          description: Registry created. The token is sealed and is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A registry with that name already exists in the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/registries/test:
    post:
      operationId: testRegistryConfig
      tags: [registries]
      summary: Prove a credential before saving it
      description: >-
        Authenticates against the registry's `/v2/` endpoint and stores nothing.
        A rejected credential is a `200` with `ok:false` — the request
        succeeded, the authentication did not. Team admin or above, because it
        makes an outbound request to a host the caller chose.


        The panel will not connect to an address inside its own network
        (loopback, RFC1918, link-local and the rest, checked against the
        RESOLVED address). A registry on a private network therefore cannot be
        tested from here — `detail` says so, and says to save it anyway, because
        the agent that does the pulling is already on that network.
      parameters:
        - name: team_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            Which team's admin rank to check. May be omitted when you belong to
            exactly one team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestRegistryRequest"
      responses:
        "200":
          description: Tested. `ok` is the verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/registries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Registry ID (reg_... prefix).
    get:
      operationId: getRegistry
      tags: [registries]
      summary: Get one registry
      responses:
        "200":
          description: The registry, without its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No such registry — the same answer given for a registry in a team
            you do not belong to, so membership is not probeable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateRegistry
      tags: [registries]
      summary: Edit a registry, or rotate its token
      description: >-
        Team admin or above. Every field is optional; an omitted field is left
        alone, so rotating the token does not mean re-sending the URL. The
        merged result is validated exactly as a create would be.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRegistryRequest"
      responses:
        "200":
          description: The updated registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A registry with that name already exists in the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteRegistry
      tags: [registries]
      summary: Delete a registry (refused while applications use it)
      description: >-
        Team admin or above. Deleting a credential that applications depend on
        would break their next deploy at the moment nobody is looking, so it is
        refused; `GET /api/v1/registries/{id}/used-by` names what is holding it.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Applications still use this registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/registries/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Registry ID.
    post:
      operationId: testRegistry
      tags: [registries]
      summary: Re-authenticate a stored registry and record the outcome
      description: >-
        Team admin or above. The result is stored on the registry as
        `last_test_at` / `last_test_ok`, so a list can show whether a credential
        is known-good without re-authenticating on every page render.


        Subject to the same egress rule as testing an unsaved configuration: the
        panel will not connect to an address inside its own network, and a
        private registry is pulled by the agent rather than reached from here.
      responses:
        "200":
          description: Tested. `ok` is the verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/registries/{id}/used-by:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Registry ID.
    get:
      operationId: listRegistryUses
      tags: [registries]
      summary: The applications that would break if this registry went away
      description: >-
        Named rather than counted, because "3 applications" is not something an
        operator can act on.
      responses:
        "200":
          description: What pulls through, and what pushes to, this registry.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistryUse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Registries are not enabled on this panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/env:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID.
    get:
      operationId: listEnvVarKeys
      tags: [applications]
      summary: List environment-variable keys (values are write-only)
      responses:
        "200":
          description: The keys only; values are never returned (ui-principles §6).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVarKeys"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/applications/{id}/env/{key}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Application ID.
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Environment-variable name.
    put:
      operationId: setEnvVar
      tags: [applications]
      summary: Set (create or replace) an environment variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEnvVarRequest"
      responses:
        "204":
          description: Stored (sealed at rest).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEnvVar
      tags: [applications]
      summary: Delete an environment variable
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Teams & users (teams-and-roles.md) ───────────────────────────────────
  /api/v1/teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List the caller's teams (all teams for a panel owner)
      responses:
        "200":
          description: Teams with the caller's role in each.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team (panel admin+); the creator becomes its owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/teams/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID (tm_… prefix). }
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team (member+)
      responses:
        "200": { description: The team., content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: renameTeam
      tags: [teams]
      summary: Rename a team (team owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RenameTeamRequest" } } }
      responses:
        "200": { description: Renamed., content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (team owner); refused while it owns projects
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The team still owns projects., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/teams/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID. }
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: List team members (member+)
      responses:
        "200": { description: The members., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TeamMember" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a member (team admin+; granting owner needs team owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddMemberRequest" } } }
      responses:
        "201": { description: Member added., content: { application/json: { schema: { $ref: "#/components/schemas/TeamMember" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teams/{id}/members/{uid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID. }
      - { name: uid, in: path, required: true, schema: { type: string }, description: User ID (usr_… prefix). }
    patch:
      operationId: changeTeamMemberRole
      tags: [teams]
      summary: Change a member's role (grant rules apply; the last owner is protected)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" } } }
      responses:
        "200": { description: Role changed., content: { application/json: { schema: { $ref: "#/components/schemas/TeamMember" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Would leave the team without an owner., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member (removing an owner needs team owner; last owner protected)
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Would leave the team without an owner., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [teams]
      summary: List all users (panel admin+)
      responses:
        "200": { description: Users., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      tags: [teams]
      summary: Create a user (panel admin+; a panel role above member needs panel owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateUserRequest" } } }
      responses:
        "201": { description: User created., content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: User ID. }
    patch:
      operationId: updateUserRole
      tags: [teams]
      summary: Change a user's panel role (panel owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetUserRoleRequest" } } }
      responses:
        "200": { description: Role changed., content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Would leave the panel without an owner., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteUser
      tags: [teams]
      summary: Delete a user (panel owner; never your own account)
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── Invitations and access requests
  #     (invitations-and-access-requests.md §7) ────────────────────────────────
  /api/v1/teams/{id}/invites:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID (tm_… prefix). }
    get:
      operationId: listTeamInvites
      tags: [invites]
      summary: List a team's invitations (team admin+)
      description: >-
        Outstanding invitations by default — those that can still be accepted.
        No response here ever carries the invitation's token or its hash: the
        accept URL is readable exactly once, in the response that created it.
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, all], default: pending }
          description: >-
            `pending` (the default) lists only invitations that can still be
            accepted; `all` adds the accepted, revoked and expired ones.
      responses:
        "200":
          description: The team's invitations, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TeamInvite" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createTeamInvite
      tags: [invites]
      summary: Invite an address to a team (team admin+; inviting an owner needs team owner)
      description: >-
        Issues a single-use invitation link that expires in 7 days. The invited
        role may not exceed the caller's own rank, and the rank is checked HERE
        rather than at acceptance — the person accepting has none of their own.


        Re-inviting an address supersedes: the outstanding invitation for it on
        this team is revoked and a fresh one issued, so an operator is never
        stuck behind a link they cannot see. An address that is already a member
        is refused with 409 — re-ranking an existing member is
        `PATCH /teams/{id}/members/{uid}`, which has the last-owner guard.


        The response's `accept_url` is the ONLY time the invitation's token is
        readable. It is returned whether or not the panel could mail it, because
        a self-hosted panel with no SMTP is the common case and an invitation
        nobody can deliver is worse than a link the operator hands over
        themselves; `mail_sent` says which of the two happened.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Invitation issued. `accept_url` appears here and nowhere else, ever.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That address is already a member of this team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/teams/{id}/invites/{inv}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID. }
      - { name: inv, in: path, required: true, schema: { type: string }, description: Invitation ID (inv_… prefix). }
    delete:
      operationId: revokeTeamInvite
      tags: [invites]
      summary: Revoke an invitation (team admin+)
      description: >-
        Kills the link immediately. Any team admin may revoke any of the team's
        invitations, including one that would have granted owner: revoking is a
        reduction, so it needs no extra rank. An invitation that was already
        revoked, already accepted, or never belonged to this team answers 404 —
        one undifferentiated answer.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
        description: >-
          The wire token from the invitation link (`inv_….<secret>`). Only a
          hash of the secret is stored, and it is compared in constant time.
    get:
      operationId: getInvite
      tags: [invites]
      summary: Read an invitation by its link (public)
      description: >-
        Public — this is the screen someone opens before they have an account.
        It says who invited them, to which team, as what, and until when.


        Unknown, wrong-secret, expired, revoked and already-accepted are ONE
        answer (404), so a guess learns nothing about which invitations exist.
        Throttled by client address like sign-in: a refused call answers 429
        with `Retry-After`.
      security: []
      responses:
        "200":
          description: The invitation, as much of it as a stranger may see.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/invites/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: The wire token from the invitation link. }
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Accept an invitation and sign in (public)
      description: >-
        Spends the invitation, adds the membership at the invited role, and
        returns a session — the invitee lands inside the panel rather than at a
        second form.


        If the invited address has no account, `password` is the one they are
        CHOOSING (at least 8 characters, the same floor first-run setup
        enforces) and the account is created with panel role `member`.


        If the address already has an account, `password` is that account's
        CURRENT password and the call goes through the ordinary sign-in path: an
        account with two-factor enabled answers 401 with `totp_required` until
        `totp_code` is supplied. An invitation never resets an existing
        password — otherwise inviting an address would be an account-takeover
        primitive for anyone who can invite.


        Single-use, enforced by the database: a replay answers 404. An address
        that became a member between the invitation and the acceptance answers
        409 and the link is revoked as moot.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Joined with an existing account; the session token is returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "201":
          description: Account created and joined; the session token is returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >-
            The address already has an account and the password was wrong, or a
            second factor is required — `totp_required: true` then says to ask
            for the code rather than the password again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That address is already a member of this team — sign in instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/teams/{id}/access-requests:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Team ID. }
    get:
      operationId: listAccessRequests
      tags: [access-requests]
      summary: List a team's access requests (team admin+)
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, all], default: pending }
          description: "`pending` (the default) is the owners' queue; `all` adds the decided ones."
      responses:
        "200":
          description: The team's access requests, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AccessRequest" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAccessRequest
      tags: [access-requests]
      summary: Ask this team's owners for a higher role (team member+)
      description: >-
        What the 403 screen's "Request access" does. The requested role must
        rank strictly above the caller's current one, and the caller must
        already be a member — a team you cannot see answers 404, because a
        request collection that answered otherwise would be a way to probe for
        other tenants. The way into a team you are not in is an invitation.


        One open request per person per team: a second while one is pending
        answers 409, so the owners' inbox does not fill with the same ask.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccessRequestRequest" }
      responses:
        "201":
          description: Request opened; the team's owners have been told.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A request from you is already open on this team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/access-requests/{id}/grant:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Access request ID (acr_… prefix). }
    post:
      operationId: grantAccessRequest
      tags: [access-requests]
      summary: Grant an access request (team owner; interactive session only)
      description: >-
        Applies the requested role through the ordinary member-role path, so the
        last-owner guard and the grant-rank rule hold unchanged, then records
        the decision and tells the requester.


        Session-only: an API token inherits its owner's role, so a leaked
        `write`-able token belonging to an owner could otherwise promote an
        account to owner — durable, panel-wide privilege from one CI credential.
        A request whose subject has left the team, or that another owner has
        already decided, answers 409.
      responses:
        "200":
          description: Granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already decided, the requester has left the team, or it would leave the team without an owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/access-requests/{id}/deny:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Access request ID. }
    post:
      operationId: denyAccessRequest
      tags: [access-requests]
      summary: Deny an access request (team owner; interactive session only)
      description: >-
        Records the refusal, with an optional reason carried verbatim to the
        requester, and changes no membership. Session-only for the same reason
        as `grant`: both are decisions about who can do what in the team.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DenyAccessRequestRequest" }
      responses:
        "200":
          description: Denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That request has already been decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

