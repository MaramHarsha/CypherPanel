# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: superset-with-postgresql
name: Superset with PostgreSQL
description: Modern data exploration and visualization platform (unofficial community docker image)
category: analytics
version: 6.0.0
resources:
  databases:
    - name: db
      engine: postgresql
      version: "18"
    - name: cache
      engine: redis
      version: "8"
  applications:
    - name: superset
      image: amancevice/superset@sha256:0ebc3861504370a7a8e6d6d878a69a69d929ffb776c17280f4380be546d5d1ca
      port: 8088
      route: true
      health:
        kind: tcp
      env:
        MAPBOX_API_KEY: ""
        POSTGRES_DB: '{{db.db.database}}'
        POSTGRES_PASSWORD: '{{db.db.password}}'
        POSTGRES_USER: '{{db.db.user}}'
        REDIS_PASSWORD: '{{db.cache.password}}'
        SECRET_KEY: '{{secret.32}}'
first_login:
  kind: setup
  note: "Sign in with admin / admin, then change it immediately under Settings."
