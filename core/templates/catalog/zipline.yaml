# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: zipline
name: Zipline
description: A ShareX/file upload server that is easy to use, packed with features, and with an easy setup!
category: other
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: zipline
      image: ghcr.io/diced/zipline@sha256:526fa08d2d3cf46bd959b2008987ca8d2a38b1ba840991b68cd9ff4b8c6a3fab
      port: 3000
      route: true
      health:
        kind: tcp
      volumes:
        - name: zipline-uploads
          path: /zipline/uploads
        - name: zipline-public
          path: /zipline/public
      env:
        CORE_LOGGER: "true"
        CORE_RETURN_HTTPS: "false"
        CORE_SECRET: '{{secret.32}}'
        DATABASE_URL: postgres://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}/{{db.db.database}}
