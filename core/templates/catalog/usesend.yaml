# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: usesend
name: Usesend
description: Usesend is an open-source alternative to Resend, Sendgrid, Mailgun and Postmark etc.
category: communication
version: 1.9.6
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
    - name: cache
      engine: redis
      version: "7"
  applications:
    - name: usesend
      image: usesend/usesend@sha256:99eaddbf1abd0461b29a3af341b98330abe2bf7cb781b09610c04c056d25178f
      port: 3000
      route: true
      health:
        kind: tcp
      env:
        API_RATE_LIMIT: "1"
        AWS_ACCESS_KEY: ""
        AWS_DEFAULT_REGION: ""
        AWS_SECRET_KEY: ""
        DATABASE_URL: postgresql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}
        GITHUB_ID: ""
        GITHUB_SECRET: ""
        HOSTNAME: 0.0.0.0
        NEXT_PUBLIC_IS_CLOUD: "false"
        NEXTAUTH_SECRET: '{{secret.32}}'
        NEXTAUTH_URL: https://{{domain}}
        REDIS_URL: redis://:{{db.cache.password}}@{{db.cache.host}}:6379
