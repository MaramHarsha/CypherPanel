# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: odoo
name: Odoo
description: Odoo is a suite of open-source business apps that cover all your company needs.
category: productivity
version: "18"
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: odoo
      image: odoo@sha256:38f37aadb676acb3e0e0d5138f66e6fea8a0bcfde080520ffc50733d726d5ecf
      port: 8069
      route: true
      health:
        kind: tcp
      volumes:
        - name: odoo-web-data
          path: /var/lib/odoo
        - name: odoo-extra-addons
          path: /mnt/extra-addons
      env:
        HOST: '{{db.db.host}}'
        PASSWORD: '{{db.db.password}}'
        USER: '{{db.db.user}}'
