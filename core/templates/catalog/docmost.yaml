# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: docmost
name: Docmost
description: Open-source collaborative wiki and documentation software
category: productivity
version: 0.95.0
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
    - name: cache
      engine: redis
      version: "7.2"
  applications:
    - name: docmost
      image: docmost/docmost@sha256:41c8d777cf23c74e78f94e676aec328b7d7856f48df5e573543dac68d371e37c
      port: 3000
      route: true
      health:
        kind: tcp
      volumes:
        - name: docmost
          path: /app/data/storage
      env:
        APP_SECRET: '{{secret.16}}'
        APP_URL: https://{{domain}}
        DATABASE_URL: postgresql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}/{{db.db.database}}?schema=public
        MAIL_DRIVER: ""
        MAIL_FROM_ADDRESS: ""
        MAIL_FROM_NAME: ""
        POSTMARK_TOKEN: ""
        REDIS_URL: redis://:{{db.cache.password}}@{{db.cache.host}}:6379
        SMTP_HOST: ""
        SMTP_PASSWORD: ""
        SMTP_PORT: ""
        SMTP_SECURE: ""
        SMTP_USERNAME: ""
