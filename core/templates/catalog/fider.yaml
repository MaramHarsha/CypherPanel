# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: fider
name: Fider
description: Fider is a feedback platform for collecting and managing user feedback.
category: other
version: stable
resources:
  databases:
    - name: db
      engine: postgresql
      version: "12"
  applications:
    - name: fider
      image: getfider/fider@sha256:eb95d0b4bf5d4eeb19434b4e95af2a510f35687b8c3fa8bd7c136796051e0d27
      port: 3000
      route: true
      health:
        kind: tcp
      env:
        BASE_URL: https://{{domain}}
        DATABASE_URL: postgres://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}?sslmode=disable
        EMAIL_AWSSES_ACCESS_KEY_ID: ""
        EMAIL_AWSSES_REGION: ""
        EMAIL_AWSSES_SECRET_ACCESS_KEY: ""
        EMAIL_MAILGUN_API: ""
        EMAIL_MAILGUN_DOMAIN: ""
        EMAIL_MAILGUN_REGION: ""
        EMAIL_NOREPLY: noreply@example.com
        EMAIL_SMTP_ENABLE_STARTTLS: ""
        EMAIL_SMTP_HOST: smtp.mailgun.com
        EMAIL_SMTP_PASSWORD: ""
        EMAIL_SMTP_PORT: "587"
        EMAIL_SMTP_USERNAME: postmaster@mailgun.com
        JWT_SECRET: '{{secret.32}}'
