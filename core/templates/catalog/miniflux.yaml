# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: miniflux
name: Miniflux
description: Miniflux is a minimalist and opinionated feed reader.
category: productivity
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: miniflux
      image: ghcr.io/miniflux/miniflux@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb
      port: 8080
      route: true
      health:
        kind: tcp
      env:
        ADMIN_PASSWORD: '{{secret.32}}'
        ADMIN_USERNAME: '{{secret.16}}'
        BASE_URL: https://{{domain}}
        CREATE_ADMIN: "1"
        DATABASE_URL: postgres://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}?sslmode=disable
        PORT: "8080"
        RUN_MIGRATIONS: "1"
first_login:
  kind: credentials
  username_env: ADMIN_USERNAME
  password_env: ADMIN_PASSWORD
  note: "Both the username and the password were generated for this install — there is no default to fall back on."
