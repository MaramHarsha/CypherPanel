schema: v1
slug: plex
name: Plex
description: Plex organizes video, music and photos from personal media libraries and streams them to smart TVs, streaming boxes and mobile devices.
category: media
resources:
  applications:
    - name: plex
      image: lscr.io/linuxserver/plex@sha256:d2d85229429f2a8b84a6f5523f7cd69470d9b705a1aba9046887eb73d395101f
      port: 32400
      route: true
      health:
        kind: tcp
      volumes:
        - name: plex-config
          path: /config
        - name: plex-tv
          path: /tv
        - name: plex-movies
          path: /movies
      env:
        _APP_URL: https://{{domain}}
        PGID: "1000"
        PLEX_CLAIM: ""
        PUID: "1000"
        TZ: America/Toronto
first_login:
  kind: setup
  note: "Open the domain and sign in with your Plex account to claim the server."
