schema: v1
slug: libretranslate
name: Libretranslate
description: Free and open-source machine translation API, entirely self-hosted.
category: ai
resources:
  applications:
    - name: libretranslate
      image: libretranslate/libretranslate@sha256:bf63165d00b22fc26f2c42bdd6fe0275af6430656f2a554f20733eb61c80aa88
      port: 5000
      route: true
      health:
        kind: tcp
      volumes:
        - name: libretranslate-api-keys
          path: /app/db
        - name: libretranslate-models
          path: /home/libretranslate/.local
      env:
        LT_LOAD_ONLY: en,es,fr,de,ja
        LT_SSL: "true"
        LT_UPDATE_MODELS: "true"
first_login:
  kind: none
  note: "There is no sign-in — open the domain and use it."
