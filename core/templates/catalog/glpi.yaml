# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: glpi
name: Glpi
description: GLPI (Gestionnaire Libre de Parc Informatique) is a free, open-source IT Service Management (ITSM) platform used for IT asset management, helpdesk, and service desk operations.
category: communication
version: 11.0.8
resources:
  databases:
    - name: db
      engine: mysql
      version: "8"
  applications:
    - name: glpi
      image: glpi/glpi@sha256:ca6b53ef948e940f41e1f4af31c001097897e819b66d146d3e5cac51ac7e9f14
      port: 80
      route: true
      health:
        kind: tcp
      volumes:
        - name: glpi-data
          path: /var/glpi
      env:
        GLPI_DB_HOST: '{{db.db.database}}'
        GLPI_DB_NAME: '{{db.db.database}}'
        GLPI_DB_PASSWORD: '{{db.db.password}}'
        GLPI_DB_PORT: "3306"
        GLPI_DB_USER: '{{db.db.user}}'
