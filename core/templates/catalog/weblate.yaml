# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: weblate
name: Weblate
description: Weblate is a libre software web-based continuous localization system.
category: productivity
version: 2026.8.1.0
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
    - name: cache
      engine: redis
      version: "7"
  applications:
    - name: weblate
      image: weblate/weblate@sha256:44cd8cc84c41079fa9559d7f3cb7e9b80990f2b1ef975868423e322a507edc1b
      port: 8080
      route: true
      health:
        kind: tcp
      volumes:
        - name: weblate-data
          path: /app/data
        - name: weblate-cache
          path: /app/cache
      env:
        DEFAULT_FROM_EMAIL: admin@example.com
        POSTGRES_DATABASE: '{{db.db.database}}'
        POSTGRES_HOST: '{{db.db.host}}'
        POSTGRES_PASSWORD: '{{db.db.password}}'
        POSTGRES_PORT: "5432"
        POSTGRES_USER: '{{db.db.user}}'
        REDIS_HOST: '{{db.cache.host}}'
        REDIS_PASSWORD: '{{db.cache.password}}'
        REDIS_PORT: "6379"
        WEBLATE_ADMIN_EMAIL: admin@example.com
        WEBLATE_ADMIN_NAME: Admin
        WEBLATE_ADMIN_PASSWORD: '{{secret.16}}'
        WEBLATE_SITE_DOMAIN: '{{domain}}'
