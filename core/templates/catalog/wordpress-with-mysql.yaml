# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: wordpress-with-mysql
name: WordPress with MySQL
description: WordPress is open source software you can use to create a beautiful website, blog, or app.
category: cms
resources:
  databases:
    - name: db
      engine: mysql
      version: "8"
  applications:
    - name: wordpress
      image: wordpress@sha256:b427cec767f5de2aa649390cb8805aa1fe320e1e0d57fc1f467754edb6cc0a49
      port: 80
      route: true
      health:
        kind: tcp
      volumes:
        - name: wordpress-files
          path: /var/www/html
      env:
        WORDPRESS_DB_HOST: '{{db.db.host}}'
        WORDPRESS_DB_NAME: '{{db.db.database}}'
        WORDPRESS_DB_PASSWORD: '{{db.db.password}}'
        WORDPRESS_DB_USER: '{{db.db.user}}'
first_login:
  kind: setup
  note: "Open the domain and run the WordPress installer — it creates your admin account."
