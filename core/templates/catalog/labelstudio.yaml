# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: labelstudio
name: Labelstudio
description: Label Studio is a multi-type data labeling and annotation tool with standardized output format
category: other
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: labelstudio
      image: heartexlabs/label-studio@sha256:aa461572e8f9d86a1bf9520c1db620204e86160fd2f80dd7e9d40ac84a8828ea
      port: 8080
      route: true
      health:
        kind: tcp
      volumes:
        - name: labelstudio-data
          path: /label-studio/data
      env:
        CSRF_TRUSTED_ORIGINS: https://{{domain}}
        DATA_UPLOAD_MAX_NUMBER_FILES: "10000"
        DJANGO_DB: default
        EXPERIMENTAL_FEATURES: "false"
        LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
        LABEL_STUDIO_HOST: https://{{domain}}
        LABEL_STUDIO_PASSWORD: '{{secret.16}}'
        LABEL_STUDIO_USERNAME: admin@example.com
        POSTGRE_HOST: '{{db.db.host}}'
        POSTGRE_NAME: '{{db.db.database}}'
        POSTGRE_PASSWORD: '{{db.db.password}}'
        POSTGRE_PORT: "5432"
        POSTGRE_USER: '{{db.db.user}}'
        SSRF_PROTECTION_ENABLED: "true"
