# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: pgbackweb
name: Pgbackweb
description: Effortless PostgreSQL backups with a user-friendly web interface!
category: dev-tools
version: 0.5.1
resources:
  databases:
    - name: db
      engine: postgresql
      version: "17"
  applications:
    - name: pgbackweb
      image: eduardolat/pgbackweb@sha256:56358e7adff53250ec0b43cf2764e723e45872fa2b92b9608fdddfeebaafbed7
      port: 8085
      route: true
      health:
        kind: tcp
      volumes:
        - name: pgbackweb-backups
          path: /backups
      env:
        PBW_ENCRYPTION_KEY: '{{secret.32}}'
        PBW_POSTGRES_CONN_STRING: postgresql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}?sslmode=disable
        TZ: UTC
