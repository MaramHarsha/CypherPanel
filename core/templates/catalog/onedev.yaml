# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: onedev
name: Onedev
description: Git server with CI/CD, kanban, and packages. Seamless integration. Unparalleled experience.
category: dev-tools
version: 16.5.3
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: onedev
      image: 1dev/server@sha256:824e5bc4fcdbcf5c56b7b80c01e8fc3eb0e036ba128e601edce292c4085dcf08
      port: 6610
      route: true
      health:
        kind: tcp
      volumes:
        - name: onedev-docker-sock
          path: /var/run/docker.sock
        - name: onedev-data
          path: /opt/onedev
      env:
        hibernate_connection_driver_class: org.postgresql.Driver
        hibernate_connection_password: '{{db.db.password}}'
        hibernate_connection_url: jdbc:postgresql://{{db.db.host}}:5432/{{db.db.database}}
        hibernate_connection_username: '{{db.db.user}}'
        hibernate_dialect: io.onedev.server.persistence.PostgreSQLDialect
        initial_email: mail@example.com
        initial_password: '{{secret.16}}'
        initial_server_url: https://{{domain}}
        initial_ssh_root_url: ssh://changeme:22
        initial_user: '{{secret.16}}'
