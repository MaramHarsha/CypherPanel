schema: v1
slug: supertokens-with-mysql
name: Supertokens with MySQL
description: An open-source authentication solution that simplifies the implementation of secure user authentication and session management for web and mobile applications.
category: security
resources:
  databases:
    - name: db
      engine: mysql
  applications:
    - name: supertokens
      image: registry.supertokens.io/supertokens/supertokens-mysql@sha256:3415a632603f1bab91aaff42d834b223d9d6ef8e92c5829ef12ae6505f92f9a6
      port: 3567
      route: true
      health:
        kind: tcp
      env:
        API_KEYS: ""
        MYSQL_CONNECTION_URI: mysql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:3306/{{db.db.database}}
first_login:
  kind: setup
  note: "SuperTokens is an auth backend with no dashboard login of its own; connect your app to it."
