schema: v1
slug: syncthing
name: Syncthing
description: Continuous peer-to-peer file synchronization between devices.
category: storage
version: "1.27"
resources:
  applications:
    - name: syncthing
      image: syncthing/syncthing:1.27
      port: 8384
      route: true
      health:
        kind: http
        path: /
      volumes:
        - name: data
          path: /var/syncthing
      ports:
        - host: 22000
          container: 22000
          protocol: tcp
        - host: 22000
          container: 22000
          protocol: udp
        - host: 21027
          container: 21027
          protocol: udp
