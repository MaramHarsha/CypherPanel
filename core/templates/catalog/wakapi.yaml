# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: wakapi
name: Wakapi
description: A minimalist, self-hosted WakaTime-compatible backend for coding statistics
category: analytics
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: wakapi
      image: ghcr.io/muety/wakapi@sha256:b2ed3753af47c5adef330243c2431b04940f2560b57b9dba6029fd851a8f64a9
      port: 3000
      route: true
      health:
        kind: tcp
      volumes:
        - name: wakapi-data
          path: /data
      env:
        TZ: Europe/Berlin
        WAKAPI_ALLOW_SIGNUP: "true"
        WAKAPI_DB_HOST: '{{db.db.host}}'
        WAKAPI_DB_NAME: '{{db.db.database}}'
        WAKAPI_DB_PASSWORD: '{{db.db.password}}'
        WAKAPI_DB_PORT: "5432"
        WAKAPI_DB_TYPE: '{{db.db.host}}'
        WAKAPI_DB_USER: '{{db.db.user}}'
        WAKAPI_DISABLE_FRONTPAGE: "true"
        WAKAPI_ENV: production
        WAKAPI_LEADERBOARD_ENABLED: "true"
        WAKAPI_MAIL_ENABLED: "false"
        WAKAPI_MAIL_PROVIDER: smtp
        WAKAPI_MAIL_SENDER: ""
        WAKAPI_MAIL_SMTP_HOST: ""
        WAKAPI_MAIL_SMTP_PASS: ""
        WAKAPI_MAIL_SMTP_PORT: "587"
        WAKAPI_MAIL_SMTP_TLS: "true"
        WAKAPI_MAIL_SMTP_USER: ""
        WAKAPI_PUBLIC_URL: ""
        WAKAPI_SECURITY_EXPOSE_METRICS: "false"
        WAKAPI_SECURITY_PASSWORD_SALT: '{{secret.32}}'
        WAKAPI_SERVER_LISTEN_IPV6: '"-"'
