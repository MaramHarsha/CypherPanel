schema: v1
slug: postiz
name: Postiz
description: Open source social media scheduling tool.
category: analytics
version: 2.10.1
resources:
  databases:
    - name: db
      engine: postgresql
      version: "14.5"
    - name: cache
      engine: redis
      version: "7.2"
  applications:
    - name: postiz
      image: ghcr.io/gitroomhq/postiz-app@sha256:065d2780396b88c5a03853e912703bca007e28abdab748b4c370457e967064a3
      port: 5000
      route: true
      health:
        kind: tcp
      volumes:
        - name: postiz-config
          path: /config/
        - name: postiz-uploads
          path: /uploads/
      env:
        BACKEND_INTERNAL_URL: http://localhost:3000
        BEEHIIVE_API_KEY: ""
        BEEHIIVE_PUBLICATION_ID: ""
        CLOUDFLARE_ACCESS_KEY: ""
        CLOUDFLARE_ACCOUNT_ID: ""
        CLOUDFLARE_BUCKET_URL: ""
        CLOUDFLARE_BUCKETNAME: ""
        CLOUDFLARE_REGION: ""
        CLOUDFLARE_SECRET_ACCESS_KEY: ""
        DATABASE_URL: postgresql://{{db.db.host}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}
        DISCORD_BOT_TOKEN_ID: ""
        DISCORD_CLIENT_ID: ""
        DISCORD_CLIENT_SECRET: ""
        DRIBBBLE_CLIENT_ID: ""
        DRIBBBLE_CLIENT_SECRET: ""
        EMAIL_FROM_ADDRESS: ""
        EMAIL_FROM_NAME: ""
        EMAIL_PROVIDER: ""
        FACEBOOK_APP_ID: ""
        FACEBOOK_APP_SECRET: ""
        FEE_AMOUNT: "0.05"
        FRONTEND_URL: https://{{domain}}
        GITHUB_CLIENT_ID: ""
        GITHUB_CLIENT_SECRET: ""
        INSTAGRAM_APP_ID: ""
        INSTAGRAM_APP_SECRET: ""
        IS_GENERAL: "true"
        JWT_SECRET: '{{secret.16}}'
        LINKEDIN_CLIENT_ID: ""
        LINKEDIN_CLIENT_SECRET: ""
        MAIN_URL: https://{{domain}}
        MASTODON_CLIENT_ID: ""
        MASTODON_CLIENT_SECRET: ""
        NEXT_PUBLIC_BACKEND_URL: https://{{domain}}/api
        NEXT_PUBLIC_DISCORD_SUPPORT: ""
        NEXT_PUBLIC_POLOTNO: ""
        NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
        NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: ""
        NOT_SECURED: "false"
        NX_ADD_PLUGINS: "false"
        OPENAI_API_KEY: ""
        PINTEREST_CLIENT_ID: ""
        PINTEREST_CLIENT_SECRET: ""
        REDDIT_CLIENT_ID: ""
        REDDIT_CLIENT_SECRET: ""
        REDIS_URL: redis://default:{{db.cache.password}}@{{db.cache.host}}:6379
