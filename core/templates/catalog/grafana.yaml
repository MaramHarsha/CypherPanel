schema: v1
slug: grafana
name: Grafana
description: Dashboards and visualization for metrics, logs, and traces.
category: monitoring
version: "11.4"
resources:
  applications:
    - name: grafana
      image: grafana/grafana:11.4.0
      port: 3000
      route: true
      health:
        kind: http
        path: /api/health
      volumes:
        - name: data
          path: /var/lib/grafana
      env:
        GF_SERVER_ROOT_URL: "https://{{domain}}"
