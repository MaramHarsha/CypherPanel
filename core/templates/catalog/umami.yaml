schema: v1
slug: umami
name: Umami
description: Privacy-friendly web analytics, a lightweight Google Analytics alternative.
category: analytics
version: "2.19"
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: umami
      image: ghcr.io/umami-software/umami:postgresql-v2.19.0
      port: 3000
      route: true
      health:
        kind: http
        path: /api/heartbeat
      env:
        DATABASE_URL: "{{db.db.url}}"
        DATABASE_TYPE: postgresql
        APP_SECRET: "{{secret.32}}"
first_login:
  kind: setup
  note: "Sign in with admin / umami, then change the password immediately under Settings."
