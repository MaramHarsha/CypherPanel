schema: v1
slug: bugsink
name: Bugsink
description: Self-hosted Error Tracking.
category: monitoring
version: 2.5.0
resources:
  databases:
    - name: db
      engine: mysql
  applications:
    - name: web
      image: bugsink/bugsink@sha256:b697016950d8aa7d94020def15bc2727e8fc40148f079884ae4cdacf7ea1e9a3
      port: 8000
      route: true
      health:
        kind: tcp
      env:
        BASE_URL: https://{{domain}}
        BEHIND_HTTPS_PROXY: "True"
        CREATE_SUPERUSER: admin:{{db.db.password}}
        DATABASE_URL: mysql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:3306/{{db.db.database}}
        SECRET_KEY: '{{db.db.password}}'
