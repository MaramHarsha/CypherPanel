# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: langflow
name: Langflow
description: Langflow is an open-source, Python-based, customizable framework for building AI applications.
category: ai
version: 1.7.2
resources:
  databases:
    - name: db
      engine: postgresql
      version: "18"
  applications:
    - name: langflow
      image: langflowai/langflow@sha256:be24b8bd0777e2b15c3dd11228a8c850a7df0d63c2e80c72a39d887d2d05a6d7
      port: 7860
      route: true
      health:
        kind: tcp
      volumes:
        - name: langflow-data
          path: /app/langflow
      env:
        LANGFLOW_AUTO_LOGIN: "false"
        LANGFLOW_CONFIG_DIR: app/langflow
        LANGFLOW_DATABASE_URL: postgresql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}
        LANGFLOW_HOST: 0.0.0.0
        LANGFLOW_SUPERUSER: '{{secret.16}}'
        LANGFLOW_SUPERUSER_PASSWORD: '{{secret.16}}'
        PORT: "7860"
first_login:
  kind: credentials
  username_env: LANGFLOW_SUPERUSER
  password_env: LANGFLOW_SUPERUSER_PASSWORD
  note: "Both the superuser name and the password were generated for this install."
