# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: docuseal-with-postgres
name: Docuseal with PostgreSQL
description: Document Signing for Everyone free forever for individuals, extensible for businesses and developers. Open Source Alternative to DocuSign, PandaDoc and more.
category: productivity
version: 3.2.1
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: docuseal
      image: docuseal/docuseal@sha256:32433e4cb80ded38ac4125760c452009bd14a433cf0776767ea6ce48f8c3afb1
      port: 3000
      route: true
      health:
        kind: tcp
      volumes:
        - name: docuseal-data
          path: /data
      env:
        DATABASE_URL: postgresql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}
        HOST: https://{{domain}}
