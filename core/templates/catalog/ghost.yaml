schema: v1
slug: ghost
name: Ghost
description: Ghost is a content management system (CMS) and blogging platform.
category: cms
version: "5"
resources:
  databases:
    - name: db
      engine: mysql
      version: "8.0"
  applications:
    - name: ghost
      image: ghost@sha256:3ffcb8f2f1f808806e7a0f694a2b130cd78652a26b4337b33fe7e249ce58665a
      port: 2368
      route: true
      health:
        kind: tcp
      volumes:
        - name: ghost-content-data
          path: /var/lib/ghost/content
      env:
        database__client: '{{db.db.host}}'
        database__connection__database: '{{db.db.database}}'
        database__connection__host: '{{db.db.host}}'
        database__connection__password: '{{db.db.password}}'
        database__connection__user: '{{db.db.user}}'
        mail__options__auth__pass: ""
        mail__options__auth__user: ""
        mail__options__host: ""
        mail__options__port: "465"
        mail__options__secure: "true"
        mail__options__service: Mailgun
        mail__transport: SMTP
        url: https://{{domain}}
