# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: fizzy
name: Fizzy
description: Kanban tracking tool for issues and ideas by 37signals
category: productivity
resources:
  applications:
    - name: fizzy
      image: ghcr.io/basecamp/fizzy@sha256:497c3cc9b51ab650010201a37cc3c89d40158ca8a4f2dbe8912493246cb8e8da
      port: 80
      route: true
      health:
        kind: tcp
      volumes:
        - name: fizzy-data
          path: /rails/db
        - name: fizzy-storage
          path: /rails/storage
      env:
        DATABASE_ADAPTER: sqlite
        RAILS_ENV: production
        RAILS_LOG_TO_STDOUT: "true"
        RAILS_MASTER_KEY: '{{secret.32}}'
        RAILS_SERVE_STATIC_FILES: "true"
        SECRET_KEY_BASE: '{{secret.16}}'
        SOLID_QUEUE_CONNECTS_TO: "false"
        VAPID_PRIVATE_KEY: ""
        VAPID_PUBLIC_KEY: ""
first_login:
  kind: setup
  note: "Open the domain and create the first account."
