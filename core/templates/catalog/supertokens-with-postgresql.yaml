schema: v1
slug: supertokens-with-postgresql
name: Supertokens with PostgreSQL
description: An open-source authentication solution that simplifies the implementation of secure user authentication and session management for web and mobile applications.
category: security
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: supertokens
      image: registry.supertokens.io/supertokens/supertokens-postgresql@sha256:b318fc292466ca960c88c6fd80bb85183510bd5d7a7bfea9da785219ad76ec9e
