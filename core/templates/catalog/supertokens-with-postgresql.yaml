      route: true
      health:
        kind: tcp
      env:
        API_KEYS: ""
        POSTGRESQL_CONNECTION_URI: '"postgresql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}"'
