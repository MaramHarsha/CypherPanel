# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: tolgee
name: Tolgee
description: Tolgee is a localization management platform for developers and translators.
category: other
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: tolgee
      image: tolgee/tolgee@sha256:ccbf160f5a1ef08e9d18bc3ea69650298083dcea58782af3f4f6ee36b4ff7403
      port: 8080
      route: true
      health:
        kind: tcp
      volumes:
        - name: tolgee-data
          path: /data
      env:
        SPRING_DATASOURCE_PASSWORD: '{{db.db.password}}'
        SPRING_DATASOURCE_URL: jdbc:postgresql://{{db.db.host}}:5432/{{db.db.database}}
        SPRING_DATASOURCE_USERNAME: '{{db.db.user}}'
        TOLGEE_AUTHENTICATION_ENABLED: "true"
        TOLGEE_AUTHENTICATION_INITIAL_PASSWORD: '{{secret.16}}'
        TOLGEE_AUTHENTICATION_INITIAL_USERNAME: admin
        TOLGEE_AUTHENTICATION_JWT_SECRET: '{{secret.16}}'
        TOLGEE_POSTGRES_AUTOSTART_ENABLED: "false"
