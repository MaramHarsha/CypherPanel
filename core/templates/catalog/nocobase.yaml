# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: nocobase
name: Nocobase
description: NocoBase is the most extensible AI-powered no-code/low-code platform.
category: dev-tools
version: 1.9.33
resources:
  databases:
    - name: db
      engine: postgresql
      version: "17"
  applications:
    - name: nocobase
      image: nocobase/nocobase@sha256:a56d4cef3c3c5298ec416df23ae36bdb23762153fd8ba1b584edf99516abf0da
      port: 13000
      route: true
      health:
        kind: tcp
      volumes:
        - name: nocobase-storage
          path: /app/nocobase/storage
      env:
        APP_KEY: '{{secret.32}}'
        DB_DATABASE: '{{db.db.database}}'
        DB_DIALECT: '{{db.db.host}}'
        DB_HOST: '{{db.db.host}}'
        DB_PASSWORD: '{{db.db.password}}'
        DB_PORT: "5432"
        DB_USER: '{{db.db.user}}'
first_login:
  kind: setup
  note: "Open the domain and complete the NocoBase installer."
