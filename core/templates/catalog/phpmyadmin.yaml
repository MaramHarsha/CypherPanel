schema: v1
slug: phpmyadmin
name: phpMyAdmin
description: phpMyAdmin is a web-based database management tool for administering your MySQL and MariaDB databases through a user-friendly interface.
category: storage
resources:
  applications:
    - name: phpmyadmin
      image: lscr.io/linuxserver/phpmyadmin@sha256:c6679f5360638a4dc8e9f3de2aafc66a8f6899edab35920da19f7791b34526b0
      port: 80
      route: true
      health:
        kind: tcp
      volumes:
        - name: phpmyadmin-config
          path: /config
      env:
        PGID: "1000"
        PMA_ABSOLUTE_URI: https://{{domain}}
        PMA_ARBITRARY: "1"
        PUID: "1000"
        TZ: Europe/Madrid
