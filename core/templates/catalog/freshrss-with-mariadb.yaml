# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: freshrss-with-mariadb
name: FreshRSS with MariaDB
description: A free, self-hostable feed aggregator.
category: productivity
version: 1.29.1
resources:
  databases:
    - name: db
      engine: mariadb
      version: "11"
  applications:
    - name: freshrss
      image: freshrss/freshrss@sha256:ab6b363102ccdbc39f6a62db926f567c61a5289bf25ba460f1c34423d8cc1a4d
      port: 80
      route: true
      health:
        kind: tcp
      volumes:
        - name: freshrss-data
          path: /var/www/FreshRSS/data
        - name: freshrss-extensions
          path: /var/www/FreshRSS/extensions
      env:
        CRON_MIN: 1,31
        MARIADB_DB: '{{db.db.database}}'
        MARIADB_PASSWORD: '{{db.db.password}}'
        MARIADB_USER: '{{db.db.user}}'
first_login:
  kind: setup
  note: "Open the domain and run the FreshRSS installer — it creates your admin account."
