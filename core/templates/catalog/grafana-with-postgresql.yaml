# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: grafana-with-postgresql
name: Grafana With Postgresql
description: Grafana is the open source analytics & monitoring solution for every database.
category: monitoring
version: 13.0.2
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: grafana
      image: grafana/grafana-oss@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
      port: 3000
      route: true
      health:
        kind: tcp
      volumes:
        - name: grafana-data
          path: /var/lib/grafana
      env:
        GF_DATABASE_HOST: '{{db.db.host}}'
        GF_DATABASE_NAME: '{{db.db.database}}'
        GF_DATABASE_PASSWORD: '{{db.db.password}}'
        GF_DATABASE_TYPE: postgres
        GF_DATABASE_USER: '{{db.db.user}}'
        GF_SECURITY_ADMIN_PASSWORD: '{{secret.16}}'
        GF_SERVER_DOMAIN: '{{domain}}'
        GF_SERVER_ROOT_URL: https://{{domain}}
