# Converted from Coolify's compose template library by core/cmd/coolify-import.
# Reviewed and committed like a hand-written template; the catalog test is the gate.
schema: v1
slug: metamcp
name: Metamcp
description: MCP Aggregator, Orchestrator, Middleware, Gateway in one app
category: ai
version: "2.4"
resources:
  databases:
    - name: db
      engine: postgresql
      version: "16"
  applications:
    - name: app
      image: ghcr.io/metatool-ai/metamcp@sha256:6d5e0cba4ffc4976069a980723c11042f993a978fe0f3071ba2ec8a91ebc3d41
      port: 12008
      route: true
      health:
        kind: tcp
      env:
        APP_URL: https://{{domain}}
        BETTER_AUTH_SECRET: '{{secret.16}}'
        DATABASE_URL: postgresql://{{db.db.user}}:{{db.db.password}}@{{db.db.host}}:5432/{{db.db.database}}
        NEXT_PUBLIC_APP_URL: https://{{domain}}
        POSTGRES_DB: '{{db.db.database}}'
        POSTGRES_HOST: '{{db.db.host}}'
        POSTGRES_PASSWORD: '{{db.db.password}}'
        POSTGRES_PORT: "5432"
        POSTGRES_USER: '{{db.db.user}}'
        TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "true"
