# Publishes the binaries install.sh and agent.sh download.
#
# Neither installer can work without this: install.sh defaults CYPHERD_URL to
# this workflow's `cypherd-linux-<arch>` asset, and agent.sh needs
# CYPHER_AGENT_URL pointed at `cypher-agent-linux-<arch>` (ADR-010: the control
# plane names versions but never stores or relays agent binaries, so the
# artifacts must live somewhere that is not the plane — here).
#
# Tag a release to publish:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

# Read-only by default. Write is granted to the publish job alone, which never
# executes anything built from the tag.
permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"
  # One source of truth for the ref being released. Resolving this per-step is
  # what broke manual runs: on workflow_dispatch GITHUB_REF_NAME is the branch
  # the run was started from and is always non-empty, so a
  # "${GITHUB_REF_NAME:-<input>}" fallback silently never reached the input —
  # binaries were stamped "main" and `gh release create main --verify-tag`
  # aborted, because main is a branch. github.ref_name is the tag on a tag push
  # and the input takes precedence on a dispatch.
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Builds and smoke-tests. This job RUNS code from the tag, so it holds no
  # credential worth stealing: contents:read, and persist-credentials:false so
  # the job token is not left in .git/config for the binary under test to read.
  # A malicious tag previously reached a runner that could rewrite tags and
  # release assets — the compromised-tag case the offline signing key exists to
  # contain, defeated by handing the same power to the runner instead.
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # The web UI is committed built (core/api/rest/webui/dist) so `go build`
      # needs no Node toolchain — the same property CI's drift check enforces.
      # Nothing to do here but confirm it is present, because shipping a
      # release whose panel is an empty page would be worse than failing.
      - name: Verify the embedded web UI is present
        run: |
          test -f core/api/rest/webui/dist/index.html \
            || { echo "core/api/rest/webui/dist is missing — run 'make build-web' and commit it"; exit 1; }

      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          # cypherd carries all three stamps: GET /api/v1/panel/version and
          # `cypherd version` serve them, so a bug report names an exact build
          # (docs/features/control-plane-hardening.md §3). The agent declares
          # only main.version, so it gets only that — an -X for a symbol the
          # binary does not define is silently dropped, which would hide a typo.
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PLANE_STAMPS="-X main.version=$VERSION -X main.commit=$COMMIT -X main.buildDate=$BUILD_DATE"
          for arch in amd64 arm64; do
            # Static, no cgo: these land on unknown distros and must not need a
            # matching libc.
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -C core -trimpath -ldflags "-s -w $PLANE_STAMPS" \
                -o "../dist/cypherd-linux-$arch" ./cmd/cypherd
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -C agent -trimpath -ldflags "-s -w -X main.version=$VERSION" \
                -o "../dist/cypher-agent-linux-$arch" ./cmd/cypher-agent
          done
          ls -la dist

      # install.sh and agent.sh both accept a SHA256 and verify it. Publishing
      # the sums is what makes that check usable by anyone.
      - name: Checksums
        run: cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Smoke-test the amd64 build
        run: |
          chmod +x dist/cypherd-linux-amd64
          # No database is configured here, so it must fail on that and not on
          # something structural like a missing embedded asset.
          out="$(./dist/cypherd-linux-amd64 2>&1 || true)"
          echo "$out"
          case "$out" in
            *DATABASE_URL*|*database*|*config*) echo "starts and reaches config validation" ;;
            *) echo "unexpected startup output — refusing to publish"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Holds contents:write and therefore executes nothing from the tag: no
  # checkout, no build, no binary invoked. It only moves bytes the previous job
  # produced into a draft release.
  publish:
    name: Publish draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > notes.md <<EOF
          ## Install the control plane

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install/install.sh | sh
          \`\`\`

          Then open the panel and create the owner account — that screen appears
          exactly once, so claim it before anyone else can reach the port.

          ## Join a server

          Use the command the panel shows you, with the agent binary from this
          release:

          \`\`\`sh
          export CYPHER_AGENT_URL=https://github.com/${{ github.repository }}/releases/download/$VERSION/cypher-agent-linux-{arch}
          \`\`\`

          The \`export\` matters: the panel's join command passes its own
          variables directly to \`sh\`, so a plain assignment would not be
          inherited and the installer would stop at "no agent binary found".

          ## Verifying this release

          \`SHA256SUMS\` lists a digest for every artifact, and
          \`SHA256SUMS.sig\` is that manifest signed with the offline release
          key. Check the signature first, then the digests — the checksums prove
          a download arrived intact, the signature is what proves the release is
          ours, and only the second survives someone who can replace assets:

          \`\`\`sh
          # RELEASE_PUBKEY is published in docs/dev/release-signing.md
          go run -C core ./cmd/release-sign -verify \\
            -in SHA256SUMS -sig SHA256SUMS.sig -key "\$RELEASE_PUBKEY"
          sha256sum -c SHA256SUMS
          \`\`\`

          \`install.sh\` and \`agent.sh\` verify a digest when you pass
          \`CYPHERD_SHA256\` / \`CYPHER_AGENT_SHA256\`.
          EOF
          # --draft is the enforcement, not a convenience. ADR-010 requires an
          # OFFLINE release key, so this workflow cannot sign: an Actions secret
          # is available to every workflow and to whatever code a compromised tag
          # makes the runner execute, and a key CI can read is a key an attacker
          # who reaches CI can use to sign fleet-wide binaries. Publishing a
          # draft means an unsigned release is never public — the release
          # manager signs SHA256SUMS offline, uploads the signature, and only
          # then publishes. See docs/dev/release-signing.md.
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --notes-file notes.md \
            --verify-tag \
            --draft
          echo
          echo "Draft release created. It is NOT public until it is signed:"
          echo "  make release-sign VERSION=$VERSION"
