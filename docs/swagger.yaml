components:
  schemas:
    api.accountResponse:
      properties:
        created_at:
          type: string
        email:
          type: string
        id:
          type: string
        package_id:
          type: string
        package_name:
          type: string
        php_settings:
          additionalProperties:
            type: string
          type: object
        php_version:
          type: string
        primary_domain:
          type: string
        server_id:
          type: string
        server_name:
          type: string
        ssl_expires_at:
          type: string
        ssl_status:
          type: string
        status:
          type: string
        system_username:
          type: string
        username:
          type: string
      type: object
    api.changePHPVersionRequest:
      properties:
        version:
          type: string
      required:
      - version
      type: object
    api.createAccountRequest:
      properties:
        domain:
          type: string
        email:
          type: string
        package_id:
          type: string
        password:
          minLength: 12
          type: string
        server_id:
          type: string
        username:
          type: string
      required:
      - domain
      - email
      - package_id
      - password
      - server_id
      - username
      type: object
    api.createDatabaseRequest:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    api.createFTPRequest:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    api.createPackageRequest:
      properties:
        limits:
          $ref: '#/components/schemas/api.packageLimits'
        name:
          type: string
      required:
      - name
      type: object
    api.createResellerRequest:
      properties:
        email:
          type: string
        max_accounts:
          type: integer
        max_disk_mb:
          type: integer
        password:
          minLength: 12
          type: string
        username:
          type: string
      required:
      - email
      - password
      - username
      type: object
    api.createTaskRequest:
      type: object
    api.cronResponse:
      properties:
        content:
          type: string
      type: object
    api.databaseResponse:
      properties:
        created_at:
          type: string
        db_host:
          type: string
        db_user:
          type: string
        id:
          type: string
        name:
          type: string
        status:
          type: string
      type: object
    api.dnsRecordRequest:
      properties:
        contents:
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          type: string
        ttl:
          type: integer
        type:
          type: string
      required:
      - contents
      - name
      - type
      type: object
    api.fileContentResponse:
      properties:
        content:
          type: string
      type: object
    api.ftpResponse:
      properties:
        created_at:
          type: string
        home_dir:
          type: string
        id:
          type: string
        status:
          type: string
        username:
          type: string
      type: object
    api.loginRequest:
      properties:
        password:
          type: string
        username:
          type: string
      required:
      - password
      - username
      type: object
    api.logoutRequest:
      properties:
        refresh_token:
          type: string
      type: object
    api.packageLimits:
      properties:
        bandwidth_mb:
          type: integer
        cpu_quota_pct:
          type: integer
        databases:
          type: integer
        disk_mb:
          type: integer
        domains:
          type: integer
        email_accounts:
          type: integer
        memory_max_mb:
          type: integer
      type: object
    api.packageResponse:
      properties:
        created_at:
          type: string
        id:
          type: string
        limits:
          $ref: '#/components/schemas/api.packageLimits'
        name:
          type: string
      type: object
    api.pathRequest:
      properties:
        path:
          type: string
      required:
      - path
      type: object
    api.phpRuntimeRequest:
      properties:
        action:
          description: install | uninstall
          type: string
        version:
          type: string
      required:
      - action
      - version
      type: object
    api.pluginResponse:
      properties:
        enabled:
          type: boolean
        installed_at:
          type: string
        kind:
          type: string
        name:
          type: string
        version:
          type: string
      type: object
    api.refreshRequest:
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      type: object
    api.renameRequest:
      properties:
        new_path:
          type: string
        path:
          type: string
      required:
      - new_path
      - path
      type: object
    api.resellerResponse:
      properties:
        account_count:
          type: integer
        created_at:
          type: string
        email:
          type: string
        id:
          type: string
        max_accounts:
          type: integer
        max_disk_mb:
          type: integer
        username:
          type: string
      type: object
    api.serverResponse:
      properties:
        agent_status:
          type: string
        created_at:
          type: string
        disk_total_bytes:
          type: integer
        disk_used_bytes:
          type: integer
        hostname:
          type: string
        id:
          type: string
        ip_address:
          type: string
        last_seen_at:
          type: string
        load_1m:
          type: number
        memory_total_bytes:
          type: integer
        memory_used_bytes:
          type: integer
        name:
          type: string
        services:
          items:
            $ref: '#/components/schemas/api.serviceStatus'
          type: array
          uniqueItems: false
      type: object
    api.serviceControlRequest:
      properties:
        action:
          type: string
      required:
      - action
      type: object
    api.serviceStatus:
      properties:
        name:
          type: string
        state:
          type: string
      type: object
    api.setCronRequest:
      properties:
        content:
          type: string
      type: object
    api.tokenResponse:
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
      type: object
    api.updatePHPSettingsRequest:
      properties:
        settings:
          additionalProperties:
            type: string
          type: object
      type: object
    api.writeFileRequest:
      properties:
        content:
          type: string
        path:
          type: string
      required:
      - path
      type: object
    audit.Record:
      properties:
        action:
          type: string
        actor_name:
          type: string
        actor_role:
          type: string
        created_at:
          type: string
        detail:
          additionalProperties: {}
          type: object
        id:
          type: string
        ip_address:
          type: string
        target_id:
          type: string
        target_type:
          type: string
      type: object
    dns.Record:
      properties:
        contents:
          description: record data lines (e.g. "10 mail.example.com.")
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          description: FQDN (trailing dot normalised by the provider)
          type: string
        ttl:
          description: seconds
          type: integer
        type:
          description: A, AAAA, CNAME, MX, TXT, SRV, CAA, NS
          type: string
      type: object
    filemanager.Entry:
      properties:
        is_dir:
          type: boolean
        mod_time:
          description: RFC3339
          type: string
        mode:
          type: string
        name:
          type: string
        size:
          type: integer
      type: object
    filemanager.Response:
      properties:
        content:
          items:
            type: integer
          type: array
          uniqueItems: false
        entries:
          items:
            $ref: '#/components/schemas/filemanager.Entry'
          type: array
          uniqueItems: false
        error:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and the access token.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: Control-plane REST API for CypherPanel, the open-source cPanel/WHM
    alternative.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: CypherPanel API
  version: 0.1.0
openapi: 3.1.0
paths:
  /admin/accounts:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/api.accountResponse'
                type: array
          description: OK
      security:
      - BearerAuth: []
      summary: List accounts (root admin only)
      tags:
      - admin
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.createAccountRequest'
                description: Account definition
                summary: request
        description: Account definition
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.accountResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Create a hosting account (root admin only)
      tags:
      - admin
  /admin/accounts/{id}/cron:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.cronResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Get an account's crontab
      tags:
      - admin
    put:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.setCronRequest'
                description: Crontab content
                summary: request
        description: Crontab content
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Replace an account's crontab
      tags:
      - admin
  /admin/accounts/{id}/databases:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/api.databaseResponse'
                type: array
          description: OK
      security:
      - BearerAuth: []
      summary: List an account's databases
      tags:
      - admin
    post:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.createDatabaseRequest'
                description: Database name (suffix)
                summary: request
        description: Database name (suffix)
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.databaseResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      security:
      - BearerAuth: []
      summary: Create a database for an account
      tags:
      - admin
  /admin/accounts/{id}/databases/{dbid}:
    delete:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Database ID
        in: path
        name: dbid
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Accepted
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      security:
      - BearerAuth: []
      summary: Delete an account database
      tags:
      - admin
  /admin/accounts/{id}/databases/{dbid}/adminer:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Database ID
        in: path
        name: dbid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: One-click Adminer handoff for a database
      tags:
      - admin
  /admin/accounts/{id}/databases/{dbid}/password:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Database ID
        in: path
        name: dbid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Conflict
      security:
      - BearerAuth: []
      summary: Reveal an account database password
      tags:
      - admin
  /admin/accounts/{id}/dns:
    delete:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Record name
        in: query
        name: name
        required: true
        schema:
          type: string
      - description: Record type
        in: query
        name: type
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Delete a DNS record
      tags:
      - admin
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/dns.Record'
                type: array
          description: OK
      security:
      - BearerAuth: []
      summary: List an account's DNS records
      tags:
      - admin
    post:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.dnsRecordRequest'
                description: DNS record
                summary: request
        description: DNS record
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Create or update a DNS record
      tags:
      - admin
  /admin/accounts/{id}/file:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: File path relative to account home
        in: query
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.fileContentResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Read a file's contents
      tags:
      - admin
    put:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.writeFileRequest'
                description: Path + content
                summary: request
        description: Path + content
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Write a file's contents
      tags:
      - admin
  /admin/accounts/{id}/files:
    delete:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Path relative to account home
        in: query
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Delete a file or directory
      tags:
      - admin
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Path relative to account home
        in: query
        name: path
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filemanager.Response'
          description: OK
      security:
      - BearerAuth: []
      summary: List files in an account directory
      tags:
      - admin
  /admin/accounts/{id}/files/dir:
    post:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.pathRequest'
                description: Directory path
                summary: request
        description: Directory path
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Create a directory
      tags:
      - admin
  /admin/accounts/{id}/files/extract:
    post:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.pathRequest'
                description: Archive path
                summary: request
        description: Archive path
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Extract a zip archive
      tags:
      - admin
  /admin/accounts/{id}/files/rename:
    post:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.renameRequest'
                description: Path + new_path
                summary: request
        description: Path + new_path
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Rename a file or directory
      tags:
      - admin
  /admin/accounts/{id}/ftp:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/api.ftpResponse'
                type: array
          description: OK
      security:
      - BearerAuth: []
      summary: List an account's FTP users
      tags:
      - admin
    post:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.createFTPRequest'
                description: FTP name (suffix)
                summary: request
        description: FTP name (suffix)
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ftpResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Create an FTP user for an account
      tags:
      - admin
  /admin/accounts/{id}/ftp/{ftpid}:
    delete:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: FTP user ID
        in: path
        name: ftpid
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Accepted
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      security:
      - BearerAuth: []
      summary: Delete an account FTP user
      tags:
      - admin
  /admin/accounts/{id}/ftp/{ftpid}/password:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: FTP user ID
        in: path
        name: ftpid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Conflict
      security:
      - BearerAuth: []
      summary: Reveal an FTP user's password
      tags:
      - admin
  /admin/accounts/{id}/php-settings:
    patch:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.updatePHPSettingsRequest'
                description: Allowlisted php.ini overrides
                summary: request
        description: Allowlisted php.ini overrides
