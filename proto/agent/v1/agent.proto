// CypherCore <-> CypherAgent contract. This file is the source of truth
// (plan.md: API Contract & Repository Strategy). Never reuse or renumber a
// field once shipped — only add new optional fields — because Core and Agent
// versions will drift during rolling upgrades across the fleet.
syntax = "proto3";

package cypherpanel.agent.v1;

option go_package = "github.com/MaramHarsha/CypherPanel/gen/agent/v1;agentv1";

// AgentService is served by CypherCore; agents dial in over mTLS.
service AgentService {
  // Register introduces a new agent to the control plane (first boot).
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Heartbeat reports liveness and basic host stats.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // ReportTaskResult delivers the outcome of an asynchronous task the agent
  // picked up from the job queue. Tasks are idempotent and identified by
  // task_id, so redelivery after a network failure is safe.
  rpc ReportTaskResult(ReportTaskResultRequest) returns (ReportTaskResultResponse);

  // FetchBackupCredentials hands an agent the secrets for one backup
  // destination. Destination credentials (restic repo password, S3/SFTP keys)
  // are deliberately kept OUT of the task payload: JetStream retains task
  // messages, so a payload secret would be readable by anyone with stream
  // access. The agent instead pulls them over this authenticated mTLS channel,
  // proving it holds the task that references the destination.
  rpc FetchBackupCredentials(FetchBackupCredentialsRequest) returns (FetchBackupCredentialsResponse);
}

message RegisterRequest {
  string hostname = 1;
  string ip_address = 2;
  string agent_version = 3;
  string distro_family = 4; // "debian" | "rhel" | "unknown"
  string distro_pretty_name = 5;
  // Operator-assigned region for fleet grouping and data-residency scoping
  // (plan.md §17). Add-only field; older agents omit it and their server keeps
  // whatever region the panel already recorded.
  string region = 6;
}

message RegisterResponse {
  string server_id = 1; // control-plane UUID for this server
}

message HeartbeatRequest {
  string server_id = 1;
  HostStats stats = 2;
  // Status of managed system services (nginx, mariadb, ...). Add-only field;
  // older agents simply omit it.
  repeated ServiceStatus services = 3;
}

message ServiceStatus {
  string name = 1;
  string state = 2; // active | inactive | failed | activating | unknown
}

message HostStats {
  double load_1m = 1;
  uint64 memory_total_bytes = 2;
  uint64 memory_used_bytes = 3;
  uint64 disk_total_bytes = 4;
  uint64 disk_used_bytes = 5;
}

message HeartbeatResponse {}

message ReportTaskResultRequest {
  string server_id = 1;
  string task_id = 2;
  TaskStatus status = 3;
  string error_message = 4; // set when status is TASK_STATUS_FAILED
  // Task-type-specific result data (add-only). e.g. ssl.issue reports
  // "ssl_not_after" (RFC3339) so Core can schedule renewal.
  map<string, string> metadata = 5;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_SUCCEEDED = 1;
  TASK_STATUS_FAILED = 2;
}

message ReportTaskResultResponse {}

message FetchBackupCredentialsRequest {
  string server_id = 1;
  // task_id must be a task assigned to this server that references
  // destination_id — Core re-checks the pairing before releasing secrets.
  string task_id = 2;
  string destination_id = 3;
}

message FetchBackupCredentialsResponse {
  // repository is the restic repository URL, e.g.
  // "s3:s3.amazonaws.com/bucket/prefix" or an absolute local path.
  string repository = 1;
  // password unlocks the restic repository (repo encryption key).
  string password = 2;
  // env carries backend credentials as restic expects them in the process
  // environment (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ...). They are
  // passed to restic via env, never as argv, so they stay out of the process
  // table and any command log.
  map<string, string> env = 3;
}
